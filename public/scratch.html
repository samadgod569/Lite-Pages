<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start from scratch – Fast Site</title>
<meta name="description" content="Create a new Fast Site app from scratch.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fafbfc;--surface:rgba(255,255,255,.72);--solid:#fff;--soft:#f1f4f6;--line:#e2e8ec;--text:#09090b;--muted:#566069;--accent:#0e7490;--accent2:#6366f1;--accent-ink:#fff;--glow:#d5eff5;--danger:#b91c1c;--ok:#16a34a;--shadow:0 24px 60px -28px rgba(14,116,144,.35);--grid:rgba(9,9,11,.05)}
  [data-theme=dark]{color-scheme:dark;--bg:#030507;--surface:rgba(16,20,24,.7);--solid:#0c1014;--soft:#12171c;--line:#222a31;--text:#fafafa;--muted:#9aa5ae;--accent:#5be0f0;--accent2:#8b8dff;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80;--shadow:0 24px 60px -28px rgba(91,224,240,.28);--grid:rgba(255,255,255,.045)}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* animated backdrop */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent 80%);mask-image:radial-gradient(70% 60% at 50% 20%,#000,transparent 80%)}
  .bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:float 18s ease-in-out infinite}
  .bg i:nth-child(1){width:520px;height:520px;background:var(--accent);left:-120px;top:-160px;opacity:.28}
  .bg i:nth-child(2){width:460px;height:460px;background:var(--accent2);right:-100px;top:10%;opacity:.22;animation-delay:-6s;animation-duration:22s}
  .bg i:nth-child(3){width:380px;height:380px;background:var(--accent);left:35%;bottom:-200px;opacity:.16;animation-delay:-11s;animation-duration:26s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.1)}66%{transform:translate(-40px,70px) scale(.94)}}

  main{flex:1;padding:64px 28px 96px;position:relative}
  .wrap{max-width:1180px;margin:0 auto}

  /* header */
  .dots{display:flex;gap:8px;margin:0 0 26px;max-width:260px}
  .dots i{position:relative;flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
  .dots i::after{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
  .dots i.on::after{transform:scaleX(1)}
  .step{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin:0 0 12px;padding:5px 12px 5px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
  .step::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
  h1{font-size:clamp(32px,4.4vw,52px);letter-spacing:-.04em;line-height:1.08;margin:0 0 12px;background:linear-gradient(120deg,var(--text) 40%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0 0 40px;color:var(--muted);font-size:18px;max-width:620px}
  .head-in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  .head-in.d2{animation-delay:.06s}.head-in.d3{animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  #view.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
  #view.enter>*:nth-child(2){animation-delay:.07s}#view.enter>*:nth-child(3){animation-delay:.14s}

  /* buttons */
  .btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(10px);color:var(--text);transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,filter .2s}
  .btn:hover{border-color:var(--text);transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.98)}
  .btn.main{background:linear-gradient(120deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 12px 30px -12px var(--accent)}
  [data-theme=dark] .btn.main{color:#001418;background:linear-gradient(120deg,var(--accent),#a5b4fc)}
  .btn.main:hover{filter:brightness(1.08);box-shadow:0 18px 38px -12px var(--accent)}
  .btn.main::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s}
  .btn.main:hover::after{left:140%}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .acts{display:flex;gap:12px;justify-content:flex-end;margin-top:32px;flex-wrap:wrap}

  /* step 1 */
  .choices{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;max-width:960px}
  .choice{--mx:50%;--my:50%;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;text-align:left;padding:34px 32px 30px;border:1.5px solid var(--line);border-radius:28px;background:var(--surface);backdrop-filter:blur(14px);color:var(--text);font:inherit;cursor:pointer;transition:border-color .25s,transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .choice::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx) var(--my),var(--glow),transparent 60%);opacity:0;transition:opacity .3s}
  .choice:hover::before{opacity:1}
  .choice:hover{border-color:var(--accent);transform:translateY(-8px);box-shadow:var(--shadow)}
  .choice>*{position:relative}
  .choice .ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-bottom:14px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  [data-theme=dark] .choice .ico{color:#001418}
  .choice .ico svg{width:30px;height:30px}
  .choice:hover .ico{transform:rotate(-8deg) scale(1.1)}
  .choice.alt .ico{background:var(--soft);color:var(--text);border:1px solid var(--line)}
  .choice b{font-size:21px;letter-spacing:-.02em;line-height:1.3}
  .choice small{font-size:15px;color:var(--muted);line-height:1.55}
  .choice .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--accent)}
  .choice .go svg{width:18px;height:18px;transition:transform .25s}
  .choice:hover .go svg{transform:translateX(6px)}
  .choice .rec{position:absolute;top:22px;right:22px;padding:3px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}

  /* step 2 */
  .split{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:56px;align-items:start}
  .card{padding:34px;border:1px solid var(--line);border-radius:28px;background:var(--surface);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  label .opt{font-weight:500;color:var(--muted)}
  input[type=text],textarea{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--text);font:500 16px Inter,sans-serif;transition:border-color .2s,box-shadow .2s}
  textarea{min-height:120px;resize:vertical;line-height:1.5}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
  input[type=text].bad{border-color:var(--danger);animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fg+.fg{margin-top:24px}
  .hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
  .count{float:right;font-weight:500;color:var(--muted);font-size:13px}
  .msg{display:none;align-items:flex-start;gap:10px;margin:18px 0 0;padding:12px 16px;border-radius:14px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-size:14px;font-weight:500;line-height:1.45}
  .msg.on{display:flex;animation:rise .35s both}
  .msg svg{width:18px;height:18px;flex-shrink:0;margin-top:2px}

  /* live preview */
  .preview{position:sticky;top:96px;border-radius:22px;border:1px solid var(--line);background:var(--solid);box-shadow:var(--shadow);overflow:hidden;transform:perspective(1200px) rotateY(-4deg) rotateX(1deg);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .preview:hover{transform:perspective(1200px) rotateY(0) rotateX(0)}
  .pbar{display:flex;align-items:center;gap:7px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
  .pbar i{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .pbar i:nth-child(1){background:#ff5f57}.pbar i:nth-child(2){background:#febc2e}.pbar i:nth-child(3){background:#28c840}
  .purl{flex:1;margin-left:10px;padding:5px 14px;border-radius:999px;background:var(--solid);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .purl b{color:var(--accent)}
  .pbody{padding:34px 30px 38px;display:flex;flex-direction:column;gap:14px}
  .pbody .ph{height:22px;width:55%;border-radius:8px;background:linear-gradient(120deg,var(--accent),var(--accent2));opacity:.85}
  .pbody .pl{height:12px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
  .pbody .pl::after,.pbody .pb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,var(--soft),transparent);transform:translateX(-100%);animation:sweep 2.4s infinite}
  @keyframes sweep{to{transform:translateX(100%)}}
  .pbody .pb{position:relative;overflow:hidden;height:36px;width:130px;border-radius:999px;background:var(--line);margin-top:8px}
  .pcap{padding:0 30px 26px;font-size:13px;color:var(--muted)}

  /* step 3 */
  .bal{display:inline-flex;align-items:center;gap:8px;margin:0 0 26px;padding:7px 18px;border-radius:999px;background:var(--surface);backdrop-filter:blur(10px);border:1px solid var(--line);font-size:14px;font-weight:600}
  .bal::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b)}
  .plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
  .plan{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px 22px;text-align:left;border:1.5px solid var(--line);border-radius:24px;background:var(--surface);backdrop-filter:blur(14px);color:var(--text);font:inherit;cursor:pointer;transition:border-color .25s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
  .plan.in{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
  .plan:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:var(--shadow)}
  .plan[aria-checked=true]{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow),var(--shadow);background:var(--solid)}
  .plan[aria-checked=true]::after{content:"¹3";position:absolute;top:18px;right:18px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:700;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .plan[aria-disabled=true]{opacity:.5;cursor:not-allowed}
  .plan[aria-disabled=true]:hover{border-color:var(--line);transform:none;box-shadow:none}
  .plan .pn{font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
  .plan .pp{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1.2}
  .plan .pp small{font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:0}
  .plan ul{list-style:none;margin:12px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:.85rem;color:var(--muted)}
  .plan li{display:flex;gap:8px;align-items:flex-start}
  .plan li::before{content:"¹3";color:var(--ok);font-weight:700}
  .plan li.no::before{content:"¹5";color:var(--muted)}
  .plan li b{color:var(--text)}
  .plan .hint{margin:8px 0 0;color:var(--danger)}
  .tag{position:absolute;top:-11px;left:22px;padding:3px 12px;border-radius:999px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em}
  [data-theme=dark] .tag{color:#001418}
  .plan[aria-checked=true] .tag{left:auto;right:56px}

  .empty{border:1px dashed var(--line);border-radius:28px;background:var(--surface);backdrop-filter:blur(14px);padding:72px 28px;text-align:center;max-width:680px}
  .empty h2{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
  .empty p{margin:0 0 26px;color:var(--muted)}
  .sk{height:260px;max-width:960px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;padding:12px 24px;border-radius:999px;transition:.3s;z-index:1000;box-shadow:0 14px 40px -10px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:960px){.split{grid-template-columns:1fr;gap:32px}.preview{display:none}.card{max-width:560px}}
  @media(max-width:700px){main{padding:40px 18px 72px}.choices{grid-template-columns:1fr}.acts .btn{flex:1}.sub{font-size:16px;margin-bottom:28px}.card{padding:24px}}
  @media(prefers-reduced-motion:reduce){*,::after,::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div id="navbar"></div>

<main>
  <div class="wrap">
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="step" id="step">&nbsp;</p>
    <h1 id="title">&nbsp;</h1>
    <p class="sub" id="sub">&nbsp;</p>
    <div id="view" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>
<div class="toast" id="toast" role="status"></div>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const NAME_RE = /^[a-z0-9][a-z0-9_-]{2,31}$/;
  const MAX_DESC = 500;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => Number(n).toLocaleString();

  async function loadInto(id, url) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      $(id).innerHTML = await res.text();
    } catch (e) { console.error("Could not load " + url, e); }
  }
  loadInto("navbar", "assets/navbar.html");
  loadInto("footer", "assets/footer.html");

  document.addEventListener("click", e => {
    if (!e.target.closest("[data-theme-toggle]")) return;
    const root = document.documentElement;
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("lp-theme", next); } catch (err) {}
  });

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  async function api(path, body) {
    const res = await fetch(API_BASE + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!data.error && !res.ok) data.error = "Server error (HTTP " + res.status + ")";
    return { ok: res.ok && data.success === true, status: res.status, data };
  }
  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 3200);
  }

  // ---------- state
  let apps = [], max = null, credits = 0, freeUsed = 0, maxFree = 1;
  let plans = [
    { name: "Basic", price: 150, backups: 5 }, { name: "Standard", price: 200, backups: 7 },
    { name: "Pro", price: 250, backups: 9 }, { name: "Enterprise", price: 300, backups: 11 }
  ];
  const S = { step: 1, builder: null, name: "", desc: "", plan: "" };

  // Everything each plan includes. A leading "!" marks something the plan does not include.
  const BENEFITS = {
    Free: ["Your site on a <b>.fastsite.host</b> address", "<b>100,000</b> requests a day", "!No backups", "KV database and S3 storage: <b>1 MB</b> each", "Up to <b>3</b> cache rules", "Server-side code up to <b>2 MB</b>", "!No server-side rendering", "Basic visit stats"],
    Basic: ["Your site on a <b>.fastsite.host</b> address", "<b>1 million</b> requests a day", "<b>5 backups</b> at a time", "KV database and S3 storage: <b>25 MB</b> each", "Up to <b>20</b> cache rules", "Server-side code up to <b>10 MB</b>", "Server-side rendering for <b>5</b> files", "Full visit details for 7 days"],
    Standard: ["Your site on a <b>.fastsite.host</b> address", "<b>10 million</b> requests a day", "<b>7 backups</b> at a time", "KV database and S3 storage: <b>100 MB</b> each", "Up to <b>20</b> cache rules", "Server-side code up to <b>20 MB</b>", "Server-side rendering for <b>5</b> files", "Full visit details for 7 days"],
    Pro: ["Your site on a <b>.fastsite.host</b> address", "<b>100 million</b> requests a day", "<b>9 backups</b> at a time", "KV database and S3 storage: <b>500 MB</b> each", "Up to <b>100</b> cache rules", "Server-side code up to <b>30 MB</b>", "Server-side rendering for <b>15</b> files", "Full visit details for 7 days"],
    Enterprise: ["Your site on a <b>.fastsite.host</b> address", "<b>1 billion</b> requests a day", "<b>11 backups</b> at a time", "KV database and S3 storage: <b>2 GB</b> each", "Up to <b>500</b> cache rules", "Server-side code up to <b>40 MB</b>", "Server-side rendering for <b>30</b> files", "Full visit details for 7 days"]
  };

  const atLimit = () => !!max && apps.length >= max;

  // ---------- header
  function head(step, title, sub) {
    $("step").textContent = step ? "Step " + step + " of 3" : "";
    $("step").hidden = !step;
    $("title").textContent = title;
    $("sub").textContent = sub;
    $("sub").hidden = !sub;
    [...$("dots").children].forEach((d, i) => d.classList.toggle("on", step && i < step));
    $("dots").hidden = !step;
    [["step","head-in"],["title","head-in d2"],["sub","head-in d3"]].forEach(([id,c]) => { const el = $(id); el.className = el.className.replace(/head-in( d\d)?/g,"").trim(); void el.offsetWidth; el.className = (el.className + " " + c).trim(); });
    const v = $("view"); v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
  }

  // ---------- step 1: how to start
  function viewChoice() {
    S.step = 1;
    head(1, "How would you like to start?", "You can always change your mind later.");
    $("view").innerHTML =
      '<div class="choices">' +
        '<button type="button" class="choice" data-pick="yes"><span class="rec">Recommended</span><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zm10 0h8v5h-8zM3 13h8v8H3zm10-3h8v11h-8z"/></svg></span><b>I would like to start with site builder!</b><small>Drag and drop blocks, pick a theme, and publish your site in minutes.</small><span class="go">Continue <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5l7 7-7 7-1.4-1.4L16.2 13H4v-2h12.2l-4.6-4.6z"/></svg></span></button>' +
        '<button type="button" class="choice alt" data-pick="no"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 16.6L4 12l4.6-4.6L10 8.8 6.8 12l3.2 3.2zm6.8 0L14 15.2l3.2-3.2L14 8.8l1.4-1.4L20 12z"/></svg></span><b>Nah, I would go without site builder</b><small>Start with an empty app and add your own files.</small><span class="go">Continue <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5l7 7-7 7-1.4-1.4L16.2 13H4v-2h12.2l-4.6-4.6z"/></svg></span></button>' +
      "</div>" +
      '<div class="acts" style="justify-content:flex-start"><a class="btn" href="dashboard.html">Cancel</a></div>';
  }

  // ---------- step 2: name + description
  function viewName() {
    S.step = 2;
    head(2, "Name your app", "Choose a unique name and, if you like, tell us what it’s for.");
    $("view").innerHTML =
      '<div class="split"><form class="card" id="nameForm" novalidate>' +
        '<div class="fg"><label for="appName">App name</label>' +
        '<input type="text" id="appName" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="my-awesome-app" value="' + esc(S.name) + '">' +
        '<p class="hint">3–32 characters: lowercase letters, numbers, - and _. You can’t change it later.</p></div>' +
        '<div class="fg"><label for="appDesc">Description <span class="opt">(optional)</span><span class="count" id="descCount"></span></label>' +
        '<textarea id="appDesc" maxlength="' + MAX_DESC + '" placeholder="What is this app for?">' + esc(S.desc) + "</textarea></div>" +
        '<div class="msg" id="msg" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg><span id="msgText"></span></div>' +
        '<div class="acts"><button class="btn" type="button" id="back">Back</button><button class="btn main" type="submit">Continue</button></div>' +
      '</form>' +
      '<aside class="preview" aria-hidden="true"><div class="pbar"><i></i><i></i><i></i><span class="purl" id="purl"></span></div><div class="pbody"><span class="ph"></span><span class="pl"></span><span class="pl" style="width:86%"></span><span class="pl" style="width:64%"></span><span class="pb"></span></div><p class="pcap">Live preview of your site address</p></aside></div>';
    const nameEl = $("appName"), descEl = $("appDesc");
    const count = () => { $("descCount").textContent = descEl.value.length + " / " + MAX_DESC; };
    count();
    const upd = () => { $("purl").innerHTML = "https://<b>" + (esc(nameEl.value.trim()) || "my-awesome-app") + "</b>.fastsite.host"; };
    upd();
    nameEl.addEventListener("input", upd);
    nameEl.focus();
    nameEl.addEventListener("input", e => {
      const el = e.target, pos = el.selectionStart;
      el.value = el.value.toLowerCase();
      try { el.setSelectionRange(pos, pos); } catch (err) {}
      nameEl.classList.remove("bad"); $("msg").classList.remove("on");
    });
    descEl.addEventListener("input", count);
    $("back").addEventListener("click", () => { S.name = nameEl.value.trim().toLowerCase(); S.desc = descEl.value; viewChoice(); });
    $("nameForm").addEventListener("submit", e => {
      e.preventDefault();
      const name = nameEl.value.trim().toLowerCase();
      const fail = t => { $("msgText").textContent = t; $("msg").classList.add("on"); nameEl.classList.remove("bad"); void nameEl.offsetWidth; nameEl.classList.add("bad"); nameEl.focus(); };
      if (!NAME_RE.test(name)) return fail("Use 3–32 characters: lowercase letters, numbers, - or _ (don’t start with - or _).");
      if (apps.some(a => a.name.toLowerCase() === name)) return fail("You already have an app named “" + name + "”. Pick a different name.");
      S.name = name; S.desc = descEl.value.trim();
      viewPlans();
    });
  }

  // ---------- step 3: plan
  function planCards(first) {
    const freeFull = freeUsed >= maxFree;
    const all = [{ name: "Free", price: 0, free: true }, ...plans];
    return all.map((pl, idx) => {
      const off = pl.free && freeFull, poor = !pl.free && credits < pl.price, sel = S.plan === pl.name;
      let list = (BENEFITS[pl.name] || []).slice();
      if (!list.length) list = ["Your site on a <b>.fastsite.host</b> address"].concat(pl.free ? ["!No backups"] : ["<b>" + pl.backups + " backups</b> at a time"]);
      const feats = list.map(t => t.charAt(0) === "!" ? '<li class="no">' + t.slice(1) + "</li>" : "<li>" + t + "</li>").join("");
      const note = off ? '<small class="hint">Free app limit reached</small>' : (poor ? '<small class="hint">Not enough credits</small>' : "");
      return '<button type="button" class="plan' + (first ? " in" : "") + '" style="--i:' + idx + '" role="radio" data-plan="' + esc(pl.name) + '" aria-checked="' + sel + '"' + (off || poor ? ' aria-disabled="true"' : "") + ">" +
        (pl.name === "Pro" ? '<span class="tag">Popular</span>' : "") +
        '<span class="pn">' + esc(pl.name) + "</span>" +
        '<span class="pp">' + (pl.free ? "Free" : fmt(pl.price) + " <small>credits</small>") + "</span>" +
        "<ul>" + feats + "</ul>" + note + "</button>";
    }).join("");
  }
  function refreshPlans(first) {
    $("plist").innerHTML = planCards(first);
    const cur = $("plist").querySelector('[data-plan="' + S.plan + '"]');
    $("create").disabled = !cur || cur.getAttribute("aria-disabled") === "true";
  }
  function viewPlans() {
    S.step = 3;
    head(3, "Choose a plan", "Pick a plan for " + S.name + ". Backups are only available on paid plans.");
    // default: Free when a free slot is left, otherwise the cheapest plan they can afford
    const firstPaid = plans.find(pl => credits >= pl.price);
    if (!S.plan) S.plan = freeUsed < maxFree ? "Free" : (firstPaid ? firstPaid.name : "");
    $("view").innerHTML =
      '<span class="bal">Your credits: ' + fmt(credits) + "</span>" +
      '<div class="plist" id="plist" role="radiogroup" aria-label="Plans"></div>' +
      '<div class="msg" id="msg" role="alert"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg><span id="msgText"></span></div>' +
      '<div class="acts"><button class="btn" type="button" id="back">Back</button><button class="btn main" type="button" id="create">Create app</button></div>';
    refreshPlans(true);
    $("plist").addEventListener("click", e => {
      const b = e.target.closest("[data-plan]");
      if (!b || b.getAttribute("aria-disabled") === "true") return;
      S.plan = b.dataset.plan; $("msg").classList.remove("on"); refreshPlans();
    });
    $("back").addEventListener("click", viewName);
    $("create").addEventListener("click", createApp);
  }

  function planErr(text) { $("msgText").textContent = text; $("msg").classList.add("on"); }

  async function createApp() {
    const btn = $("create"), { u, p } = creds();
    if (!u || !p) return planErr("You’re signed out. Please sign up again.");
    if (!S.plan) return planErr("Choose a plan first.");
    const body = { username: u, password: p, appName: S.name };
    if (S.desc) body.description = S.desc;
    if (S.plan !== "Free") body.plan = S.plan;
    btn.disabled = true; btn.textContent = "Creating…";
    let done = false;
    try {
      const r = await api("/apps/create", body);
      if (!r.ok) {
        if (r.status === 409) planErr("“" + S.name + "” is already taken by another app. Go back and pick a different name.");
        else if (r.status === 402) planErr(r.data.error || "Not enough credits for this plan.");
        else if (r.status === 403) planErr(r.data.error || "You’ve reached the limit of " + max + " apps.");
        else if (r.status === 401) planErr("We couldn’t verify your account. Please sign up again.");
        else planErr(r.data.error || "Could not create the app.");
        return;
      }
      done = true;
      // The same place the dashboard and the panel pages read the app password from.
      try { localStorage.setItem("lp-app-password:" + r.data.app.id, r.data.appPassword); } catch (err) {}
      toast(r.data.app.name + " created");
      location.href = (S.builder ? "panel/site-builder" : "panel/overview") + "?id=" + encodeURIComponent(r.data.app.id);
    } catch (err) {
      console.error(err);
      planErr("Couldn’t reach the server. Check your connection and try again.");
    } finally {
      if (!done) { btn.disabled = false; btn.textContent = "Create app"; }
    }
  }

  $("view").addEventListener("click", e => {
    const c = e.target.closest("[data-pick]");
    if (!c) return;
    S.builder = c.dataset.pick === "yes";
    viewName();
  });

  // cursor spotlight on the choice cards
  $("view").addEventListener("mousemove", e => {
    const c = e.target.closest(".choice");
    if (!c) return;
    const r = c.getBoundingClientRect();
    c.style.setProperty("--mx", (e.clientX - r.left) + "px");
    c.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  // ---------- start
  function message(title, text, btn, href) {
    head(0, "", "");
    $("view").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" + (btn ? '<a class="btn main" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }
  async function init() {
    const { u, p } = creds();
    if (!u || !p) { location.replace("signup.html"); return; }
    head(0, "Start from scratch", "");
    $("view").innerHTML = '<div class="sk"></div>';
    try {
      const r = await api("/apps/list", { username: u, password: p });
      if (r.status === 401) return message("Please sign up again", "We couldn’t verify your account on this device.", "Sign up", "signup.html");
      if (!r.ok) throw new Error(r.data.error || "Request failed");
      apps = r.data.apps || [];
      max = r.data.max || null;
      if (typeof r.data.credits === "number") credits = r.data.credits;
      freeUsed = typeof r.data.freeUsed === "number" ? r.data.freeUsed : apps.filter(a => (a.plan || "Free") === "Free").length;
      if (r.data.maxFree) maxFree = r.data.maxFree;
      if (Array.isArray(r.data.plans) && r.data.plans.length) plans = r.data.plans;
      if (atLimit()) return message("App limit reached", "You’ve reached the limit of " + max + " apps.", "Back to your apps", "dashboard.html");
      viewChoice();
    } catch (err) {
      console.error(err);
      message("Couldn’t load your account", "Check your connection and try again.", "Try again", "scratch.html");
    }
  }
  init();
</script>
</body>
</html>
