<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backups – Fast Site</title>
<meta name="description" content="Create, download, restore and automate backups of your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f4f4f5;--line:#e4e4e7;--text:#09090b;--muted:#52525b;--accent:#0e7490;--accent-ink:#fff;--glow:#dff3f7;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;transition:background .2s,color .2s}
  main{flex:1;padding:36px 20px 72px;background:radial-gradient(55% 32% at 50% 0%,var(--glow),transparent 75%)}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  .wrap{max-width:1120px;margin:0 auto}
  .top{margin-bottom:22px}
  h1{font-size:32px;letter-spacing:-.03em;line-height:1.15;margin:0 0 6px}
  .sub{margin:0 0 14px;color:var(--muted);font-size:15px}
  .sub b{color:var(--text)}
  .meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
  .meta a.back{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:14px;text-decoration:none;transition:border-color .15s}
  .meta a.back:hover{border-color:var(--accent)}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.plan{background:var(--glow);border-color:transparent;color:var(--accent)}
  .pill.ok{color:var(--ok)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:20px}
  .card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:18px 20px 18px;min-width:0}
  .card h2{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
  .big{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
  .big b{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
  .big span{color:var(--muted);font-size:15px}
  .meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0 8px}
  .meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
  .meter.full i{background:var(--danger)}
  .note{margin:6px 0 0;font-size:12.5px;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:opacity .15s,transform .15s}
  .btn:hover:not(:disabled){transform:translateY(-1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover:not(:disabled){border-color:var(--accent)}
  .btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
  .btn.danger:hover:not(:disabled){border-color:var(--danger)}
  .btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn svg{width:16px;height:16px}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  select,input[type=password]{font:500 14px Inter,sans-serif;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
  select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .create{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .create select{flex:1 1 130px}

  .switch{position:relative;flex-shrink:0;width:48px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--soft);cursor:pointer;padding:0;transition:background .2s,border-color .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
  .switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
  .switch[aria-checked=true]::after{transform:translateX(20px);background:var(--accent-ink)}
  .switch:disabled{opacity:.5;cursor:wait}

  .list{display:flex;flex-direction:column;gap:12px}
  .item{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 18px}
  .ico{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--glow);color:var(--accent);flex-shrink:0}
  .ico svg{width:22px;height:22px}
  .info{flex:1 1 240px;min-width:0}
  .info b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info span{display:block;font-size:13px;color:var(--muted)}
  .acts{display:flex;gap:8px;flex-wrap:wrap}

  .lock,.empty{border:1px dashed var(--line);border-radius:18px;background:var(--soft);padding:28px 24px;text-align:center}
  .lock{display:flex;align-items:center;gap:16px;text-align:left;padding:20px 22px}
  .lock svg{width:34px;height:34px;flex-shrink:0;color:var(--accent)}
  .lock h2,.empty h2{margin:0 0 2px;font-size:17px;color:var(--text);font-weight:600}
  .lock p,.empty p{margin:0;font-size:14px;color:var(--muted)}
  .gate{max-width:440px;margin:40px auto 0;text-align:center;padding:28px 24px}
  .gate h2{font-size:20px;color:var(--text);font-weight:600;margin:0 0 6px}
  .gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .gate form{display:flex;gap:10px;flex-wrap:wrap}
  .gate input{flex:1 1 200px}
  .err{color:var(--danger);font-size:13px;margin:10px 0 0;min-height:1em}
  .sk{border:1px solid var(--line);border-radius:18px;height:110px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  h3{font-size:18px;letter-spacing:-.02em;margin:26px 0 12px}

  dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--text);padding:24px;max-width:430px;width:calc(100% - 32px);font-family:inherit}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog h2{margin:0 0 8px;font-size:20px;letter-spacing:-.02em}
  dialog p{margin:0 0 18px;color:var(--muted);font-size:14px}
  dialog .acts{justify-content:flex-end}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:90;max-width:calc(100% - 32px);padding:11px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media(max-width:560px){h1{font-size:27px}.lock{flex-direction:column;align-items:flex-start}.acts .btn{flex:1}}
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header class="top">
      <h1>Backups</h1>
      <p class="sub" id="sub">&nbsp;</p>
      <div class="meta" id="meta"></div>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <p id="dlgText"></p>
  <div class="acts">
    <button class="btn ghost" id="dlgNo" type="button">Cancel</button>
    <button class="btn" id="dlgYes" type="button">Confirm</button>
  </div>
</dialog>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  fetch("assets/panel-essentials.html").then(r => r.text()).then(html => {
    const box = $("panelEssentials");
    box.innerHTML = html;
    box.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }).catch(e => console.error("Could not load panel-essentials.html", e));
  fetch("assets/footer.html").then(r => r.ok ? r.text() : "").then(h => { $("footer").innerHTML = h; }).catch(() => {});

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  // The app password is never saved on the server for us, so keep it only for this tab.
  const PW_KEY = "lp-apppw-" + APP_ID;
  const getPw = () => { try { return sessionStorage.getItem(PW_KEY) || ""; } catch (e) { return ""; } };
  const setPw = v => { try { v ? sessionStorage.setItem(PW_KEY, v) : sessionStorage.removeItem(PW_KEY); } catch (e) {} };

  const ICON = {
    box: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7.5 12 3 4 7.5v9L12 21l8-4.5zM12 5.3l5.6 3.1L12 11.5 6.4 8.4zM6 10.1l5 2.8v5.9l-5-2.8zm7 8.7v-5.9l5-2.8v5.9z"/></svg>',
    down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3h2v9.2l3.6-3.6L18 10l-6 6-6-6 1.4-1.4L11 12.2zM5 18h14v2H5z"/></svg>',
    restore: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L15 9h7V2l-2.64 2.64A8.97 8.97 0 0 0 13 3zm-1 5v5l4 2.4.8-1.3-3.3-2V8z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg>',
    plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm4 10.7V18h-2v-1.3a2 2 0 1 1 2 0z"/></svg>'
  };

  let toastT;
  function toast(msg) {
    const t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3800);
  }

  function confirmBox(title, text, yes, danger) {
    return new Promise(resolve => {
      const d = $("dlg");
      $("dlgTitle").textContent = title; $("dlgText").textContent = text;
      const y = $("dlgYes"); y.textContent = yes; y.className = "btn" + (danger ? " solid-danger" : "");
      const done = v => { d.close(); y.onclick = n.onclick = null; resolve(v); };
      const n = $("dlgNo");
      y.onclick = () => done(true); n.onclick = () => done(false);
      d.oncancel = () => resolve(false);
      d.showModal();
    });
  }

  const nf = new Intl.NumberFormat();
  function fmtSize(b) {
    b = Number(b); if (!Number.isFinite(b) || b < 0) return "–";
    const u = ["B", "KB", "MB", "GB"]; let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i ? b.toFixed(b >= 10 ? 0 : 1) : b) + " " + u[i];
  }
  const idOf = b => b.id || b.backupId;
  const timeOf = b => { const v = b.createdAt || b.created || b.date || b.time; const t = typeof v === "number" ? v : Date.parse(v || ""); return Number.isFinite(t) ? t : null; };
  const fmtDate = t => t == null ? "Unknown date" : new Date(t).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

  let state = { app: null, backups: [], max: 0, auto: false, lastAuto: null, busy: false };

  async function api(path, extra) {
    const { u, p } = creds();
    return fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p, appId: APP_ID, appPassword: getPw() }, extra || {}))
    });
  }
  async function json(res) { try { return await res.json(); } catch (e) { return {}; } }

  function authFail(res, data) {
    if (res.status === 401 && /app password/i.test(data.error || "")) { setPw(""); renderGate("That app password isn't right. Try again."); return true; }
    if (res.status === 401) { location.replace("signup.html"); return true; }
    return false;
  }

  function renderGate(error) {
    $("content").innerHTML = '<section class="card gate"><h2>Enter your app password</h2>' +
      "<p>Backups are protected by the password you got when you created this app. It's only kept in this tab.</p>" +
      '<form id="gateForm"><input type="password" id="gatePw" placeholder="App password" autocomplete="off" required>' +
      '<button class="btn" type="submit">Unlock</button></form><p class="err" id="gateErr">' + esc(error || "") + "</p></section>";
    $("gateForm").addEventListener("submit", e => { e.preventDefault(); setPw($("gatePw").value.trim()); loadBackups(); });
    $("gatePw").focus();
  }

  function renderHeader() {
    const a = state.app;
    document.title = a.name + " – Backups – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(a.name) + "</b>";
    $("meta").innerHTML = '<a class="back" href="overview.html?id=' + encodeURIComponent(APP_ID) + '">' + ICON.back.replace("<svg", '<svg width="16" height="16"') + "Overview</a>" +
      '<span class="pill plan">' + esc((a.plan || "Free") + " plan") + "</span>";
  }

  function render() {
    const s = state, n = s.backups.length, full = s.max > 0 && n >= s.max;
    const sorted = [...s.backups].sort((a, b) => (timeOf(b) || 0) - (timeOf(a) || 0));
    let html = '<div class="grid">' +
      '<section class="card"><h2>Backups used</h2><div class="big"><b>' + n + "</b><span>of " + s.max + '</span></div>' +
      '<div class="meter' + (full ? " full" : "") + '"><i style="width:' + Math.min(100, s.max ? n / s.max * 100 : 0) + '%"></i></div>' +
      '<form class="create" id="createForm"><select id="fmt" aria-label="Archive format"><option value="zip">.zip</option><option value="tar">.tar</option><option value="tar.gz">.tar.gz</option></select>' +
      '<button class="btn" type="submit" id="createBtn"' + (full || s.busy ? " disabled" : "") + ">" + ICON.plus + "Create backup</button></form>" +
      (full ? '<p class="note">You reached your plan limit. Delete a backup to make room.</p>' : "") + "</section>" +
      '<section class="card"><div class="row"><div><h2>Automatic daily backup</h2>' +
      '<p class="note" style="margin-top:4px">One backup per day (UTC). When your plan is full, the oldest backup is removed first.</p></div>' +
      '<button class="switch" id="autoSw" role="switch" aria-label="Automatic daily backup" aria-checked="' + s.auto + '"' + (s.busy ? " disabled" : "") + "></button></div>" +
      '<p class="note">' + (s.auto ? "On" : "Off") + (s.lastAuto ? " · last automatic backup " + esc(s.lastAuto) : "") + "</p></section></div>" +
      "<h3>Your backups</h3>";

    if (!n) {
      html += '<div class="empty"><h2>No backups yet</h2><p>Create your first backup to keep a safe copy of your site files.</p></div>';
    } else {
      html += '<div class="list">' + sorted.map(b => {
        const id = idOf(b), t = timeOf(b);
        const bits = [fmtSize(b.size)];
        if (b.files != null) bits.push(nf.format(b.files) + " files");
        if (b.format) bits.push("." + b.format);
        return '<div class="item" data-id="' + esc(id) + '"><div class="ico">' + ICON.box + "</div>" +
          '<div class="info"><b>' + esc(fmtDate(t)) + "</b><span>" + esc(bits.join(" · ")) + (b.fileName ? " · " + esc(b.fileName) : "") + "</span></div>" +
          '<div class="acts">' +
          '<button class="btn ghost sm" data-act="download">' + ICON.down + "Download</button>" +
          '<button class="btn ghost sm" data-act="restore">' + ICON.restore + "Restore</button>" +
          '<button class="btn danger sm" data-act="delete">' + ICON.trash + "Delete</button></div></div>";
      }).join("") + "</div>";
    }
    html += '<p class="note" style="margin-top:18px">Restoring replaces all current files of your app with the files in the backup.</p>';
    $("content").innerHTML = html;

    $("createForm").addEventListener("submit", e => { e.preventDefault(); createBackup($("fmt").value); });
    $("autoSw").addEventListener("click", () => toggleAuto(!state.auto));
    $("content").querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", () => {
      const id = btn.closest(".item").dataset.id, b = state.backups.find(x => idOf(x) === id);
      ({ download: downloadBackup, restore: restoreBackup, delete: deleteBackup })[btn.dataset.act](b, btn);
    }));
  }

  function setBusy(v, btn, label) {
    state.busy = v;
    document.querySelectorAll("#content button").forEach(b => { b.disabled = v; });
    if (btn) { if (v) { btn.dataset.html = btn.innerHTML; btn.innerHTML = '<i class="spin"></i>' + (label || ""); } else if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
  }

  async function run(btn, label, fn) {
    if (state.busy) return;
    setBusy(true, btn, label);
    try { await fn(); }
    catch (e) { console.error(e); toast("Something went wrong. Check your connection."); }
    finally { state.busy = false; if (state.app) render(); }
  }

  async function createBackup(format) {
    await run($("createBtn"), "Creating…", async () => {
      const res = await api("/backups/create", { format }), d = await json(res);
      if (authFail(res, d)) { state.app = null; return; }
      if (!res.ok || d.success === false) return toast(d.error || "Could not create the backup");
      toast("Backup created");
      await refresh();
    });
  }

  async function toggleAuto(on) {
    await run(null, "", async () => {
      const res = await api("/backups/auto", { enabled: on }), d = await json(res);
      if (authFail(res, d)) { state.app = null; return; }
      if (!res.ok || d.success === false) return toast(d.error || "Could not change the setting");
      state.auto = d.enabled === true; state.lastAuto = d.lastBackup || null;
      toast(state.auto ? "Automatic daily backup is on" : "Automatic daily backup is off");
    });
  }

  async function downloadBackup(b, btn) {
    await run(btn, "Downloading…", async () => {
      const res = await api("/backups/download", { backupId: idOf(b) });
      if (!res.ok) { const d = await json(res); if (authFail(res, d)) { state.app = null; return; } return toast(d.error || "Could not download the backup"); }
      const blob = await res.blob();
      const cd = res.headers.get("content-disposition") || "";
      const m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
      const name = (m && decodeURIComponent(m[1])) || b.fileName || ("backup-" + idOf(b));
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("Download started");
    });
  }

  async function restoreBackup(b, btn) {
    const ok = await confirmBox("Restore this backup?", "All current files of your app will be deleted and replaced with the backup from " + fmtDate(timeOf(b)) + ". This can't be undone.", "Restore", true);
    if (!ok) return;
    await run(btn, "Restoring…", async () => {
      const res = await api("/backups/restore", { backupId: idOf(b) }), d = await json(res);
      if (authFail(res, d)) { state.app = null; return; }
      if (!res.ok || d.success === false) return toast(d.error || "Restore failed");
      toast("Backup restored" + (d.restored && d.restored.files != null ? " (" + nf.format(d.restored.files) + " files)" : ""));
    });
  }

  async function deleteBackup(b, btn) {
    const ok = await confirmBox("Delete this backup?", "The backup from " + fmtDate(timeOf(b)) + " will be removed permanently.", "Delete", true);
    if (!ok) return;
    await run(btn, "Deleting…", async () => {
      const res = await api("/backups/delete", { backupId: idOf(b) }), d = await json(res);
      if (authFail(res, d)) { state.app = null; return; }
      if (!res.ok || d.success === false) return toast(d.error || "Could not delete the backup");
      toast("Backup deleted");
      await refresh();
    });
  }

  async function refresh() {
    const res = await api("/backups/list"), d = await json(res);
    if (authFail(res, d)) { state.app = null; return; }
    if (!res.ok || d.success === false) throw new Error(d.error || "Request failed");
    state.backups = d.backups || []; state.max = d.max || state.max; state.auto = d.dailyBackup === true;
    try {
      const a = await json(await api("/backups/auto"));
      if (a.success) { state.lastAuto = a.lastBackup || null; state.auto = a.enabled === true; }
    } catch (e) {}
  }

  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<p style="margin-top:18px"><a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a></p>" : "") + "</div>";
  }

  async function loadBackups() {
    $("content").innerHTML = '<div class="grid"><div class="sk"></div><div class="sk"></div></div>';
    try {
      await refresh();
      if (state.app) render();
    } catch (err) {
      console.error(err);
      message("Couldn't load your backups", err.message && err.message !== "Request failed" ? err.message : "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }

  async function init() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="grid"><div class="sk"></div><div class="sk"></div></div>';
    try {
      const res = await fetch(API_BASE + "/apps/list", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
      const d = await json(res);
      if (res.status === 401) return message("Please sign up again", "We couldn't verify your account on this device.", "Sign up", "signup.html");
      const a = (d.apps || []).find(x => x.id === APP_ID);
      if (!res.ok || !a) return message("App not found", "This app doesn't exist or isn't yours.", "Back to dashboard", "dashboard.html");
      state.app = a; state.max = a.backupLimit || 0; state.auto = a.dailyBackup === true;
      renderHeader();
      if (!state.max) {
        $("content").innerHTML = '<div class="lock">' + ICON.lock + "<div><h2>Backups are available on paid plans</h2><p>Upgrade to Basic, Standard, Pro or Enterprise to keep 5 to 11 backups, restore them any time and turn on automatic daily backups.</p></div></div>";
        return;
      }
      if (!getPw()) return renderGate();
      loadBackups();
    } catch (err) {
      console.error(err);
      message("Couldn't load this app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }
  init();
</script>
</body>
</html>
