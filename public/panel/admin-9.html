<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin – Fast Site</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e4e4e7;--text:#09090b;--muted:#5b5b66;--accent:#0e7490;--accent-ink:#fff;--danger:#b91c1c;--ok:#16a34a;--warn:#b45309}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--danger:#f87171;--ok:#4ade80;--warn:#fbbf24}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
  main{padding:32px 20px 64px}
  [hidden]{display:none!important}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
  .sub{margin:0;color:var(--muted);font-size:14.5px}
  .sub b{color:var(--text)}
  a{color:var(--accent)}
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  .top .row{margin-top:0}

  .nav{display:flex;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nv{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .nv:hover{background:var(--soft);color:var(--text)}
  .nv.on{background:var(--soft);color:var(--text);font-weight:600;border-color:var(--accent)}

  h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
  .lead{margin:0 0 18px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
  .lead b{color:var(--text)}
  h3.sec{margin:26px 0 8px;font-size:15px}

  .list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .st{padding:13px 18px}
  .st+.st{border-top:1px solid var(--line)}
  a.st{display:block;color:inherit;text-decoration:none}
  a.st:hover{background:var(--soft)}
  .hd{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center}
  .tx{flex:1 1 180px;min-width:0}
  .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
  .d{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .rt{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%;flex-wrap:wrap}
  .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 9px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--text);word-break:break-all;min-width:0}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
  .pill.warn{color:var(--danger)}
  .pill.ok{color:var(--ok)}
  .pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

  .who{display:flex;align-items:center;gap:12px;min-width:0}
  .av{position:relative;overflow:hidden;width:34px;height:34px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);flex-shrink:0}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .av.lg{width:56px;height:56px;font-size:22px}
  .back{display:inline-block;margin-bottom:14px;font-size:13.5px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--text)}

  .label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
  .hint{margin:7px 0 0;font-size:12.5px;color:var(--muted)}
  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;max-width:380px}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field input{flex:1;min-width:0;padding:9px 12px;border:0;outline:0;background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif}
  .field input::placeholder{color:var(--muted);opacity:.7}
  .field.wide{max-width:none}
  .sel{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 14.5px Inter,sans-serif;max-width:380px;width:100%}
  .sel.auto{width:auto}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .toolbar .field{flex:1 1 240px}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.small{padding:6px 12px;font-size:13px}

  .msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--soft);overflow-wrap:anywhere}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .msg.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));color:var(--warn)}
  .form{margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .form>*+*{margin-top:14px}
  .form>.row{margin-top:18px}
  .form h3{margin:0;font-size:15px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .grid2 .field,.grid2 .sel{max-width:none}
  .none{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
  .empty{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:48px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:21px}
  .empty p{margin:0 0 20px;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .stat{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px;min-width:0}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.25;overflow-wrap:anywhere}
  .stat b.sm{font-size:15px;line-height:1.7}
  .stat span{font-size:12.5px;font-weight:500;color:var(--muted)}
  .bar{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  .bar.mid>i{background:var(--warn)}
  .bar.hot>i{background:var(--danger)}
  .barcap{display:flex;justify-content:space-between;gap:10px;margin:6px 0 0;font-size:12.5px;color:var(--muted)}
  .pg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
  .pg .row{margin:0}

  .sk{border:1px solid var(--line);border-radius:12px;height:200px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .gate{max-width:420px;margin:12vh auto 0}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}

  .mdl{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,#000 55%,transparent);animation:ddFade .12s ease-out}
  .mdl-box{width:100%;max-width:420px;padding:20px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:ddIn .14s ease-out}
  .mdl-box h3{margin:0 0 6px;font-size:17px}
  .mdl-box p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
  .mdl-box .field{margin-top:14px;max-width:none}
  .mdl-box .row{justify-content:flex-end;margin-top:20px}
  .secret{display:block;margin-top:14px;padding:12px;font-size:15px;text-align:center;user-select:all}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:1200;padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px)}}
  @keyframes ddFade{from{opacity:0}}

  @media(max-width:820px){main{padding:24px 16px 48px}}
  @media(max-width:560px){h1{font-size:23px}.st{padding:12px 14px}.field{max-width:none}.sel{max-width:none}.form{padding:14px}}
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <header class="top" id="top" hidden>
      <div>
        <h1>Admin</h1>
        <p class="sub">Every user and app on Fast Site.</p>
      </div>
      <div class="row">
        <button class="btn ghost small" type="button" id="themeBtn">Switch theme</button>
        <button class="btn ghost small" type="button" id="lockBtn">Lock</button>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="Admin sections" hidden>
      <button type="button" class="nv" data-go="overview">Overview</button>
      <button type="button" class="nv" data-go="users">Users</button>
      <button type="button" class="nv" data-go="apps">Apps</button>
    </nav>
    <div id="view" aria-live="polite"></div>
  </div>
</main>

<script>
  const API = "https://lite-pages.thecodemonai.workers.dev/api/admin";
  const SITE_DOMAIN = "code-mon-space.shop"; // only used for the "open site" link
  const PLANS = ["Free", "Basic", "Standard", "Pro", "Enterprise"];
  const PAGE = 25;
  let KEY = "";
  const U = { search: "", offset: 0, seq: 0 };
  const A = { search: "", plan: "", owner: "", ownerName: "", offset: 0, seq: 0 };
  let cur = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (Number(n) || 0).toLocaleString();
  const fmtDate = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "—"; };
  function fmtBytes(n) {
    n = Number(n) || 0;
    if (n >= 1073741824) return (Math.round(n / 1073741824 * 100) / 100) + " GB";
    if (n >= 1048576) return (Math.round(n / 1048576 * 10) / 10) + " MB";
    if (n >= 1024) return Math.round(n / 1024) + " KB";
    return n + " B";
  }
  function fmtMb(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return "—";
    n = Number(n);
    return n >= 1024 ? (Math.round(n / 1024 * 100) / 100) + " GB" : (n < 10 ? Math.round(n * 10) / 10 : Math.round(n)) + " MB";
  }
  function say(id, kind, text) {
    const el = $(id);
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }
  const msgBox = id => '<p class="msg" id="' + id + '" hidden></p>';
  let toastT;
  function flash(text) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = text;
    document.body.appendChild(t);
    clearTimeout(toastT);
    toastT = setTimeout(() => t.remove(), 3200);
  }
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (_) {}
      t.remove();
    }
    const old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(() => { if (btn.isConnected) btn.textContent = old; }, 1400);
  }
  const avatar = (u, big) => '<span class="av' + (big ? " lg" : "") + '">' + esc((u.username || "?").trim().charAt(0).toUpperCase() || "?") +
    (u.imgUrl ? '<img src="' + esc(u.imgUrl) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : "") + "</span>";
  const kv = (label, val, copy) => '<div class="st"><div class="hd"><div class="tx"><div class="t">' + esc(label) + '</div></div><div class="rt"><span class="code">' + esc(val) + "</span>" +
    (copy ? '<button class="btn ghost small" type="button" data-act="copy" data-v="' + esc(val) + '">Copy</button>' : "") + "</div></div></div>";
  const stat = (v, l, sm) => '<div class="stat"><b' + (sm ? ' class="sm"' : "") + ">" + esc(v) + "</b><span>" + esc(l) + "</span></div>";
  const planPill = p => '<span class="pill' + (p === "Free" ? "" : " acc") + '">' + esc(p) + "</span>";

  // ---------- dialogs
  // dlg(text, { title, ok, danger, type: "text the person must type" })
  function dlg(text, o) {
    o = o || {};
    return new Promise(res => {
      const prev = document.activeElement;
      const m = document.createElement("div"); m.className = "mdl";
      m.innerHTML = '<div class="mdl-box" role="alertdialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">' + esc(o.title || "Are you sure?") + "</h3><p>" + esc(text) + "</p>" +
        (o.type ? '<div class="field"><input id="mdlIn" type="text" autocomplete="off" spellcheck="false" placeholder="Type ' + esc(o.type) + ' to confirm"></div>' : "") +
        '<div class="row"><button class="btn ghost" type="button" data-r="0">Cancel</button><button class="btn' + (o.danger ? " danger solid" : "") + '" type="button" data-r="1"' + (o.type ? " disabled" : "") + ">" + esc(o.ok || "Confirm") + "</button></div></div>";
      const okBtn = m.querySelector('[data-r="1"]');
      const done = v => { document.removeEventListener("keydown", key, true); m.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); res(v); };
      const key = e => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
        else if (e.key === "Enter" && o.type && !okBtn.disabled) { e.preventDefault(); done(true); }
        else if (e.key === "Tab") {
          const f = [...m.querySelectorAll("input,button:not(:disabled)")]; if (!f.length) return;
          e.preventDefault();
          const i = f.indexOf(document.activeElement);
          f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      };
      m.addEventListener("click", e => { const b = e.target.closest("button"); if (b && !b.disabled) done(b.dataset.r === "1"); else if (e.target === m) done(false); });
      if (o.type) m.addEventListener("input", e => { if (e.target.id === "mdlIn") okBtn.disabled = e.target.value.trim() !== o.type; });
      document.addEventListener("keydown", key, true);
      document.body.appendChild(m);
      (o.type ? m.querySelector("#mdlIn") : okBtn).focus();
    });
  }
  function secretDlg(title, text, secret) {
    return new Promise(res => {
      const prev = document.activeElement;
      const m = document.createElement("div"); m.className = "mdl";
      m.innerHTML = '<div class="mdl-box" role="alertdialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">' + esc(title) + "</h3><p>" + esc(text) + '</p><span class="code secret">' + esc(secret) + "</span>" +
        '<div class="row"><button class="btn ghost" type="button" data-c="1">Copy</button><button class="btn" type="button" data-r="1">I saved it</button></div></div>';
      const done = () => { m.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); res(); };
      m.addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        if (b.dataset.c) copyText(secret, b); else done();
      });
      document.body.appendChild(m);
      m.querySelector("[data-r]").focus();
    });
  }

  // ---------- api
  async function api(path, body) {
    let res;
    try {
      res = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(body || {}) });
    } catch (e) { throw new Error("Network error. Check your connection and try again."); }
    let d = {};
    try { d = await res.json(); } catch (e) {}
    if (res.status === 401) { lock("The admin key was rejected. Enter it again."); throw new Error("Invalid admin key"); }
    if (!res.ok || d.success === false) throw new Error(d.error || "Request failed (" + res.status + ")");
    return d;
  }

  // ---------- gate
  function lock(errText) {
    KEY = "";
    try { sessionStorage.removeItem("lp-admin-key"); localStorage.removeItem("lp-admin-key"); } catch (e) {}
    $("top").hidden = true; $("nav").hidden = true;
    $("view").innerHTML =
      '<div class="gate"><h1 style="margin-bottom:4px">Admin</h1><p class="sub" style="margin-bottom:20px">Enter the admin key to continue.</p>' +
      '<label class="label" for="akey">Admin key</label><div class="field"><input id="akey" type="password" autocomplete="current-password" spellcheck="false" placeholder="ADMIN_KEY"></div>' +
      '<label class="chk" style="margin-top:12px"><input type="checkbox" id="akeep"> Remember on this device</label>' +
      '<div class="row"><button class="btn" id="akeyBtn" type="button">Unlock</button></div>' + msgBox("gmsg") + "</div>";
    $("akeyBtn").addEventListener("click", unlock);
    $("akey").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    $("akey").focus();
    if (errText) say("gmsg", "err", errText);
  }
  async function unlock() {
    const k = $("akey").value.trim(), keep = $("akeep").checked;
    if (!k) return say("gmsg", "err", "Enter the admin key.");
    KEY = k;
    $("akeyBtn").disabled = true;
    try {
      await api("/stats", {});
      try { (keep ? localStorage : sessionStorage).setItem("lp-admin-key", k); } catch (e) {}
      start();
    } catch (e) {
      if ($("gmsg")) say("gmsg", "err", e.message === "Invalid admin key" ? "That admin key is wrong." : e.message);
      if ($("akeyBtn")) $("akeyBtn").disabled = false;
      KEY = $("akey") ? KEY : "";
    }
  }
  function start() {
    $("top").hidden = false; $("nav").hidden = false;
    if (!location.hash) history.replaceState(null, "", "#overview");
    route();
  }

  // ---------- routing
  function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
  function route() {
    if (!KEY) return;
    const [name, id] = location.hash.replace(/^#\/?/, "").split("/");
    const tab = name === "user" ? "users" : name === "app" ? "apps" : name;
    document.querySelectorAll(".nv").forEach(b => {
      const on = b.dataset.go === (tab || "overview");
      b.classList.toggle("on", on);
      if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("view").innerHTML = '<div class="sk"></div>';
    window.scrollTo(0, 0);
    if (name === "users") renderUsers();
    else if (name === "apps") renderApps();
    else if (name === "user" && id) renderUser(id);
    else if (name === "app" && id) renderApp(id);
    else renderOverview();
  }
  function fail(e, id) {
    if (e.message === "Invalid admin key") return;
    if (id && $(id)) return say(id, "err", e.message);
    $("view").innerHTML = '<div class="empty"><h2>Couldn’t load this page</h2><p>' + esc(e.message) + '</p><button class="btn" type="button" data-act="reload">Try again</button></div>';
  }

  // ---------- overview
  async function renderOverview() {
    try {
      const d = await api("/stats", {});
      const by = d.appsByPlan || {}, total = d.apps || 0;
      const paid = Object.entries(by).reduce((n, [k, v]) => n + (k === "Free" ? 0 : v), 0);
      const names = [...PLANS, ...Object.keys(by).filter(k => !PLANS.includes(k))];
      $("view").innerHTML =
        "<h2>Overview</h2><p class=\"lead\">Totals across the whole platform.</p>" +
        '<div class="stats">' + stat(num(d.users), "Users") + stat(num(d.apps), "Apps") + stat(num(paid), "Paid apps") + stat(num(d.creditsInCirculation), "Credits in circulation") + "</div>" +
        '<h3 class="sec">Apps per plan</h3><div class="list">' +
        names.map(p => {
          const n = by[p] || 0, pct = total ? n / total * 100 : 0;
          return '<a class="st" href="#apps" data-plan="' + esc(p) + '"><div class="hd"><div class="tx"><div class="t">' + esc(p) + '</div></div><div class="rt"><span class="code">' + num(n) + "</span></div></div>" +
            '<div class="bar" style="margin-top:8px"><i style="width:' + pct.toFixed(1) + '%;background:var(--accent)"></i></div></a>';
        }).join("") + "</div>" +
        '<div class="row"><button class="btn ghost small" type="button" data-act="reload">Refresh</button></div>';
    } catch (e) { fail(e); }
  }

  // ---------- pager
  function pager(kind, total, offset, shown) {
    if (!total) return "";
    const from = offset + 1, to = offset + shown;
    return '<div class="pg"><span>' + num(from) + "–" + num(to) + " of " + num(total) + '</span><div class="row">' +
      '<button class="btn ghost small" type="button" data-act="page" data-k="' + kind + '" data-o="' + Math.max(0, offset - PAGE) + '"' + (offset <= 0 ? " disabled" : "") + ">Previous</button>" +
      '<button class="btn ghost small" type="button" data-act="page" data-k="' + kind + '" data-o="' + (offset + PAGE) + '"' + (offset + PAGE >= total ? " disabled" : "") + ">Next</button></div></div>";
  }

  // ---------- users
  function renderUsers() {
    $("view").innerHTML = '<h2>Users</h2><p class="lead" id="ulead">&nbsp;</p>' +
      '<div class="toolbar"><div class="field"><input id="uq" type="search" autocomplete="off" placeholder="Search username, email or Discord ID" value="' + esc(U.search) + '"></div></div><div id="ures"></div>';
    loadUsers();
  }
  async function loadUsers() {
    const t = ++U.seq;
    try {
      const d = await api("/users/list", { search: U.search, limit: PAGE, offset: U.offset });
      if (t !== U.seq || !$("ures")) return;
      $("ulead").innerHTML = "<b>" + num(d.total) + "</b> " + (d.total === 1 ? "user" : "users") + (U.search ? " match your search" : " in total") + ".";
      $("ures").innerHTML = d.users.length
        ? '<div class="list">' + d.users.map(u =>
          '<a class="st" href="#user/' + esc(u.discordId) + '"><div class="hd"><div class="who tx">' + avatar(u) + '<div style="min-width:0"><div class="t">' + esc(u.username) + '</div><p class="d">' + esc(u.email) + '</p></div></div>' +
          '<div class="rt"><span class="pill">' + num(u.credits) + " credits</span><span class=\"pill\">" + num(u.appCount) + (u.appCount === 1 ? " app" : " apps") + "</span></div></div></a>").join("") + "</div>" + pager("users", d.total, d.offset, d.users.length)
        : '<div class="none">No users found.</div>';
    } catch (e) { if (t === U.seq && $("ures")) $("ures").innerHTML = '<p class="msg err">' + esc(e.message) + "</p>"; }
  }

  async function renderUser(id) {
    try {
      const d = await api("/users/get", { discordId: id });
      cur = d;
      const u = d.user;
      $("view").innerHTML =
        '<a class="back" href="#users">Back to users</a>' +
        '<div class="who" style="margin-bottom:18px">' + avatar(u, true) + '<div style="min-width:0"><h2>' + esc(u.username) + '</h2><p class="lead" style="margin:0">' + esc(u.email) + "</p></div></div>" +
        '<div class="stats">' + stat(num(u.credits), "Credits") + stat(num(d.apps.length), d.apps.length === 1 ? "App" : "Apps") + stat(fmtDate(u.createdAt), "Joined", 1) + stat(fmtDate(u.lastLogin), "Last login", 1) + "</div>" +
        '<div class="list">' + kv("Discord ID", u.discordId, true) + kv("Signup IP", u.ip || "—", !!u.ip) + "</div>" +

        '<h3 class="sec">Credits</h3><div class="form" style="margin-top:0"><div><label class="label" for="cr_n">Amount</label>' +
        '<div class="field"><input id="cr_n" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 150 or -50"></div>' +
        '<p class="hint">Add credits, subtract with a negative number, or set the exact balance.</p></div>' +
        '<div class="row"><button class="btn" type="button" data-act="credAdd">Add / subtract</button><button class="btn ghost" type="button" data-act="credSet">Set exact balance</button></div></div>' + msgBox("cmsg") +

        '<h3 class="sec">Profile</h3><div class="form" style="margin-top:0"><div class="grid2">' +
        '<div><label class="label" for="pf_name">Username</label><div class="field"><input id="pf_name" type="text" maxlength="100" value="' + esc(u.username) + '"></div></div>' +
        '<div><label class="label" for="pf_mail">Email</label><div class="field"><input id="pf_mail" type="email" maxlength="254" value="' + esc(u.email) + '"></div></div></div>' +
        '<div class="row"><button class="btn" type="button" data-act="profSave">Save profile</button></div></div>' + msgBox("pmsg") +

        '<h3 class="sec">Apps</h3>' + (d.apps.length
          ? '<div class="list">' + d.apps.map(a => '<a class="st" href="#app/' + esc(a.id) + '"><div class="hd"><div class="tx"><div class="t">' + esc(a.name) + " " + planPill(a.plan) + '</div><p class="d">Created ' + esc(fmtDate(a.createdAt)) + '</p></div><div class="rt"><span class="code">' + esc(a.id) + "</span></div></div></a>").join("") + "</div>"
          : '<div class="none">This user has no apps.</div>') +

        '<h3 class="sec">Account actions</h3><div class="list"><div class="st"><div class="hd"><div class="tx"><div class="t">Reset password</div><p class="d">Creates a new account password. The old one stops working at once.</p></div><div class="rt"><button class="btn ghost small" type="button" data-act="userPw">Reset password</button></div></div></div>' +
        '<div class="st"><div class="hd"><div class="tx"><div class="t">Delete user</div><p class="d">Deletes the account and all of its apps, files, backups and databases.</p></div><div class="rt"><button class="btn danger small" type="button" data-act="userDel">Delete user</button></div></div></div></div>' + msgBox("dmsg");
    } catch (e) { fail(e); }
  }
  async function credits(mode) {
    const raw = $("cr_n").value.trim();
    if (!/^-?\d+$/.test(raw)) return say("cmsg", "err", "Enter a whole number.");
    const n = Number(raw), u = cur.user;
    if (mode === "set") {
      if (n < 0) return say("cmsg", "err", "The balance can’t be negative.");
      if (!await dlg("Set the balance of " + u.username + " to " + num(n) + " credits? It is now " + num(u.credits) + ".", { title: "Set exact balance?", ok: "Set balance" })) return;
    }
    say("cmsg", "", "");
    try {
      const d = await api("/users/credits", mode === "set" ? { discordId: u.discordId, set: n } : { discordId: u.discordId, amount: n });
      flash("Balance is now " + num(d.credits) + " credits");
      renderUser(u.discordId);
    } catch (e) { say("cmsg", "err", e.message); }
  }
  async function saveProfile() {
    const u = cur.user, body = { discordId: u.discordId }, name = $("pf_name").value.trim(), mail = $("pf_mail").value.trim();
    if (name !== u.username) body.username = name;
    if (mail !== u.email) body.email = mail;
    if (Object.keys(body).length < 2) return say("pmsg", "info", "Nothing changed.");
    say("pmsg", "", "");
    try { await api("/users/update", body); flash("Profile saved"); renderUser(u.discordId); }
    catch (e) { say("pmsg", "err", e.message); }
  }
  async function resetUserPw() {
    const u = cur.user;
    if (!await dlg("Create a new password for " + u.username + "? The old one stops working immediately.", { title: "Reset account password?", ok: "Reset password", danger: true })) return;
    try {
      const d = await api("/users/reset-password", { discordId: u.discordId });
      await secretDlg("New account password", "Shown only once. " + u.username + " also gets it the next time they sign in.", d.password);
    } catch (e) { say("dmsg", "err", e.message); }
  }
  async function deleteUser() {
    const u = cur.user, n = cur.apps.length;
    if (!await dlg("This permanently deletes " + u.username + (n ? " and their " + n + (n === 1 ? " app" : " apps") + ", with all files, backups and databases" : "") + ". It can’t be undone.", { title: "Delete this user?", ok: "Delete user", danger: true, type: u.username })) return;
    say("dmsg", "", "");
    try {
      const d = (await api("/users/delete", { discordId: u.discordId })).deleted;
      flash("Deleted " + d.username + " (" + d.apps + " apps, " + d.files + " files)");
      go("users");
    } catch (e) { say("dmsg", "err", e.message); }
  }

  // ---------- apps
  function renderApps() {
    $("view").innerHTML = '<h2>Apps</h2><p class="lead" id="alead">&nbsp;</p>' +
      '<div class="toolbar"><div class="field"><input id="aq" type="search" autocomplete="off" placeholder="Search app name, ID or owner" value="' + esc(A.search) + '"></div>' +
      '<select class="sel auto" id="apl" aria-label="Filter by plan"><option value="">All plans</option>' + PLANS.map(p => '<option' + (A.plan === p ? " selected" : "") + ">" + p + "</option>").join("") + "</select>" +
      (A.owner ? '<button class="btn ghost small" type="button" data-act="clearOwner">Owner: ' + esc(A.ownerName || A.owner) + " ✕</button>" : "") + '</div><div id="ares"></div>';
    loadApps();
  }
  async function loadApps() {
    const t = ++A.seq;
    try {
      const d = await api("/apps/list", { search: A.search, plan: A.plan, owner: A.owner, limit: PAGE, offset: A.offset });
      if (t !== A.seq || !$("ares")) return;
      $("alead").innerHTML = "<b>" + num(d.total) + "</b> " + (d.total === 1 ? "app" : "apps") + (A.search || A.plan || A.owner ? " match your filters" : " in total") + ".";
      $("ares").innerHTML = d.apps.length
        ? '<div class="list">' + d.apps.map(a =>
          '<a class="st" href="#app/' + esc(a.id) + '"><div class="hd"><div class="tx"><div class="t">' + esc(a.name) + " " + planPill(a.plan) +
          '</div><p class="d">' + esc(a.ownerUsername || "Unknown owner") + " · created " + esc(fmtDate(a.createdAt)) + (a.customDomain ? " · " + esc(a.customDomain) : "") + '</p></div><div class="rt"><span class="code">' + esc(a.id) + "</span></div></div></a>").join("") + "</div>" + pager("apps", d.total, d.offset, d.apps.length)
        : '<div class="none">No apps found.</div>';
    } catch (e) { if (t === A.seq && $("ares")) $("ares").innerHTML = '<p class="msg err">' + esc(e.message) + "</p>"; }
  }

  async function renderApp(id) {
    try {
      const d = await api("/apps/get", { appId: id });
      cur = d;
      const a = d.app, f = d.files || {}, db = d.database;
      const pct = f.limit ? Math.min(100, (f.bytes || 0) / f.limit * 100) : 0, cls = pct >= 90 ? "hot" : pct >= 70 ? "mid" : "";
      const dbPct = db && db.limitMb ? Math.min(100, (Number(db.usedMb) || 0) / db.limitMb * 100) : 0;
      $("view").innerHTML =
        '<a class="back" href="#apps">Back to apps</a>' +
        "<h2>" + esc(a.name) + " " + planPill(a.plan) + '</h2><p class="lead">Owned by <a href="#user/' + esc(a.owner) + '">' + esc(a.ownerUsername || a.owner) + "</a> · created " + esc(fmtDate(a.createdAt)) + "</p>" +
        '<div class="stats">' + stat(num(f.count), "Files") + stat(fmtBytes(f.bytes), "Storage used") + stat(num(d.dailyRequestLimit), "Daily request limit") + stat(num(a.backupLimit), "Backup slots") + "</div>" +
        '<div class="bar ' + cls + '"><i style="width:' + pct.toFixed(1) + '%"></i></div><div class="barcap"><span>' + Math.round(pct) + "% of " + esc(fmtBytes(f.limit)) + "</span><span></span></div>" +
        '<h3 class="sec">Details</h3><div class="list">' + kv("App ID", a.id, true) + kv("Owner ID", a.owner, true) +
        '<div class="st"><div class="hd"><div class="tx"><div class="t">Site</div></div><div class="rt"><a class="code" href="https://' + esc(a.name) + "." + esc(SITE_DOMAIN) + '" target="_blank" rel="noopener">' + esc(a.name) + "." + esc(SITE_DOMAIN) + "</a></div></div></div>" +
        (a.customDomain ? '<div class="st"><div class="hd"><div class="tx"><div class="t">Custom domain</div></div><div class="rt"><span class="code">' + esc(a.customDomain) + '</span><span class="pill ' + (a.customDomainVerified ? "ok" : "warn") + '">' + (a.customDomainVerified ? "Verified" : "Not verified") + "</span></div></div></div>" : "") +
        '<div class="st"><div class="hd"><div class="tx"><div class="t">Daily backup</div><p class="d">Last automatic backup: ' + esc(fmtDate(a.lastAutoBackup)) + '</p></div><div class="rt"><span class="pill ' + (a.dailyBackup ? "ok" : "") + '">' + (a.dailyBackup ? "On" : "Off") + "</span></div></div></div></div>" +

        '<h3 class="sec">Database</h3>' + (db
          ? '<div class="list">' + [["Name", db.dbName], ["Host", db.host], ["Port", db.port], ["User", db.user]].filter(x => x[1] !== undefined && x[1] !== null).map(x => kv(x[0], String(x[1]), true)).join("") +
            '<div class="st"><div class="hd"><div class="tx"><div class="t">Status</div></div><div class="rt"><span class="pill ' + (db.status === "suspended" ? "warn" : "ok") + '">' + esc(db.status === "suspended" ? "Suspended" : "Active") + "</span></div></div></div>" +
            '<div class="st"><div class="hd"><div class="tx"><div class="t">Storage</div><p class="d">Plan ' + esc(fmtMb(db.planLimitMb)) + " + extra " + esc(fmtMb(db.extraMb)) + '</p></div><div class="rt"><span class="code">' + esc(fmtMb(db.usedMb)) + " / " + esc(fmtMb(db.limitMb)) + "</span></div></div>" +
            '<div class="bar ' + (db.status === "suspended" || dbPct >= 100 ? "hot" : dbPct >= 80 ? "mid" : "") + '" style="margin-top:8px"><i style="width:' + dbPct.toFixed(1) + '%"></i></div></div></div>'
          : '<div class="none">' + (a.plan === "Free" ? "Free apps can’t have a database." : "This app has no database.") + "</div>") +

        '<h3 class="sec">Edit app</h3><div class="form" style="margin-top:0"><div class="grid2">' +
        '<div><label class="label" for="ap_name">Name</label><div class="field"><input id="ap_name" type="text" maxlength="32" spellcheck="false" autocapitalize="none" value="' + esc(a.name) + '"></div></div>' +
        '<div><label class="label" for="ap_plan">Plan</label><select class="sel" id="ap_plan">' + PLANS.map(p => "<option" + (a.plan === p ? " selected" : "") + ">" + p + "</option>").join("") + "</select></div>" +
        '<div><label class="label" for="ap_bk">Daily backup</label><select class="sel" id="ap_bk"><option value="false"' + (a.dailyBackup ? "" : " selected") + '>Off</option><option value="true"' + (a.dailyBackup ? " selected" : "") + ">On</option></select></div></div>" +
        '<p class="hint">Changing the plan here doesn’t charge or refund credits. Moving to Free needs the database deleted first.</p>' +
        '<div class="row"><button class="btn" type="button" data-act="appSave">Save changes</button></div></div>' + msgBox("amsg") +

        '<h3 class="sec">App actions</h3><div class="list"><div class="st"><div class="hd"><div class="tx"><div class="t">Reset app password</div><p class="d">Creates a new app password. The old one stops working at once.</p></div><div class="rt"><button class="btn ghost small" type="button" data-act="appPw">Reset password</button></div></div></div>' +
        '<div class="st"><div class="hd"><div class="tx"><div class="t">Owner’s apps</div><p class="d">See every app of ' + esc(a.ownerUsername || "this owner") + '.</p></div><div class="rt"><button class="btn ghost small" type="button" data-act="ownerApps">View apps</button></div></div></div>' +
        '<div class="st"><div class="hd"><div class="tx"><div class="t">Delete app</div><p class="d">Deletes its files, backups, database and statistics.</p></div><div class="rt"><button class="btn danger small" type="button" data-act="appDel">Delete app</button></div></div></div></div>' + msgBox("bmsg");
    } catch (e) { fail(e); }
  }
  async function saveApp() {
    const a = cur.app, body = { appId: a.id }, name = $("ap_name").value.trim(), plan = $("ap_plan").value, bk = $("ap_bk").value === "true";
    if (name !== a.name) body.name = name;
    if (plan !== a.plan) body.plan = plan;
    if (bk !== a.dailyBackup) body.dailyBackup = bk;
    if (Object.keys(body).length < 2) return say("amsg", "info", "Nothing changed.");
    if (body.plan && !await dlg("Change the plan of " + a.name + " from " + a.plan + " to " + plan + "? Credits are not charged or refunded.", { title: "Change plan?", ok: "Change plan" })) return;
    say("amsg", "", "");
    try {
      const d = await api("/apps/update", body);
      const notes = [...(d.warnings || []), ...(d.domain ? [d.domain.message] : [])].filter(Boolean);
      await renderApp(a.id);
      say("amsg", notes.length ? "warn" : "ok", notes.length ? "Saved. " + notes.join(" ") : "Changes saved.");
    } catch (e) { say("amsg", "err", e.message); }
  }
  async function resetAppPw() {
    const a = cur.app;
    if (!await dlg("Create a new password for the app " + a.name + "? The old one stops working immediately.", { title: "Reset app password?", ok: "Reset password", danger: true })) return;
    try {
      const d = await api("/apps/reset-password", { appId: a.id });
      await secretDlg("New app password", "Shown only once. The owner can also see it when they sign in.", d.appPassword);
    } catch (e) { say("bmsg", "err", e.message); }
  }
  async function deleteApp() {
    const a = cur.app;
    if (!await dlg("This permanently deletes " + a.name + " with all of its files, backups, database and statistics. It can’t be undone.", { title: "Delete this app?", ok: "Delete app", danger: true, type: a.name })) return;
    say("bmsg", "", "");
    try {
      const d = (await api("/apps/delete", { appId: a.id })).deleted;
      flash("Deleted " + d.name + " (" + d.files + " files, " + d.backups + " backups)");
      go("apps");
    } catch (e) { say("bmsg", "err", e.message); }
  }

  // ---------- events
  let typeT;
  document.addEventListener("click", e => {
    const nv = e.target.closest("[data-go]");
    if (nv) return go(nv.dataset.go);
    const plan = e.target.closest("a[data-plan]");
    if (plan) { A.plan = plan.dataset.plan; A.search = ""; A.owner = ""; A.offset = 0; return; }
    const b = e.target.closest("button[data-act]");
    if (!b || b.disabled) return;
    const act = b.dataset.act;
    if (act === "copy") copyText(b.dataset.v, b);
    else if (act === "reload") route();
    else if (act === "page") {
      if (b.dataset.k === "users") { U.offset = Number(b.dataset.o); loadUsers(); } else { A.offset = Number(b.dataset.o); loadApps(); }
      window.scrollTo(0, 0);
    }
    else if (act === "clearOwner") { A.owner = ""; A.ownerName = ""; A.offset = 0; renderApps(); }
    else if (act === "credAdd") credits("add");
    else if (act === "credSet") credits("set");
    else if (act === "profSave") saveProfile();
    else if (act === "userPw") resetUserPw();
    else if (act === "userDel") deleteUser();
    else if (act === "appSave") saveApp();
    else if (act === "appPw") resetAppPw();
    else if (act === "appDel") deleteApp();
    else if (act === "ownerApps") { A.owner = cur.app.owner; A.ownerName = cur.app.ownerUsername || ""; A.search = ""; A.plan = ""; A.offset = 0; go("apps"); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "uq") { clearTimeout(typeT); typeT = setTimeout(() => { U.search = e.target.value.trim(); U.offset = 0; loadUsers(); }, 300); }
    else if (e.target.id === "aq") { clearTimeout(typeT); typeT = setTimeout(() => { A.search = e.target.value.trim(); A.offset = 0; loadApps(); }, 300); }
  });
  document.addEventListener("change", e => { if (e.target.id === "apl") { A.plan = e.target.value; A.offset = 0; loadApps(); } });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const id = e.target.id;
    if (id === "cr_n") { e.preventDefault(); credits("add"); }
    else if (id === "pf_name" || id === "pf_mail") { e.preventDefault(); saveProfile(); }
    else if (id === "ap_name") { e.preventDefault(); saveApp(); }
  });
  window.addEventListener("hashchange", route);
  $("lockBtn").addEventListener("click", () => { history.replaceState(null, "", location.pathname); lock(); });
  $("themeBtn").addEventListener("click", () => {
    const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("lp-theme", t); } catch (e) {}
  });

  // ---------- boot
  (function () {
    let k = "";
    try { k = sessionStorage.getItem("lp-admin-key") || localStorage.getItem("lp-admin-key") || ""; } catch (e) {}
    if (!k) return lock();
    KEY = k;
    api("/stats", {}).then(start).catch(e => { if (e.message !== "Invalid admin key") lock(e.message); });
  })();
</script>
</body>
</html>
