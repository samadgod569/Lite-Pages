<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File system – Fast Site</title>
<meta name="description" content="Manage the files of your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="../images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("../signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("../dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f4f4f5;--line:#e4e4e7;--text:#09090b;--muted:#52525b;--accent:#0e7490;--accent-ink:#fff;--glow:#dff3f7;--danger:#b91c1c;--ok:#16a34a;--hover:#f4f4f5}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80;--hover:#17171a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;transition:background .2s,color .2s}
  main{flex:1;padding:32px 20px 72px;background:radial-gradient(55% 28% at 50% 0%,var(--glow),transparent 75%)}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  button{font-family:inherit}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1120px;margin:0 auto}

  h1{font-size:30px;letter-spacing:-.03em;line-height:1.15;margin:0 0 4px}
  .sub{margin:0 0 20px;color:var(--muted);font-size:15px}
  .sub b{color:var(--text)}

  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:14px}
  .crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;min-width:0;font-size:15px;font-weight:600}
  .crumbs button{border:0;background:transparent;color:var(--muted);font:inherit;padding:6px 8px;border-radius:8px;cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crumbs button:hover{background:var(--soft);color:var(--text)}
  .crumbs button:last-child{color:var(--text)}
  .crumbs i{font-style:normal;color:var(--muted);opacity:.6}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:8px;width:230px;padding:0 12px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted)}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .search svg{width:18px;height:18px;flex-shrink:0}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:500 14px Inter,sans-serif}
  .search input::-webkit-search-cancel-button{display:none}
  .seg{display:flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .seg button{display:grid;place-items:center;width:34px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--soft);color:var(--text)}
  .seg svg{width:18px;height:18px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font:600 14px Inter,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--text);transition:background .15s,filter .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.main:hover{filter:brightness(1.1);background:var(--accent)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger:hover{filter:brightness(1.1);background:var(--danger)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn svg{width:18px;height:18px}

  .selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:8px 8px 8px 16px;border:1px solid var(--accent);border-radius:14px;background:var(--glow);font-size:14px;font-weight:600}
  .selbar span{margin-right:auto}
  .selbar .btn{height:34px;padding:0 12px;font-size:13px}

  .panel{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
  .head,.row{display:grid;grid-template-columns:48px minmax(0,1fr) 110px 170px 44px;align-items:center}
  .head{padding:0 8px;min-height:50px;border-bottom:1px solid var(--line);background:var(--soft);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .head button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:6px 0;text-align:left}
  .head button:hover,.head button.on{color:var(--accent)}
  .head button .ar{font-size:13px}
  .row{position:relative;padding:0 8px;min-height:54px;border-bottom:1px solid var(--line);transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--hover)}
  .row.sel{background:var(--glow)}
  .row.menu{background:var(--hover)}
  .cell-cb{display:grid;place-items:center}
  .col-size,.col-mod{font-size:13px;color:var(--muted);white-space:nowrap}
  input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid var(--muted);border-radius:5px;background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .12s,border-color .12s}
  input[type=checkbox]:hover{border-color:var(--accent)}
  input[type=checkbox]:checked,input[type=checkbox]:indeterminate{background:var(--accent);border-color:var(--accent)}
  input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
  input[type=checkbox]:indeterminate::after{content:"";width:8px;height:2px;background:var(--accent-ink);border-radius:2px}
  .nm{display:flex;align-items:center;gap:8px;min-width:0}
  .chev{display:grid;place-items:center;width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;flex-shrink:0;transition:transform .15s}
  .chev:hover{background:var(--soft);color:var(--text)}
  .chev svg{width:18px;height:18px}
  .chev.open{transform:rotate(0)}
  .chev.closed{transform:rotate(-90deg)}
  .chev-sp{width:26px;flex-shrink:0}
  .ic{width:26px;height:26px;flex-shrink:0;display:block}
  .open-btn{min-width:0;border:0;background:transparent;color:var(--text);font:500 15px Inter,sans-serif;text-align:left;padding:6px 4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:6px}
  .open-btn:hover{color:var(--accent)}
  .more{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
  .more:hover{background:var(--soft);color:var(--text)}
  .more svg{width:20px;height:20px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
  .tile:hover{border-color:var(--accent);background:var(--hover)}
  .tile.sel{border-color:var(--accent);background:var(--glow)}
  .tile .ic{width:48px;height:48px}
  .tile .tn{max-width:100%;font-size:14px;font-weight:500;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .ts{font-size:12px;color:var(--muted);margin-top:-6px}
  .tile .cb{position:absolute;top:10px;left:10px;opacity:0}
  .tile:hover .cb,.tile.sel .cb,.tile .cb:focus-visible{opacity:1}
  .tile .more{position:absolute;top:6px;right:6px}

  .msg{padding:56px 24px;text-align:center}
  .msg h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
  .msg p{margin:0 0 18px;color:var(--muted);font-size:15px}
  .msg .acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .sk{height:54px;border-bottom:1px solid var(--line);background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .foot{margin:12px 4px 0;font-size:12.5px;color:var(--muted)}

  .ctx{position:fixed;z-index:90;min-width:210px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 18px 50px -12px rgba(0,0,0,.55);animation:pop .12s ease-out}
  .ctx button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 12px;border:0;border-radius:9px;background:transparent;color:var(--text);font:500 15px Inter,sans-serif;text-align:left;cursor:pointer}
  .ctx button:hover,.ctx button:focus-visible{background:var(--soft);outline:0}
  .ctx button svg{width:20px;height:20px;flex-shrink:0}
  .ctx button:disabled{opacity:.4;cursor:default;background:transparent}
  .ctx hr{height:1px;margin:6px 4px;border:0;background:var(--line)}

  dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);padding:0;width:min(440px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto}
  dialog.lg{width:min(860px,calc(100% - 28px))}
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
  dialog[open]{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
  .dlg{padding:26px}
  .dlg h2{margin:0 0 6px;font-size:21px;letter-spacing:-.02em;padding-right:36px}
  .dlg>p{margin:0 0 16px;color:var(--muted);font-size:15px;overflow-wrap:anywhere}
  .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .x:hover{background:var(--soft)}
  .x svg{width:16px;height:16px}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
  .field{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:500 16px Inter,sans-serif}
  .field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
  .err{display:none;margin:12px 0 0;padding:9px 13px;border-radius:12px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);font-size:14px;font-weight:500}
  .err.on{display:block}
  .acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .pick{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;max-height:300px;overflow:auto}
  .pick button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font:500 15px Inter,sans-serif;text-align:left;cursor:pointer}
  .pick button:last-child{border-bottom:0}
  .pick button:hover{background:var(--soft)}
  .pick .ic{width:22px;height:22px}
  .pick p{margin:0;padding:18px;text-align:center;color:var(--muted);font-size:14px}
  .where{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .where b{color:var(--text)}
  textarea.code{display:block;width:100%;height:min(60vh,520px);resize:vertical;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2;white-space:pre}
  textarea.code:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}

  .drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(3px);border:3px dashed var(--accent);margin:10px;border-radius:24px;pointer-events:none}
  .drop div{text-align:center;font-size:20px;font-weight:700}
  .drop small{display:block;margin-top:4px;font-size:14px;font-weight:500;color:var(--muted)}
  .ups{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 32px))}
  .up{padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 10px 30px -12px rgba(0,0,0,.5);font-size:13px}
  .up b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up .pb{height:5px;margin-top:6px;border-radius:99px;background:var(--soft);overflow:hidden}
  .up .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .up.bad{border-color:var(--danger);color:var(--danger)}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;padding:11px 20px;border-radius:999px;transition:.25s;z-index:100;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:700px){
    .head,.row{grid-template-columns:44px minmax(0,1fr) 44px}
    .col-size,.col-mod,.head .col-size,.head .col-mod{display:none}
    .search{width:100%;order:3}
    .tools{width:100%}
    .tools .btn{flex:1}
    .seg{margin-left:auto}
    h1{font-size:26px}
  }
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <h1>File system</h1>
    <p class="sub" id="sub">&nbsp;</p>

    <div class="bar">
      <nav class="crumbs" id="crumbs" aria-label="Current folder"></nav>
      <div class="tools">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="search" id="q" placeholder="Search files..." autocomplete="off" aria-label="Search files"></label>
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="vGrid" aria-label="Grid view" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button>
          <button type="button" id="vList" aria-label="List view" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg></button>
        </div>
        <button class="btn main" type="button" id="btnUpload"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>Upload</button>
        <button class="btn" type="button" id="btnFile"><svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zm-1 7V3.5L18.5 9zm1 5h2v2h-2v2h-2v-2H9v-2h2v-2h2z"/></svg>New File</button>
        <button class="btn" type="button" id="btnFolder"><svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3z"/></svg>New Folder</button>
      </div>
    </div>

    <div class="selbar" id="selbar" hidden>
      <span id="selcount"></span>
      <button class="btn" type="button" data-bulk="copy">Copy</button>
      <button class="btn" type="button" data-bulk="move">Move</button>
      <button class="btn danger" type="button" data-bulk="delete">Delete</button>
      <button class="btn" type="button" data-bulk="clear">Clear</button>
    </div>

    <section class="panel" id="panel" aria-live="polite"></section>
    <p class="foot" id="foot"></p>
  </div>
</main>

<div id="footer"></div>

<div id="ctx" class="ctx" role="menu" hidden></div>
<input type="file" id="picker" multiple hidden>
<div class="ups" id="ups" aria-live="polite"></div>
<div class="drop" id="drop" hidden><div>Drop files to upload<small id="dropTo"></small></div></div>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="dlgForm" method="dialog" novalidate>
    <button class="x" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" hidden></p>
    <div id="dlgFieldBox" hidden>
      <label for="dlgField" id="dlgLabel"></label>
      <input class="field" id="dlgField" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="255">
    </div>
    <div class="err" id="dlgErr" role="alert"></div>
    <div class="acts2">
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn main" type="submit" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<dialog id="pickDlg" aria-labelledby="pickTitle">
  <div class="dlg">
    <button class="x" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
    <h2 id="pickTitle"></h2>
    <p id="pickText"></p>
    <div class="where">Destination: <b id="pickWhere"></b></div>
    <div class="pick" id="pickList"></div>
    <div class="err" id="pickErr" role="alert"></div>
    <div class="acts2">
      <button class="btn" type="button" id="pickUp">Up one folder</button>
      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn main" type="button" id="pickOk">Select</button>
    </div>
  </div>
</dialog>

<dialog id="edDlg" class="lg" aria-labelledby="edTitle">
  <div class="dlg">
    <button class="x" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4l5.6 5.6L5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
    <h2 id="edTitle"></h2>
    <p id="edPath"></p>
    <textarea class="code" id="edText" spellcheck="false" aria-label="File contents"></textarea>
    <div class="err" id="edErr" role="alert"></div>
    <div class="acts2">
      <button class="btn" type="button" data-close>Close</button>
      <button class="btn main" type="button" id="edSave">Save</button>
    </div>
  </div>
</dialog>

<script>
  const API_BASE = "https://gen1-litepages.wisp.uno/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  const MAX_UPLOAD = 100 * 1024 * 1024;
  const MAX_EDIT = 1024 * 1024;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  fetch("../assets/panel-essentials.html").then(r => r.text()).then(html => {
    const box = $("panelEssentials");
    box.innerHTML = html;
    box.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }).catch(e => console.error("Could not load panel-essentials.html", e));
  fetch("../assets/footer.html").then(r => r.ok ? r.text() : "").then(h => { $("footer").innerHTML = h; }).catch(() => {});

  const creds = () => { try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; } catch (e) { return {}; } };
  const PASS_KEY = "lp-app-password:" + APP_ID;
  const appPass = () => { try { return localStorage.getItem(PASS_KEY) || ""; } catch (e) { return ""; } };
  const setPass = v => { try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} };

  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("on");
    clearTimeout(toastTimer);

    pressTimer = setTimeout(() => { pressed = true; openMenu(t.clientX, t.clientY, itemOf(row), row); }, 550);
  }, { passive: true });
  ["touchend", "touchmove", "touchcancel"].forEach(n => $("panel").addEventListener(n, () => clearTimeout(pressTimer), { passive: true }));
  $("panel").addEventListener("click", e => { if (pressed) { pressed = false; e.stopPropagation(); e.preventDefault(); } }, true);

  document.addEventListener("click", e => { if (!ctx.hidden && !e.target.closest("#ctx")) closeMenu(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !ctx.hidden) closeMenu(); });
  addEventListener("scroll", () => { if (!ctx.hidden) closeMenu(); }, true);
  addEventListener("resize", () => { if (!ctx.hidden) closeMenu(); });
  ctx.addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    const item = ctxItem;
    closeMenu();
    runAction(b.dataset.act, item);
  });

  $("crumbs").addEventListener("click", e => { const b = e.target.closest("[data-nav]"); if (b) navigate(b.dataset.nav); });
  $("q").addEventListener("input", e => { query = e.target.value; render(); });
  $("vGrid").addEventListener("click", () => setView("grid"));
  $("vList").addEventListener("click", () => setView("list"));
  function setView(v) { view = v; try { localStorage.setItem("lp-fs-view", v); } catch (e) {} render(); }
  $("btnUpload").addEventListener("click", () => runAction("upload", null));
  $("btnFile").addEventListener("click", () => runAction("newfile", null));
  $("btnFolder").addEventListener("click", () => runAction("newfolder", null));
  $("selbar").addEventListener("click", e => {
    const b = e.target.closest("[data-bulk]");
    if (!b) return;
    if (b.dataset.bulk === "clear") { selected.clear(); return render(); }
    const first = [...selected][0];
    if (!first) return;
    runAction(b.dataset.bulk, { path: first, ...metaOf.get(first) });
  });

  const dlg = $("dlg"), dlgForm = $("dlgForm");
  let dlgResolve = null;
  function ask(o) {
    return new Promise(resolve => {
      dlgResolve = resolve;
      $("dlgTitle").textContent = o.title;
      $("dlgText").textContent = o.text || "";
      $("dlgText").hidden = !o.text;
      $("dlgFieldBox").hidden = !o.label;
      $("dlgLabel").textContent = o.label || "";
      const f = $("dlgField");
      f.type = o.password ? "password" : "text";
      f.value = o.value || "";
      $("dlgErr").classList.remove("on");
      const ok = $("dlgOk");
      ok.textContent = o.confirm || "OK";
      ok.className = "btn " + (o.danger ? "danger" : "main");
      ok.disabled = false;
      dlg._validate = o.validate || null;
      dlg.showModal();
      if (o.label) {
        f.focus();
        if (o.select) f.setSelectionRange(0, o.select);
        else f.select();
      }
    });
  }
  function dlgDone(v) {
    if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(v); }
    if (dlg.open) dlg.close();
  }
  dlgForm.addEventListener("submit", e => {
    e.preventDefault();
    const labelled = !$("dlgFieldBox").hidden;
    const v = labelled ? $("dlgField").value.trim() : true;
    if (labelled && !v) return showDlgErr("Please enter a value.");
    if (dlg._validate) { const m = dlg._validate(v); if (m) return showDlgErr(m); }
    dlgDone(v);
  });
  function showDlgErr(m) { $("dlgErr").textContent = m; $("dlgErr").classList.add("on"); }
  dlg.addEventListener("cancel", () => { if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(null); } });
  dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) { if (dlgResolve) { const r = dlgResolve; dlgResolve = null; r(null); } dlg.close(); } });

  function nameError(v, dir, skip) {
    if (v === "." || v === ".." || /[\/\\\x00-\x1f]/.test(v)) return "A name can't contain / or \\.";
    if (v.length > 255) return "That name is too long.";
    const same = (dirs.get(dir) || []).find(i => i.name === v && i.name !== skip);
    if (same) return "Something named \u201c" + v + "\u201d already exists here.";
    return null;
  }

  const pickDlg = $("pickDlg");
  let pickState = null;
  async function pickFolder(o) {
    return new Promise(resolve => {
      pickState = { ...o, path: o.start || "", resolve, done: false };
      $("pickTitle").textContent = o.title;
      $("pickText").textContent = o.text;
      $("pickOk").textContent = o.confirm;
      pickDlg.showModal();
      showPick();
    });
  }
  async function showPick() {
    const s = pickState;
    $("pickWhere").textContent = "Home" + (s.path ? " / " + s.path.split("/").join(" / ") : "");
    $("pickUp").disabled = !s.path;
    $("pickErr").classList.remove("on");
    $("pickList").innerHTML = "<p>Loading\u2026</p>";
    try {
      await loadDir(s.path, true);
      const blocked = new Set(s.exclude);
      const folders = (dirs.get(s.path) || []).filter(i => i.type === "folder" && !blocked.has(join(s.path, i.name)));
      $("pickList").innerHTML = folders.length
        ? folders.map(f => '<button type="button" data-to="' + esc(join(s.path, f.name)) + '">' + ICONS.folder + esc(f.name) + "</button>").join("")
        : "<p>No folders in here.</p>";
    } catch (err) { $("pickList").innerHTML = ""; $("pickErr").textContent = err.message; $("pickErr").classList.add("on"); }
  }
  $("pickList").addEventListener("click", e => { const b = e.target.closest("[data-to]"); if (b) { pickState.path = b.dataset.to; showPick(); } });
  $("pickUp").addEventListener("click", () => { pickState.path = parentOf(pickState.path); showPick(); });
  $("pickOk").addEventListener("click", () => { pickState.done = true; pickState.resolve(pickState.path); pickDlg.close(); });
  pickDlg.addEventListener("close", () => { if (pickState && !pickState.done) pickState.resolve(null); pickState = null; });
  pickDlg.addEventListener("click", e => { if (e.target === pickDlg || e.target.closest("[data-close]")) pickDlg.close(); });

  const edDlg = $("edDlg");
  let edPath = "";
  async function openEditor(it) {
    const e = extOf(it.name);
    if (BINARY.includes(e)) return toast("This file type can't be edited. Use Download instead.");
    if (it.size > MAX_EDIT) return toast("Files over 1 MB can't be edited here. Use Download instead.");
    try {
      const d = await fsApi("read", { path: it.path, encoding: "utf8" });
      const text = d.content || "";
      if (text.includes("\u0000")) return toast("This looks like a binary file. Use Download instead.");
      edPath = it.path;
      $("edTitle").textContent = it.name;
      $("edPath").textContent = "Home / " + it.path.split("/").join(" / ");
      $("edText").value = text;
      $("edErr").classList.remove("on");
      $("edSave").disabled = false;
      edDlg.showModal();
      $("edText").focus();
    } catch (err) { toast(err.message); }
  }
  async function saveEditor() {
    const btn = $("edSave");
    btn.disabled = true;
    try {
      await fsApi("write", { path: edPath, content: $("edText").value, encoding: "utf8" });
      toast("Saved");
      await reloadAll();
      render();
    } catch (err) { $("edErr").textContent = err.message; $("edErr").classList.add("on"); }
    btn.disabled = false;
  }
  $("edSave").addEventListener("click", saveEditor);
  $("edText").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveEditor(); }
    if (e.key === "Tab" && !e.shiftKey) {
      e.preventDefault();
      const t = e.target, s = t.selectionStart;
      t.setRangeText("  ", s, t.selectionEnd, "end");
    }
  });
  edDlg.addEventListener("click", e => { if (e.target === edDlg || e.target.closest("[data-close]")) edDlg.close(); });

  function openItem(item) {
    if (item.type === "folder") navigate(item.path);
    else openEditor(item);
  }

  async function runAction(act, item) {
    try {
      if (act === "newfolder" || act === "newfile") return await makeNew(act, dirFor(item));
      if (act === "upload") return pickUpload(dirFor(item));
      if (act === "download") return await download(item);
      if (act === "extract") { await fsApi("extract", { path: item.path, to: parentOf(item.path) }); toast("Extracted"); await afterChange(); return; }
      if (act === "rename") return await rename(item);
      if (act === "copy" || act === "move") return await copyMove(act, targetsFor(item));
      if (act === "delete") return await remove(targetsFor(item));
    } catch (err) {
      if (err.message !== "App password required") toast(err.message);
    }
  }

  async function afterChange() {
    await reloadAll();
    render();
  }

  async function makeNew(kind, dir) {
    await loadDir(dir);
    const folder = kind === "newfolder";
    const v = await ask({
      title: folder ? "New folder" : "New file",
      text: dir ? "It will be created in \u201c" + dir + "\u201d." : "",
      label: folder ? "Folder name" : "File name",
      value: "", confirm: "Create",
      validate: val => nameError(val, dir)
    });
    if (!v) return;
    const p = join(dir, v);
    if (folder) await fsApi("mkdir", { path: p });
    else await fsApi("write", { path: p, content: "", encoding: "utf8" });
    if (dir !== cwd) { expanded.add(dir); }
    toast((folder ? "Folder" : "File") + " created");
    await afterChange();
  }

  async function rename(item) {
    const dir = parentOf(item.path);
    await loadDir(dir);
    const dot = item.type === "file" ? item.name.lastIndexOf(".") : -1;
    const v = await ask({
      title: "Rename", label: "New name", value: item.name, confirm: "Rename",
      select: dot > 0 ? dot : item.name.length,
      validate: val => val === item.name ? "Choose a different name." : nameError(val, dir, item.name)
    });
    if (!v) return;
    await fsApi("rename", { path: item.path, newName: v });
    selected.delete(item.path);
    expanded.delete(item.path);
    toast("Renamed");
    await afterChange();
  }

  async function remove(list) {
    const one = list.length === 1;
    const ok = await ask({
      title: one ? "Delete " + (list[0].type === "folder" ? "folder" : "file") + "?" : "Delete " + list.length + " items?",
      text: one ? "\u201c" + list[0].name + "\u201d" + (list[0].type === "folder" ? " and everything inside it" : "") + " will be deleted. This can't be undone." : "The selected items (and everything inside folders) will be deleted. This can't be undone.",
      confirm: "Delete", danger: true
    });
    if (!ok) return;
    let done = 0, last = null;
    for (const t of list) {
      try { await fsApi("delete", { path: t.path }); done++; selected.delete(t.path); expanded.delete(t.path); }
      catch (err) { last = err; }
    }
    if (done) toast(done === 1 ? "Deleted" : done + " items deleted");
    if (last) toast(last.message);
    await afterChange();
  }

  async function copyMove(kind, list) {
    const copy = kind === "copy";
    const exclude = list.filter(t => t.type === "folder").map(t => t.path);
    const dest = await pickFolder({
      title: (copy ? "Copy " : "Move ") + (list.length === 1 ? "\u201c" + list[0].name + "\u201d" : list.length + " items"),
      text: "Open the folder you want to " + (copy ? "copy" : "move") + " into, then confirm.",
      confirm: copy ? "Copy here" : "Move here",
      start: parentOf(list[0].path),
      exclude: copy ? [] : exclude
    });
    if (dest === null) return;
    let done = 0, last = null;
    for (const t of list) {
      if (!copy && (dest === t.path || dest.startsWith(t.path + "/"))) { last = new Error("Can't move a folder into itself."); continue; }
      try { await fsApi(kind, { from: t.path, to: dest }); done++; }
      catch (err) { last = err; }
    }
    if (done) { toast((copy ? "Copied " : "Moved ") + (done === 1 ? "1 item" : done + " items")); selected.clear(); }
    if (last) toast(last.message);
    await afterChange();
  }

  async function download(item) {
    toast(item.type === "folder" ? "Preparing zip\u2026" : "Preparing download\u2026");
    const res = await request("/fs/download", { path: item.path }, true);
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = item.type === "folder" ? item.name + ".zip" : item.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  }

  const picker = $("picker");
  let uploadDir = "";
  function pickUpload(dir) { uploadDir = dir; picker.value = ""; picker.click(); }
  picker.addEventListener("change", () => { if (picker.files.length) uploadFiles([...picker.files], uploadDir); });

  function sendOne(file, dir, box) {
    return new Promise(resolve => {
      const { u, p } = creds();
      const fd = new FormData();
      fd.append("username", u); fd.append("password", p);
      fd.append("appId", APP_ID); fd.append("appPassword", appPass());
      fd.append("op", "upload"); fd.append("path", dir);
      fd.append("file", file, file.name);
      const xhr = new XMLHttpRequest();
      xhr.open("POST", API_BASE + "/fs");
      xhr.upload.onprogress = e => { if (e.lengthComputable) box.querySelector("i").style.width = (e.loaded / e.total * 100) + "%"; };
      xhr.onload = () => {
        let d = {};
        try { d = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 401 && /app password/i.test(d.error || "")) setPass("");
        resolve(xhr.status >= 200 && xhr.status < 300 && d.success !== false ? null : (d.error || "Upload failed (HTTP " + xhr.status + ")"));
      };
      xhr.onerror = () => resolve("Couldn't reach the server");
      xhr.send(fd);
    });
  }

  async function uploadFiles(files, dir) {
    if (!appPass()) { try { await askPass(); } catch (e) { return; } }
    let okCount = 0;
    for (const f of files) {
      const box = document.createElement("div");
      box.className = "up";
      box.innerHTML = "<b>" + esc(f.name) + '</b><div class="pb"><i></i></div>';
      $("ups").appendChild(box);
      let err = null;
      if (f.size > MAX_UPLOAD) err = "Larger than 100 MB";
      else err = await sendOne(f, dir, box);
      if (err) {
        box.classList.add("bad");
        box.innerHTML = "<b>" + esc(f.name) + "</b>" + esc(err);
        setTimeout(() => box.remove(), 6000);
      } else {
        okCount++;
        box.querySelector("i").style.width = "100%";
        setTimeout(() => box.remove(), 900);
      }
    }
    if (okCount) { toast(okCount === 1 ? "1 file uploaded" : okCount + " files uploaded"); if (dir !== cwd) expanded.add(dir); await afterChange().catch(e => toast(e.message)); }
  }

  let dragDepth = 0;
  const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  addEventListener("dragenter", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("dropTo").textContent = "to " + (cwd ? "Home / " + cwd.split("/").join(" / ") : "Home"); $("drop").hidden = false; });
  addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener("dragleave", e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("drop").hidden = true; });
  addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0; $("drop").hidden = true;
    if (e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files], cwd);
  });

  async function init() {
    document.title = "File system – Fast Site";
    try {
      const { u, p } = creds();
      const r = await fetch(API_BASE + "/apps/list", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: u, password: p }) });
      const d = await r.json();
      const a = (d.apps || []).find(x => x.id === APP_ID);
      if (a) { appName = a.name; $("sub").innerHTML = "App <b>" + esc(a.name) + "</b>"; document.title = a.name + " – File system – Fast Site"; }
      else if (r.ok) { $("sub").textContent = ""; }
    } catch (e) {}
    await go(hashPath());
  }
  init();
</script>
</body>
</html>
