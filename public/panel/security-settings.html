<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security settings – Fast Site</title>
<meta name="description" content="Private mode, IP blocking, maintenance mode, iframe protection and hotlink protection for your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e4e4e7;--text:#09090b;--muted:#5b5b66;--accent:#0e7490;--accent-ink:#fff;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
  main{flex:1;padding:32px 20px 64px}
  [hidden]{display:none!important}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px}
  .sub b{color:var(--text)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  .nav{position:static;display:flex;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nv{text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .nv:hover{background:var(--soft);color:var(--text)}
  .nv.on{background:var(--soft);color:var(--text);font-weight:600;border-color:var(--accent)}
  .panel{min-width:0}
  .panel h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
  .lead{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .lead b{color:var(--text)}

  .list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .st{padding:16px 18px}
  .st+.st{border-top:1px solid var(--line)}
  .hd{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:space-between;align-items:center}
  .tx{flex:1 1 200px;min-width:0}
  .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .d{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .rt{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .val{font-size:14px;font-weight:500;color:var(--muted)}
  .ed{padding-top:14px}
  .locked .tx{opacity:.6}

  .label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.warn{color:var(--danger)}
  .pill.ok{color:var(--ok)}
  .pill.lock{background:transparent}
  .hint{margin:7px 0 0;font-size:12.5px;color:var(--muted)}

  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;max-width:380px}
  .field:focus-within,textarea.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field.num{max-width:260px}
  .field input{flex:1;min-width:0;padding:9px 12px;border:0;outline:0;background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif}
  .field input::placeholder{color:var(--muted);opacity:.7}
  .field input:disabled,.field select:disabled{opacity:.5;cursor:not-allowed}
  .sfx{display:flex;align-items:center;padding:0 12px;background:var(--soft);border-left:1px solid var(--line);color:var(--muted);font-size:14px}
  select.sel{appearance:none;-webkit-appearance:none;border:0;border-left:1px solid var(--line);background:var(--soft);color:var(--muted);font:500 14px Inter,sans-serif;padding:0 26px 0 12px;cursor:pointer;outline:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .field.solo select.sel{border-left:0;background-color:var(--surface);color:var(--text);flex:1;padding:9px 30px 9px 12px;font-size:14.5px}
  textarea.ta{width:100%;max-width:520px;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;display:block}
  textarea.ta:disabled{opacity:.5}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.small{padding:6px 12px;font-size:13px}

  .msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--soft)}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .msg.info{color:var(--muted)}

  .sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
  .sw input:checked+i{background:var(--accent)}
  .sw input:checked+i::after{transform:translateX(18px)}
  .sw input:disabled{cursor:not-allowed}
  .sw input:disabled+i{opacity:.45}
  .sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

  .rule{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
  .rule+.rule{border-top:1px solid var(--line)}
  .rule .n{width:24px;height:24px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .rule .m{min-width:0}
  .rule .m b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rule .m small{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);font-size:12.5px;align-items:center}
  .rule .m code{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--text)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .acts .btn{padding:5px 10px;font-size:12.5px}
  .none{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
  .form{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .form>*+*{margin-top:14px}
  .form h3{margin:0;font-size:15px}
  .form>.hint{margin-top:8px}
  .form>.row{margin-top:18px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .cols .field{max-width:none}
  .fg+.fg{margin-top:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .stat{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
  .stat span{font-size:12.5px;font-weight:500;color:var(--muted)}
  .hist{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
  .hist li{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px}
  .hist li+li{border-top:1px solid var(--line)}
  .hist time{color:var(--muted);min-width:170px}
  .hist .by{margin-left:auto}
  h3.sec{margin:24px 0 8px;font-size:15px}

  .sk{border:1px solid var(--line);border-radius:12px;height:240px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:48px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:21px}
  .empty p{margin:0 0 20px;color:var(--muted)}
  .gate{max-width:480px}

  @media(max-width:820px){
    main{padding:24px 16px 48px}
  }
  @media(max-width:560px){
    h1{font-size:23px}
    .st{padding:14px}
    .field,.field.num,textarea.ta{max-width:none}
    .rule{grid-template-columns:28px minmax(0,1fr)}
    .rule .acts{grid-column:1/-1;justify-content:flex-start}
    .hist time{min-width:0}
    .form{padding:14px}
  }
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}

  a.nv{text-decoration:none;display:inline-block}
  .prev.ml{white-space:pre-wrap}
  .form .pills{margin-top:2px}
  .form .pills .pill{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .list+.form,.none+.form{margin-top:14px}
  .list .rule .m b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px}
  .rule .m code.hdr{display:block;max-width:100%;white-space:normal;word-break:break-all;font-weight:500}
  .chks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 18px}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
  .chk input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}
  .chk small{display:block;color:var(--muted);font-size:12.5px}
  .prev{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;white-space:normal}
  .about p{margin:0 0 10px;font-size:14px;color:var(--muted)}
  .about p b{color:var(--text)}

  /* ui-kit: custom dropdowns, checkboxes, dialog */
  select.sel[data-dd]{display:none!important}
  .dd{position:relative;display:flex;min-width:0}
  .field.solo .dd{flex:1}
  .dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-width:0;border:0;border-left:1px solid var(--line);background:var(--soft);color:var(--muted);font:500 14px Inter,sans-serif;padding:0 12px;cursor:pointer;text-align:left;transition:color .12s,background .12s}
  .field.solo .dd-btn{border-left:0;background:transparent;color:var(--text);padding:9px 12px;font-size:14.5px}
  .dd-btn:hover{color:var(--text)}
  .dd-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .dd-btn:disabled{opacity:.5;cursor:not-allowed}
  .dd-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-btn svg{width:14px;height:14px;flex-shrink:0;transition:transform .15s}
  .dd.open .dd-btn svg{transform:rotate(180deg)}
  .dd-menu{position:fixed;z-index:1000;max-height:260px;overflow:auto;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.12);animation:ddIn .12s ease-out;font-family:Inter,system-ui,sans-serif}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px)}}
  @keyframes ddFade{from{opacity:0}}
  .dd-opt{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);cursor:pointer;white-space:nowrap;user-select:none}
  .dd-opt.act{background:var(--soft)}
  .dd-opt[aria-selected=true]{font-weight:600;color:var(--accent)}
  .dd-opt[aria-disabled=true]{opacity:.45;cursor:not-allowed}
  .dd-opt svg{width:14px;height:14px;flex-shrink:0;opacity:0}
  .dd-opt[aria-selected=true] svg{opacity:1}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .chk input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:2px 0 0;border:1.5px solid var(--line);border-radius:5px;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex-shrink:0;transition:background .12s,border-color .12s}
  .chk input:hover{border-color:var(--accent)}
  .chk input:checked{background:var(--accent);border-color:var(--accent)}
  .chk input::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .12s}
  .chk input:checked::after{transform:rotate(45deg) scale(1)}
  .chk input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mdl{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,#000 55%,transparent);animation:ddFade .12s ease-out}
  .mdl-box{width:100%;max-width:400px;padding:20px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:ddIn .14s ease-out}
  .mdl-box h3{margin:0 0 6px;font-size:17px}
  .mdl-box p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line}
  .mdl-box .row{justify-content:flex-end;margin-top:20px}
  .btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}

  /* chip input: type, press Enter / Add, save all at once */
  .chipbox{width:100%;max-width:520px}
  .chipbox .field{max-width:none}
  .chipbox .field .btn{border:0;border-left:1px solid var(--line);border-radius:0;background:var(--soft);color:var(--text);padding:0 16px}
  .chipbox .field .btn:hover{background:var(--line);opacity:1}
  .chiplist{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .chiplist:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:3px 4px 3px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
  .chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip button{flex-shrink:0;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);font:600 12px Inter,sans-serif;line-height:1;cursor:pointer}
  .chip button:hover{background:var(--line);color:var(--danger)}
  .chip button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .chip button:disabled{cursor:not-allowed;opacity:.5}
  .chipbox.dis{opacity:.6}
  @media(max-width:560px){.chipbox{max-width:none}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header>
      <h1>Security settings</h1>
      <p class="sub" id="sub">&nbsp;</p>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>

<script>
  /* ui-kit: custom dropdowns (replace native selects) + confirm dialog */
  (function () {
    const CHEV = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>';
    const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
    let cur = null;
    const lab = sel => { const o = sel.options[sel.selectedIndex]; return o ? o.textContent : ""; };
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function close(focus) {
      if (!cur) return;
      const c = cur; cur = null;
      c.menu.remove(); c.wrap.classList.remove("open"); c.btn.setAttribute("aria-expanded", "false");
      document.removeEventListener("mousedown", onOutside, true);
      document.removeEventListener("keydown", onKey, true);
      window.removeEventListener("resize", onAway);
      window.removeEventListener("scroll", onScroll, true);
      if (focus) c.btn.focus();
    }
    const onAway = () => close(false);
    const onScroll = e => { if (cur && !cur.menu.contains(e.target)) close(false); };
    const onOutside = e => { if (cur && !cur.menu.contains(e.target) && !cur.wrap.contains(e.target)) close(false); };
    function setActive(i) {
      const kids = cur.menu.children;
      if (!kids[i]) return;
      if (kids[cur.i]) kids[cur.i].classList.remove("act");
      cur.i = i; kids[i].classList.add("act"); kids[i].scrollIntoView({ block: "nearest" });
    }
    function step(d) {
      const o = cur.sel.options; let i = cur.i;
      for (let n = 0; n < o.length; n++) { i = (i + d + o.length) % o.length; if (!o[i].disabled) return setActive(i); }
    }
    function choose(i) {
      const c = cur, sel = c.sel;
      if (!sel.options[i] || sel.options[i].disabled) return;
      const changed = sel.selectedIndex !== i;
      sel.selectedIndex = i;
      c.btn.querySelector(".dd-lab").textContent = lab(sel);
      close(true);
      if (changed) sel.dispatchEvent(new Event("change", { bubbles: true }));
    }
    function onKey(e) {
      if (!cur) return;
      const k = e.key;
      if (k === "ArrowDown") { e.preventDefault(); step(1); }
      else if (k === "ArrowUp") { e.preventDefault(); step(-1); }
      else if (k === "Home") { e.preventDefault(); setActive(0); }
      else if (k === "End") { e.preventDefault(); setActive(cur.sel.options.length - 1); }
      else if (k === "Enter" || k === " ") { e.preventDefault(); choose(cur.i); }
      else if (k === "Escape") { e.preventDefault(); e.stopPropagation(); close(true); }
      else if (k === "Tab") close(false);
    }
    function open(wrap) {
      close(false);
      const sel = wrap._sel, btn = wrap._btn;
      if (btn.disabled) return;
      const menu = document.createElement("div");
      menu.className = "dd-menu"; menu.setAttribute("role", "listbox");
      menu.innerHTML = [...sel.options].map((o, i) =>
        '<div class="dd-opt" role="option" data-i="' + i + '" aria-selected="' + (i === sel.selectedIndex) + '"' + (o.disabled ? ' aria-disabled="true"' : "") + "><span>" + esc(o.textContent) + "</span>" + CHECK + "</div>").join("");
      menu.addEventListener("mousedown", e => e.preventDefault());
      menu.addEventListener("click", e => { const t = e.target.closest(".dd-opt"); if (t) choose(+t.dataset.i); });
      menu.addEventListener("mousemove", e => { const t = e.target.closest(".dd-opt"); if (t && cur && cur.i !== +t.dataset.i && t.getAttribute("aria-disabled") !== "true") setActive(+t.dataset.i); });
      document.body.appendChild(menu);
      const r = btn.getBoundingClientRect();
      menu.style.minWidth = Math.max(r.width, 140) + "px";
      const mh = menu.offsetHeight, mw = menu.offsetWidth, below = innerHeight - r.bottom;
      const top = below < mh + 12 && r.top > below ? Math.max(8, r.top - mh - 6) : r.bottom + 6;
      menu.style.top = top + "px";
      menu.style.left = Math.max(8, Math.min(r.left, innerWidth - mw - 8)) + "px";
      wrap.classList.add("open"); btn.setAttribute("aria-expanded", "true");
      cur = { wrap, btn, menu, sel, i: Math.max(0, sel.selectedIndex) };
      setActive(cur.i);
      document.addEventListener("mousedown", onOutside, true);
      document.addEventListener("keydown", onKey, true);
      window.addEventListener("resize", onAway);
      window.addEventListener("scroll", onScroll, true);
    }
    function enhance(root) {
      root.querySelectorAll("select.sel:not([data-dd])").forEach(sel => {
        const wrap = document.createElement("div"); wrap.className = "dd";
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "dd-btn";
        btn.setAttribute("aria-haspopup", "listbox"); btn.setAttribute("aria-expanded", "false");
        const l = sel.id && document.querySelector('label[for="' + sel.id + '"]');
        const al = (l && l.textContent) || sel.getAttribute("aria-label");
        if (al) btn.setAttribute("aria-label", al);
        btn.innerHTML = '<span class="dd-lab"></span>' + CHEV;
        btn.querySelector(".dd-lab").textContent = lab(sel);
        btn.disabled = sel.disabled;
        wrap._sel = sel; wrap._btn = btn;
        btn.addEventListener("click", () => (cur && cur.wrap === wrap ? close(true) : open(wrap)));
        btn.addEventListener("keydown", e => { if (!cur && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); open(wrap); } });
        wrap.appendChild(btn);
        sel.dataset.dd = "1";
        sel.after(wrap);
        sel.addEventListener("change", () => { btn.querySelector(".dd-lab").textContent = lab(sel); });
      });
    }
    const host = document.getElementById("content") || document.body;
    new MutationObserver(() => { if (cur && !cur.wrap.isConnected) close(false); enhance(host); }).observe(host, { childList: true, subtree: true });
    enhance(host);

    // pretty replacement for confirm(): await askConfirm("text", { title, ok, danger })
    window.askConfirm = function (text, o) {
      o = o || {};
      return new Promise(res => {
        const prev = document.activeElement;
        const m = document.createElement("div"); m.className = "mdl";
        m.innerHTML = '<div class="mdl-box" role="alertdialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">' + esc(o.title || "Are you sure?") + "</h3><p>" + esc(text) + "</p>" +
          '<div class="row"><button class="btn ghost" type="button" data-r="0">Cancel</button><button class="btn' + (o.danger ? " danger solid" : "") + '" type="button" data-r="1">' + esc(o.ok || "Confirm") + "</button></div></div>";
        const done = v => { document.removeEventListener("keydown", key, true); m.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); res(v); };
        const key = e => {
          if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
          else if (e.key === "Tab") {
            const b = m.querySelectorAll("button"); e.preventDefault();
            (document.activeElement === b[0] ? b[1] : b[0]).focus();
          }
        };
        m.addEventListener("click", e => { const b = e.target.closest("button"); if (b) done(b.dataset.r === "1"); else if (e.target === m) done(false); });
        document.addEventListener("keydown", key, true);
        document.body.appendChild(m);
        m.querySelector('[data-r="1"]').focus();
      });
    };
  })();
</script>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  const TABS = [["private", "Private mode"], ["ips", "IP blocking"], ["maintenance", "Maintenance"], ["frame", "Iframe protection"], ["hsts", "HSTS"], ["hotlink", "Hotlink protection"]];
  let app = null, st = null, tab = (TABS.find(t => "#" + t[0] === location.hash) || TABS[0])[0];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function inject(id, url) {
    fetch(url).then(r => r.ok ? r.text() : "").then(html => {
      const box = $(id);
      box.innerHTML = html;
      box.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    }).catch(e => console.error("Could not load " + url, e));
  }
  inject("panelEssentials", "../assets/panel-essentials.html");
  inject("footer", "../assets/footer-panel.html");

  // ---------- credentials / api
  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  const storedAppPw = () => { try { return localStorage.getItem("lp-app-password:" + APP_ID) || ""; } catch (e) { return ""; } };
  const saveAppPw = pw => { try { localStorage.setItem("lp-app-password:" + APP_ID, pw); } catch (e) {} };
  const forgetAppPw = () => { try { localStorage.removeItem("lp-app-password:" + APP_ID); } catch (e) {} };
  const appPassword = () => storedAppPw() || ($("apw") ? $("apw").value : "");

  async function post(path, extra) {
    const { u, p } = creds();
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p }, extra))
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { res, data };
  }
  const appPost = (path, extra) => post(path, Object.assign({ appId: APP_ID, appPassword: appPassword() }, extra));

  function say(id, kind, text) {
    const el = $(id);
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }
  function commonErrors(res, data) {
    if (res.status === 401 && /app password/i.test(data.error || "")) {
      forgetAppPw(); st = null;
      showPasswordGate("That app password is wrong. Enter the right one.");
      return true;
    }
    if (res.status === 401) { location.replace("signup.html"); return true; }
    return false;
  }
  const netErr = "Network error. Check your connection and try again.";

  // ---------- helpers
  const head = (t, l) => "<h2>" + esc(t) + '</h2><p class="lead">' + l + "</p>";
  const opt = (val, cur, label) => '<option value="' + val + '"' + (cur === val ? " selected" : "") + ">" + label + "</option>";
  const lines = (s, re) => String(s).split(re).map(x => x.trim()).filter(Boolean);
  const onOff = v => v ? '<span class="pill ok">On</span>' : '<span class="pill">Off</span>';
  const swRow = (id, title, desc, on, dis) =>
    '<div class="hd"><div class="tx"><div class="t">' + esc(title) + '</div><p class="d">' + desc + "</p></div>" +
    '<div class="rt"><label class="sw"><input type="checkbox" id="' + id + '" aria-label="' + esc(title) + '"' + (on ? " checked" : "") + (dis ? " disabled" : "") + "><i></i></label></div></div>";
  const lockNote = () => st.premium ? "" : '<p class="msg info">This setting needs a paid plan. You can look around, but changes are turned off on the Free plan.</p>';
  const msgBox = '<p class="msg" id="pmsg" hidden></p>';

  // ---------- header + password gate
  function renderHeader() {
    document.title = app.name + " – Security settings – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(app.name) + "</b>";
  }
  function showPasswordGate(errText) {
    $("content").innerHTML =
      '<div class="gate"><h2 style="margin:0 0 2px;font-size:19px">App password</h2>' +
      '<p class="lead">Security settings need your app password. It was shown once when you created the app.</p>' +
      '<div class="field"><input id="apw" type="password" autocomplete="current-password" placeholder="App password"></div>' +
      '<div class="row"><button class="btn" id="pwBtn" type="button">Continue</button></div>' +
      '<p class="msg" id="pwMsg" hidden></p></div>';
    $("pwBtn").addEventListener("click", unlock);
    $("apw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    $("apw").focus();
    if (errText) say("pwMsg", "err", errText);
  }
  async function unlock() {
    const pw = $("apw").value;
    if (!pw) return say("pwMsg", "err", "Enter your app password.");
    $("pwBtn").disabled = true;
    try { await loadAll(pw); } finally { if ($("pwBtn")) $("pwBtn").disabled = false; }
  }

  // ---------- page skeleton: tab nav + one panel at a time
  function build() {
    $("content").innerHTML = '<div class="layout"><nav class="nav" id="nav" aria-label="Security sections"></nav><section class="panel" id="panel"></section></div>';
    $("nav").innerHTML = TABS.map(([id, t]) => '<button type="button" class="nv" data-t="' + id + '">' + esc(t) + "</button>").join("") +
      '<a class="nv" href="../docs/security-settings.html">How it works</a>';
    $("nav").addEventListener("click", e => {
      const b = e.target.closest("[data-t]");
      if (!b) return;
      tab = b.dataset.t;
      try { history.replaceState(null, "", "#" + tab); } catch (err) {}
      render();
    });
    $("panel").addEventListener("click", onClick);
    $("panel").addEventListener("change", onChange);
    chipWire($("panel"));
    $("panel").addEventListener("input", onInput);
    $("panel").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "ck_ip") { e.preventDefault(); checkIp(); } });
    render();
  }
  function render(msg) {
    $("nav").querySelectorAll(".nv").forEach(b => {
      const on = b.dataset.t === tab;
      b.classList.toggle("on", on);
      if (on) { b.setAttribute("aria-current", "page"); b.scrollIntoView({ block: "nearest", inline: "center" }); } else b.removeAttribute("aria-current");
    });
    ({ private: renderPrivate, ips: renderIps, maintenance: renderMaint, frame: renderFrame, hsts: renderHsts, hotlink: renderHotlink }[tab] || renderPrivate)();
    if (msg) say("pmsg", msg[0], msg[1]);
  }

  // ---------- chip input (shared helpers)
  function chipHtml(v, dis) {
    return '<span class="chip" data-v="' + esc(v) + '"><span>' + esc(v) + '</span><button type="button" data-act="chipRm" aria-label="Remove ' + esc(v) + '"' + (dis ? " disabled" : "") + ">✕</button></span>";
  }
  function chipBox(id, vals, ph, max, dis, kind) {
    return '<div class="chipbox' + (dis ? " dis" : "") + '" id="' + id + '" data-max="' + esc(max) + '" data-kind="' + (kind || "") + '">' +
      '<div class="chiplist">' + (vals || []).map(v => chipHtml(v, dis)).join("") + "</div>" +
      '<div class="field"><input class="chip-in" id="' + id + '_in" type="text" spellcheck="false" autocomplete="off" autocapitalize="none" placeholder="' + ph + '"' + (dis ? " disabled" : "") + ">" +
      '<button class="btn small" type="button" data-act="chipAdd" data-for="' + id + '"' + (dis ? " disabled" : "") + ">Add</button></div></div>";
  }
  function chipVals(id) {
    const box = $(id);
    return box ? [...box.querySelectorAll(".chip")].map(c => c.dataset.v) : [];
  }
  function chipChanged() { if (typeof updateHotlinkPreview === "function") updateHotlinkPreview(); }
  function chipAdd(id) {
    const box = $(id), inp = $(id + "_in");
    if (!box || !inp) return;
    const max = Number(box.dataset.max) || Infinity, list = box.querySelector(".chiplist");
    let have = chipVals(id).map(x => x.toLowerCase()), hitMax = false;
    inp.value.split(/[\s,]+/).filter(Boolean).forEach(raw => {
      const v = box.dataset.kind === "ext" ? raw.replace(/^\.+/, "").toLowerCase() : raw;
      if (!v || have.includes(v.toLowerCase())) return;
      if (have.length >= max) { hitMax = true; return; }
      have.push(v.toLowerCase());
      list.insertAdjacentHTML("beforeend", chipHtml(v, false));
    });
    inp.value = "";
    if (hitMax) say("pmsg", "err", "You can add up to " + max + " here.");
    chipChanged();
  }
  // add whatever is still typed in the box, then return every entry
  function chipGet(id) { chipAdd(id); return chipVals(id); }
  function chipClick(b) {
    if (b.dataset.act === "chipAdd") { chipAdd(b.dataset.for); const i = $(b.dataset.for + "_in"); if (i) i.focus(); }
    else { const c = b.closest(".chip"); if (c) { c.remove(); chipChanged(); } }
  }
  function chipWire(p) {
    p.addEventListener("keydown", e => {
      const t = e.target;
      if (!t.classList || !t.classList.contains("chip-in")) return;
      const box = t.closest(".chipbox");
      if (e.key === "Enter") { e.preventDefault(); chipAdd(box.id); }
      else if (e.key === "Backspace" && !t.value) { const last = box.querySelector(".chip:last-child"); if (last) { last.remove(); chipChanged(); } }
    });
    p.addEventListener("input", e => {
      const t = e.target;
      if (t.classList && t.classList.contains("chip-in") && /[\s,]/.test(t.value)) chipAdd(t.closest(".chipbox").id);
    });
  }

  function onClick(e) {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const id = b.id, act = b.dataset.act;
    if (act === "chipAdd" || act === "chipRm") return chipClick(b);
    if (id === "pvSave") savePrivate();
    else if (id === "mtSave") saveMaint();
    else if (id === "frSave") saveFrame();
    else if (id === "frReset") resetFrame();
    else if (id === "hsSave") saveHsts();
    else if (id === "hsReset") resetHsts();
    else if (id === "hlSave") saveHotlink();
    else if (id === "hlReset") resetHotlink();
    else if (id === "pvUndo" || id === "mtUndo" || id === "frUndo" || id === "hsUndo" || id === "hlUndo") render();
    else if (id === "alAdd") addIps("allow");
    else if (id === "blAdd") addIps("block");
    else if (id === "ckBtn") checkIp();
    else if (act === "rmAllow") removeIp("allow", b.dataset.ip);
    else if (act === "rmBlock") removeIp("block", b.dataset.ip);
  }
  function onChange(e) {
    if (!e.target.closest(".form")) return;
    if (e.target.id === "fr_mode") syncFrame();
    if (tab === "hotlink") updateHotlinkPreview();
  }
  function onInput(e) {
    if (!e.target.closest(".form")) return;
    if (tab === "hotlink") updateHotlinkPreview();
  }

  // ---------- shared: save through the /site routes
  async function siteCall(path, body, okText, btnId) {
    say("pmsg", "", "");
    const btn = btnId && $(btnId);
    if (btn) btn.disabled = true;
    try {
      const { res, data: d } = await appPost(path, body);
      if (commonErrors(res, d)) return false;
      if (!res.ok || !d.success) { say("pmsg", "err", d.error || "Couldn’t save the settings."); return false; }
      st.site = d.site; st.premium = d.premium;
      const w = (d.warnings || []).filter(x => !/paid plan/i.test(x));
      render(["ok", okText + (w.length ? " " + w.join(". ") + "." : "")]);
      return true;
    } catch (err) { console.error(err); say("pmsg", "err", netErr); return false; }
    finally { if (btn && btn.isConnected) btn.disabled = false; }
  }

  // ---------- IP lists
  function ipList(list, act, dis, empty) {
    if (!list.length) return '<div class="none">' + esc(empty) + "</div>";
    return '<div class="list">' + list.map((ip, i) =>
      '<div class="rule"><span class="n">' + (i + 1) + '</span><div class="m"><b>' + esc(ip) + "</b></div>" +
      '<div class="acts"><button class="btn danger" type="button" data-act="' + act + '" data-ip="' + esc(ip) + '"' + (dis ? " disabled" : "") + ">Remove</button></div></div>").join("") + "</div>";
  }
  async function addIps(kind) {
    const ips = chipGet(kind === "allow" ? "al_new" : "bl_new");
    if (!ips.length) return say("pmsg", "err", "Type at least one IP address or range.");
    await siteCall("/site/ips/update", kind === "allow" ? { allowAdd: ips } : { blockAdd: ips },
      ips.length === 1 ? "Address added." : ips.length + " addresses added.", kind === "allow" ? "alAdd" : "blAdd");
  }
  async function removeIp(kind, ip) {
    if (kind === "block" || !st.site.private || st.site.allowedIps.length > 1 ||
        await askConfirm("This is the only allowed address and your site is private. After removing it nobody can open the site.", { title: "Remove allowed address?", ok: "Remove", danger: true })) {
      await siteCall("/site/ips/update", kind === "allow" ? { allowRemove: [ip] } : { blockRemove: [ip] }, "Address removed.");
    }
  }
  async function checkIp() {
    const el = $("ck_ip");
    if (!el) return;
    const ip = el.value.trim();
    if (!ip) return say("ckmsg", "err", "Type an IP address to check.");
    say("ckmsg", "", "");
    $("ckBtn").disabled = true;
    try {
      const { res, data: d } = await appPost("/site/ips/check", { ip });
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("ckmsg", "err", d.error || "Couldn’t check that address.");
      say("ckmsg", d.blocked ? "err" : "ok", d.ip + ": " + d.result + (d.allowed ? " (on the allowed list)" : "") + ".");
    } catch (err) { console.error(err); say("ckmsg", "err", netErr); }
    finally { if ($("ckBtn")) $("ckBtn").disabled = false; }
  }
  const ipForm = (idPrefix, btnId, label, ph, dis) =>
    '<div class="form"><h3>' + esc(label) + '</h3><div><label class="label" for="' + idPrefix + '_new">IP addresses or ranges</label>' +
    chipBox(idPrefix + "_new", [], ph, st.siteLimits.maxIps, dis) +
    '<p class="hint">Type an address, then press Enter or tap Add. Repeat for more (or paste a list), then use the button below to save them all. IPv4 and IPv6 both work. Use a range like 203.0.113.0/24 to cover many addresses. Up to ' + esc(st.siteLimits.maxIps) + " in the list.</p></div>" +
    '<div class="row"><button class="btn" id="' + btnId + '" type="button"' + (dis ? " disabled" : "") + ">Save to list</button></div></div>";

  // ---------- Private mode
  function renderPrivate() {
    const s = st.site, dis = !st.premium;
    $("panel").innerHTML =
      head("Private mode", "Hide your website from everyone except the IP addresses you allow. Right now: " + onOff(s.private) + ".") + lockNote() +
      '<div class="form" style="margin-top:0">' + swRow("pv_on", "Make the website private", "Visitors whose address is not on the allowed list see an “Access denied” page.", s.private, dis) +
      '<div class="row"><button class="btn" id="pvSave" type="button"' + (dis ? " disabled" : "") + '>Save</button><button class="btn ghost" id="pvUndo" type="button">Undo changes</button></div></div>' +
      '<h3 class="sec">Allowed IP addresses</h3>' +
      '<p class="lead">These addresses can open your site while it is private. They also see the real site while maintenance mode is on.</p>' +
      ipList(s.allowedIps, "rmAllow", dis, "No address is allowed yet.") +
      ipForm("al", "alAdd", "Allow an address", "203.0.113.7 or 198.51.100.0/24", dis) + msgBox;
  }
  async function savePrivate() {
    const on = $("pv_on").checked;
    if (on && !st.site.allowedIps.length &&
        !await askConfirm("No address is on the allowed list, so nobody will be able to open the website. Add your own address first if you want to see it.", { title: "Make the website private?", ok: "Make private", danger: true })) return;
    await siteCall("/site/update", { private: on }, on ? "Your website is now private." : "Your website is public again.", "pvSave");
  }

  // ---------- IP blocking
  function renderIps() {
    const s = st.site, dis = !st.premium;
    $("panel").innerHTML =
      head("IP blocking", "Stop specific visitors from opening your website. Blocked addresses get an “Access denied” page, even if they are also on the allowed list.") + lockNote() +
      '<h3 class="sec" style="margin-top:0">Blocked IP addresses</h3>' +
      ipList(s.blockedIps, "rmBlock", dis, "No address is blocked.") +
      ipForm("bl", "blAdd", "Block an address", "192.0.2.15 or 2001:db8::/48", dis) +
      '<div class="form"><h3>Check an address</h3><div><label class="label" for="ck_ip">IP address</label>' +
      '<div class="field"><input id="ck_ip" type="text" inputmode="text" spellcheck="false" autocapitalize="none" placeholder="203.0.113.7"' + (dis ? " disabled" : "") + "></div>" +
      '<p class="hint">See what would happen to a visitor with this address, using your current rules.</p></div>' +
      '<div class="row"><button class="btn ghost" id="ckBtn" type="button"' + (dis ? " disabled" : "") + '>Check</button></div><p class="msg" id="ckmsg" hidden></p></div>' + msgBox;
  }

  // ---------- Maintenance
  function renderMaint() {
    const m = st.site.maintenance, dis = !st.premium, lim = st.siteLimits;
    $("panel").innerHTML =
      head("Maintenance mode", "Show a maintenance page while you work on your website. Right now: " + onOff(m.enabled) + ".") + lockNote() +
      '<div class="form" style="margin-top:0">' + swRow("mt_on", "Turn on maintenance mode", "Visitors get a 503 “Under maintenance” page. Addresses on the allowed list still see the real site.", m.enabled, dis) +
      '<div><label class="label" for="mt_page">Maintenance page (optional)</label><div class="field"><input id="mt_page" type="text" spellcheck="false" autocapitalize="none" placeholder="maintenance.html" value="' + esc(m.page || "") + '"' + (dis ? " disabled" : "") + "></div>" +
      '<p class="hint">A file from your app, for example maintenance.html. Leave empty to use the built-in page. The file must already exist.</p></div>' +
      '<div><label class="label" for="mt_retry">Ask search engines to come back after</label><div class="field num"><input id="mt_retry" type="number" min="0" max="' + esc(lim.maxRetryAfter) + '" step="1" value="' + esc(m.retryAfter) + '"' + (dis ? " disabled" : "") + '><span class="sfx">seconds</span></div>' +
      '<p class="hint">Sent as the Retry-After header. 3600 is one hour. Up to ' + esc(lim.maxRetryAfter) + ".</p></div>" +
      '<div class="row"><button class="btn" id="mtSave" type="button"' + (dis ? " disabled" : "") + '>Save</button><button class="btn ghost" id="mtUndo" type="button">Undo changes</button></div></div>' + msgBox;
  }
  async function saveMaint() {
    const n = $("mt_retry").value.trim() === "" ? NaN : Number(String($("mt_retry").value).trim());
    if (!Number.isInteger(n) || n < 0 || n > st.siteLimits.maxRetryAfter) return say("pmsg", "err", "Retry time must be a whole number of seconds from 0 to " + st.siteLimits.maxRetryAfter + ".");
    const on = $("mt_on").checked;
    await siteCall("/site/update", { maintenance: { enabled: on, page: $("mt_page").value.trim(), retryAfter: n } },
      on ? "Maintenance mode is on." : "Maintenance settings saved.", "mtSave");
  }

  // ---------- Iframe protection
  const FRAME_MODES = {
    off: "Allow everyone",
    deny: "Block everyone",
    self: "Only my own website",
    specific: "My website and sites I list"
  };
  const FRAME_HINT = {
    off: "Any website can show your pages inside an iframe. No frame headers are sent.",
    deny: "No website can show your pages in an iframe, not even your own.",
    self: "Only pages on your own address can show your pages in an iframe.",
    specific: "Your own address and the websites you list can show your pages in an iframe."
  };
  function renderFrame() {
    const c = st.frame;
    $("panel").innerHTML =
      head("Iframe protection", "Stop other websites from showing your pages inside an iframe (clickjacking). Only web pages are affected, not images or downloads. Right now: <b>" + esc(FRAME_MODES[c.mode] || c.mode) + "</b>.") +
      '<div class="form" style="margin-top:0">' +
      '<div><label class="label" for="fr_mode">Who can embed your pages</label><div class="field solo"><select class="sel" id="fr_mode">' +
        Object.keys(FRAME_MODES).map(k => opt(k, c.mode, FRAME_MODES[k])).join("") + '</select></div><p class="hint" id="fr_hint"></p></div>' +
      '<div id="fr_box"><label class="label" for="fr_list">Allowed websites</label>' +
        chipBox("fr_list", c.origins || [], "https://example.com", st.frameAllowed.maxOrigins) +
        '<p class="hint">Type a website, then press Enter or tap Add. Add as many as you need, then save. Use only the scheme, host and optional port, like https://example.com. Up to ' + esc(st.frameAllowed.maxOrigins) + ". Paths and * are not allowed.</p></div>" +
      '<div class="row"><button class="btn" id="frSave" type="button">Save iframe protection</button><button class="btn ghost" id="frUndo" type="button">Undo changes</button>' +
      '<button class="btn danger" id="frReset" type="button">Reset to default</button></div></div>' + msgBox;
    syncFrame();
  }
  function syncFrame() {
    const m = $("fr_mode").value;
    $("fr_hint").textContent = FRAME_HINT[m] || "";
    $("fr_box").hidden = m !== "specific";
  }
  const frameOrigins = () => chipGet("fr_list");
  async function saveFrame() {
    const mode = $("fr_mode").value, body = { mode };
    if (mode === "specific") {
      body.origins = frameOrigins();
      if (!body.origins.length) return say("pmsg", "err", "Add at least one website, or choose another option.");
    }
    say("pmsg", "", "");
    $("frSave").disabled = true;
    try {
      const { res, data: d } = await appPost("/frame/update", body);
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t save iframe protection.");
      st.frame = d.frame;
      render(["ok", "Iframe protection saved." + ((d.warnings || []).length ? " " + d.warnings.join(". ") + "." : "")]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("frSave")) $("frSave").disabled = false; }
  }
  async function resetFrame() {
    if (!await askConfirm("Iframe protection goes back to the default: any website can embed your pages.", { title: "Reset iframe protection?", ok: "Reset", danger: true })) return;
    say("pmsg", "", "");
    try {
      const { res, data: d } = await appPost("/frame/reset", {});
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t reset iframe protection.");
      st.frame = d.frame;
      render(["ok", "Iframe protection reset to the default."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
  }

  // ---------- HSTS
  const HSTS_PRESETS = [["1 day", 86400], ["1 week", 604800], ["1 month", 2592000], ["6 months", 15552000], ["1 year", 31536000], ["2 years", 63072000]];
  function renderHsts() {
    const c = st.hsts, lim = st.hstsLimits;
    $("panel").innerHTML =
      head("HSTS", "Tell browsers to only open your website over https. Right now: " + onOff(c.enabled) + ".") +
      '<div class="form" style="margin-top:0">' + swRow("hs_on", "Turn on HSTS", "Sent with your web pages on https. After a browser sees it, it refuses plain http for your site until the time below runs out.", c.enabled, false) +
      '<div><label class="label" for="hs_age">Remember for</label><div class="field num"><input id="hs_age" type="number" min="0" max="' + esc(lim.maxAge) + '" step="1" value="' + esc(c.maxAge) + '"><span class="sfx">seconds</span></div>' +
      '<p class="hint">Common values: ' + HSTS_PRESETS.map(p => esc(p[0]) + " = " + p[1]).join(", ") + ". Up to " + esc(lim.maxAge) + " (2 years).</p></div>" +
      '<div class="chks">' +
        '<label class="chk"><input type="checkbox" id="hs_sub"' + (c.includeSubDomains ? " checked" : "") + "><span>Include subdomains<small>Every subdomain of your domain must work on https too.</small></span></label>" +
        '<label class="chk"><input type="checkbox" id="hs_pre"' + (c.preload ? " checked" : "") + "><span>Preload<small>Needs include subdomains and at least " + esc(lim.preloadMinMaxAge) + " seconds (1 year). It only counts once you submit your own custom domain at hstspreload.org.</small></span></label>" +
      "</div>" +
      '<div class="row"><button class="btn" id="hsSave" type="button">Save HSTS</button><button class="btn ghost" id="hsUndo" type="button">Undo changes</button>' +
      '<button class="btn danger" id="hsReset" type="button">Reset to default</button></div></div>' + msgBox;
  }
  async function saveHsts() {
    const on = $("hs_on").checked, sub = $("hs_sub").checked, pre = $("hs_pre").checked, raw = $("hs_age").value.trim();
    const n = raw === "" ? NaN : Number(raw);
    if (!Number.isInteger(n) || n < 0 || n > st.hstsLimits.maxAge) return say("pmsg", "err", "Remember time must be a whole number of seconds from 0 to " + st.hstsLimits.maxAge + ".");
    if (pre && !sub) return say("pmsg", "err", "Preload needs “Include subdomains” to be on.");
    if (pre && n < st.hstsLimits.preloadMinMaxAge) return say("pmsg", "err", "Preload needs at least " + st.hstsLimits.preloadMinMaxAge + " seconds (1 year).");
    if (on && !st.hsts.enabled && !await askConfirm("Browsers will refuse plain http for this website for " + n + " seconds after they see the header. Make sure https works for every visitor first.", { title: "Turn on HSTS?", ok: "Turn on", danger: true })) return;
    say("pmsg", "", "");
    $("hsSave").disabled = true;
    try {
      const { res, data: d } = await appPost("/hsts/update", { enabled: on, maxAge: n, includeSubDomains: sub, preload: pre });
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t save HSTS.");
      st.hsts = d.hsts;
      render(["ok", "HSTS saved." + ((d.warnings || []).length ? " " + d.warnings.join(". ") + "." : "")]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("hsSave")) $("hsSave").disabled = false; }
  }
  async function resetHsts() {
    if (!await askConfirm("HSTS goes back to the default: off, and no header is sent. Browsers that already saw it keep the rule until it expires.", { title: "Reset HSTS?", ok: "Reset", danger: true })) return;
    say("pmsg", "", "");
    try {
      const { res, data: d } = await appPost("/hsts/reset", {});
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t reset HSTS.");
      st.hsts = d.hsts;
      render(["ok", "HSTS reset to the default."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
  }

  // ---------- Hotlink protection
  const HL_SCOPES = { media: "Images, video, audio and fonts", downloads: "Downloadable files (zip, pdf, apps…)", both: "Both" };
  const HL_ACTIONS = { block: "Show a 403 “not allowed” page", redirect: "Redirect to my home page" };
  function hotExts(scope, extra) {
    const a = st.hotlinkAllowed, list = scope === "media" ? a.mediaExtensions : scope === "downloads" ? a.downloadExtensions : a.mediaExtensions.concat(a.downloadExtensions);
    return [...new Set(list.concat(extra))];
  }
  function renderHotlink() {
    const c = st.hotlink, a = st.hotlinkAllowed;
    $("panel").innerHTML =
      head("Hotlink protection", "Stop other websites from embedding or linking straight to your images, videos and downloads, which uses your bandwidth. Right now: " + onOff(c.enabled) + ".") +
      '<div class="form" style="margin-top:0">' +
      swRow("hl_on", "Turn on hotlink protection", "Your own website and custom domain are always allowed. Web pages (HTML) are never blocked.", c.enabled, false) +
      '<div><label class="label" for="hl_scope">What to protect</label><div class="field solo"><select class="sel" id="hl_scope">' +
        Object.keys(HL_SCOPES).map(k => opt(k, c.scope, HL_SCOPES[k])).join("") + "</select></div></div>" +
      '<div><label class="label" for="hl_hosts">Other websites that may use your files</label>' +
        chipBox("hl_hosts", c.allowedHosts || [], "example.com or *.example.com", a.maxHosts) +
        '<p class="hint">Type a host, then press Enter or tap Add. Use a host like example.com, or *.example.com to include every subdomain. Up to ' + esc(a.maxHosts) + ".</p></div>" +
      '<div><label class="label" for="hl_ext">Extra file types to protect (optional)</label>' +
        chipBox("hl_ext", c.extraExts || [], "mp3", a.maxExtraExts, false, "ext") +
        '<p class="hint">Type an extension without the dot, then press Enter or tap Add. Up to ' + esc(a.maxExtraExts) + ".</p></div>" +
      '<div class="chks"><label class="chk"><input type="checkbox" id="hl_empty"' + (c.allowEmpty ? " checked" : "") + "><span>Allow requests with no Referer<small>Direct visits, bookmarks and some apps send none. Turn off for strict mode, but direct downloads may fail.</small></span></label></div>" +
      '<div><label class="label" for="hl_action">When a file is hotlinked</label><div class="field solo"><select class="sel" id="hl_action">' +
        Object.keys(HL_ACTIONS).map(k => opt(k, c.action, HL_ACTIONS[k])).join("") + "</select></div></div>" +
      '<div><span class="label">File types protected</span><div class="pills" id="hl_prev"></div></div>' +
      '<div class="row"><button class="btn" id="hlSave" type="button">Save hotlink protection</button><button class="btn ghost" id="hlUndo" type="button">Undo changes</button>' +
      '<button class="btn danger" id="hlReset" type="button">Reset to default</button></div></div>' + msgBox;
    updateHotlinkPreview();
  }
  const hotExtra = () => chipVals("hl_ext");
  function updateHotlinkPreview() {
    const el = $("hl_prev");
    if (el) el.innerHTML = hotExts($("hl_scope").value, hotExtra()).map(x => '<span class="pill">.' + esc(x) + "</span>").join("");
  }
  async function saveHotlink() {
    const body = {
      enabled: $("hl_on").checked, scope: $("hl_scope").value, action: $("hl_action").value, allowEmpty: $("hl_empty").checked,
      allowedHosts: chipGet("hl_hosts"), extraExts: chipGet("hl_ext")
    };
    say("pmsg", "", "");
    $("hlSave").disabled = true;
    try {
      const { res, data: d } = await appPost("/hotlink/update", body);
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t save hotlink protection.");
      st.hotlink = d.hotlink;
      render(["ok", "Hotlink protection saved." + ((d.warnings || []).length ? " " + d.warnings.join(". ") + "." : "")]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("hlSave")) $("hlSave").disabled = false; }
  }
  async function resetHotlink() {
    if (!await askConfirm("Hotlink protection is turned off and your host list is cleared.", { title: "Reset hotlink protection?", ok: "Reset", danger: true })) return;
    say("pmsg", "", "");
    try {
      const { res, data: d } = await appPost("/hotlink/reset", {});
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t reset hotlink protection.");
      st.hotlink = d.hotlink;
      render(["ok", "Hotlink protection reset to the default."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
  }

  // ---------- loading
  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }
  async function loadAll(pw) {
    const { res, data: d } = await post("/site/get", { appId: APP_ID, appPassword: pw });
    if (res.status === 401 && /app password/i.test(d.error || "")) { forgetAppPw(); return showPasswordGate("That app password is wrong. Enter the right one."); }
    if (res.status === 401) { location.replace("signup.html"); return; }
    if (!res.ok || !d.success) {
      if ($("pwMsg")) return say("pwMsg", "err", d.error || "Couldn’t load the security settings.");
      return message("Couldn’t load the security settings", d.error || "Try again.", "Try again", location.pathname + location.search);
    }
    saveAppPw(pw);
    const [h, f, hs] = await Promise.all([appPost("/hotlink/get", {}), appPost("/frame/get", {}), appPost("/hsts/get", {})]);
    for (const r of [h, f, hs]) {
      if (r.res.status === 401) { location.replace("signup.html"); return; }
      if (!r.res.ok || !r.data.success) return message("Couldn’t load the security settings", r.data.error || "Try again.", "Try again", location.pathname + location.search);
    }
    st = { site: d.site, premium: d.premium, siteLimits: d.allowed, hotlink: h.data.hotlink, hotlinkAllowed: h.data.allowed, frame: f.data.frame, frameAllowed: f.data.allowed, hsts: hs.data.hsts, hstsLimits: hs.data.limits };
    build();
  }
  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="layout"><div class="sk"></div></div>';
    try {
      const { res, data: d } = await post("/apps/list", {});
      if (res.status === 401) return message("Please sign up again", "We couldn’t verify your account on this device.", "Sign up", "signup.html");
      if (!res.ok || !d.success) throw new Error(d.error || "Request failed");
      app = (d.apps || []).find(a => a.id === APP_ID);
      if (!app) return message("App not found", "This app doesn’t exist or isn’t yours.", "Back to dashboard", "dashboard.html");
      renderHeader();
      const pw = storedAppPw();
      if (pw) await loadAll(pw); else showPasswordGate();
    } catch (err) {
      console.error(err);
      message("Couldn’t load your app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }
  load();
</script>
</body>
</html>
