<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview – Fast Site</title>
<meta name="description" content="Traffic overview of your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">

<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f4f4f5;--line:#e4e4e7;--text:#09090b;--muted:#52525b;--accent:#0e7490;--accent-ink:#fff;--glow:#dff3f7;--danger:#b91c1c;--ok:#16a34a;--chart:#2563eb}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80;--chart:#4aa3ff}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;transition:background .2s,color .2s}
  main{flex:1;padding:36px 20px 72px;background:radial-gradient(55% 32% at 50% 0%,var(--glow),transparent 75%)}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  .wrap{max-width:1120px;margin:0 auto}

  .top{margin-bottom:22px}
  h1{font-size:32px;letter-spacing:-.03em;line-height:1.15;margin:0 0 6px}
  .sub{margin:0 0 14px;color:var(--muted);font-size:15px}
  .sub b{color:var(--text)}
  .site{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
  .site a{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:15px;text-decoration:none;transition:border-color .15s,transform .15s}
  .site a:hover{border-color:var(--accent);transform:translateY(-1px)}
  .site a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site a svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.plan{background:var(--glow);border-color:transparent;color:var(--accent)}
  .pill.warn{color:var(--danger)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin-bottom:20px}
  .card{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:18px 20px 16px;min-width:0}
  .grid.three{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card.wide{grid-column:1/-1}
  .card h2{margin:0;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
  .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:2px 0 10px}
  .big b{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:600}
  .delta.up{color:var(--ok)}
  .delta.down{color:var(--danger)}
  .delta small{color:var(--muted);font-weight:500;font-size:12px;margin-left:2px}
  .note{margin:6px 0 0;font-size:12px;color:var(--muted)}

  .plot{position:relative;height:170px;margin-top:6px}
  .plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .plot .area{fill:color-mix(in srgb,var(--chart) 14%,transparent)}
  .plot .line{fill:none;stroke:var(--chart);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
  .plot .base{stroke:var(--chart);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
  .guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none;opacity:0}
  .dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--chart);border:2px solid var(--surface);pointer-events:none;opacity:0}
  .plot.hov .guide,.plot.hov .dot{opacity:1}
  .nodata{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--text)}
  .xl{display:flex;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .tip{position:fixed;z-index:80;pointer-events:none;padding:6px 10px;border-radius:10px;background:var(--text);color:var(--bg);font-size:12.5px;line-height:1.4;opacity:0;transform:translate(-50%,-120%);transition:opacity .1s;white-space:nowrap}
  .tip.on{opacity:1}

  .mini .big{margin:6px 0 0}
  .mini .big b{font-size:28px}

  .rank{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
  .rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14px;position:relative;padding:2px 0}
  .rank .n{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--muted)}
  .rank .nm{min-width:0}
  .rank .nm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .rank .bar{height:5px;border-radius:99px;background:var(--soft);margin-top:4px;overflow:hidden}
  .rank .bar i{display:block;height:100%;border-radius:99px;background:var(--chart)}
  .rank .v{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
  .rank .v small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
  .rank li.hl .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .mapbox{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start;margin-top:8px}
  .map{position:relative;border-radius:14px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
  .map svg{display:block;width:100%;height:auto}
  .map path{fill:var(--line);stroke:var(--surface);stroke-width:.5;transition:fill .15s}
  .map path.hit{fill:var(--accent);cursor:pointer}
  .map path.hit.hl{stroke:var(--text);stroke-width:1.4}
  .map circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;cursor:pointer}
  .map circle.hl{stroke:var(--text);stroke-width:2}
  .legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend i{display:block;width:90px;height:8px;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 25%,var(--line)),var(--accent))}

  .lock{display:flex;align-items:center;gap:16px;border:1px dashed var(--line);border-radius:18px;background:var(--soft);padding:20px 22px}
  .lock svg{width:34px;height:34px;flex-shrink:0;color:var(--accent)}
  .lock h2{margin:0 0 2px;font-size:17px;color:var(--text);font-weight:600}
  .lock p{margin:0;font-size:14px;color:var(--muted)}

  .sk{border:1px solid var(--line);border-radius:18px;height:290px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:22px;background:var(--soft);padding:56px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .empty p{margin:0 0 20px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media(max-width:860px){.mapbox{grid-template-columns:1fr}}
  @media(max-width:560px){h1{font-size:27px}.grid{grid-template-columns:1fr}.lock{flex-direction:column;align-items:flex-start}}
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>

</main>

<div id="footer"></div>

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const nf = new Intl.NumberFormat();
  const compact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
  const num = n => n >= 100000 ? compact.format(n) : nf.format(n);

  fetch("../assets/panel-essentials.html").then(r => r.text()).then(html => {
    const box = $("panelEssentials");
    box.innerHTML = html;
    box.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }).catch(e => console.error("Could not load panel-essentials.html", e));
  fetch("../assets/footer-panel.html").then(r => r.ok ? r.text() : "").then(h => { $("footer").innerHTML = h; }).catch(() => {});

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }

  const tip = $("tip");
  function showTip(html, x, y) { tip.innerHTML = html; tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on"); }
  function hideTip() { tip.classList.remove("on"); }

  const dayDate = key => new Date(key + "T00:00:00Z");
  const dayShort = key => dayDate(key).toLocaleDateString(undefined, { weekday: "short", timeZone: "UTC" });
  const dayLong = key => dayDate(key).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  const hourShort = iso => new Date(iso).toLocaleTimeString(undefined, { hour: "numeric" });
  const hourLong = iso => new Date(iso).toLocaleString(undefined, { weekday: "short", hour: "numeric" });

  let regionNames = null;
  try { regionNames = new Intl.DisplayNames(undefined, { type: "region" }); } catch (e) {}
  const countryName = cc => { try { return (regionNames && regionNames.of(cc)) || cc; } catch (e) { return cc; } };
  const CONTINENTS = { AF: "Africa", AN: "Antarctica", AS: "Asia", EU: "Europe", NA: "North America", OC: "Oceania", SA: "South America" };

  function delta(today, yesterday) {
    if (!today && !yesterday) return "";
    if (!yesterday) return '<span class="delta up">&#8599; +' + num(today) + '<small>vs yesterday</small></span>';
    const pct = (today - yesterday) / yesterday * 100;
    if (pct === 0) return '<span class="delta"><small>same as yesterday</small></span>';
    const up = pct > 0;
    return '<span class="delta ' + (up ? "up" : "down") + '">' + (up ? "&#8599;" : "&#8600;") + " " +
      Math.abs(pct).toFixed(1) + '%<small>vs yesterday</small></span>';
  }

  const charts = {};
  function chart(id, points, xLabels) {

    const n = points.length, W = 600, H = 160;
    const max = Math.max(1, ...points.map(p => p.v));
    const xs = i => n === 1 ? W / 2 : i / (n - 1) * W;
    const ys = v => H - 3 - v / max * (H - 18);
    const line = points.map((p, i) => (i ? "L" : "M") + xs(i).toFixed(1) + "," + ys(p.v).toFixed(1)).join("");
    const empty = points.every(p => !p.v);
    charts[id] = { points, n, W, H, max, xs, ys };
    return '<div class="plot" data-chart="' + id + '">' +
      '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path class="area" d="' + line + "L" + W + "," + H + "L0," + H + 'Z"/>' +
      '<path class="line" d="' + line + '"/></svg>' +
      '<div class="guide"></div><div class="dot"></div>' +
      (empty ? '<span class="nodata">No data</span>' : "") + "</div>" +
      '<div class="xl">' + xLabels.map(l => "<span>" + esc(l) + "</span>").join("") + "</div>";
  }

  function bindCharts(root) {
    root.querySelectorAll(".plot").forEach(plot => {
      const c = charts[plot.dataset.chart];
      if (!c) return;
      const guide = plot.querySelector(".guide"), dot = plot.querySelector(".dot");
      const move = e => {
        const r = plot.getBoundingClientRect();
        const i = c.n === 1 ? 0 : Math.max(0, Math.min(c.n - 1, Math.round((e.clientX - r.left) / r.width * (c.n - 1))));
        const x = c.xs(i) / c.W * 100, y = c.ys(c.points[i].v) / c.H * 100;
        guide.style.left = x + "%"; dot.style.left = x + "%"; dot.style.top = y + "%";
        plot.classList.add("hov");
        showTip(c.points[i].tip, r.left + x / 100 * r.width, r.top + y / 100 * r.height);
      };
      plot.addEventListener("pointermove", move);
      plot.addEventListener("pointerdown", move);
      plot.addEventListener("pointerleave", () => { plot.classList.remove("hov"); hideTip(); });
    });
  }

  const card = (title, inner, cls) => '<section class="card' + (cls ? " " + cls : "") + '"><h2>' + esc(title) + "</h2>" + inner + "</section>";

  function statCard(title, value, extra) {
    return '<section class="card mini"><h2>' + esc(title) + '</h2><div class="big"><b>' + num(value) + "</b></div>" + (extra ? '<p class="note">' + esc(extra) + "</p>" : "") + "</section>";
  }

  function rankList(items, labelFn, subFn) {
    if (!items.length) return '<p class="note">No data yet.</p>';
    const top = Math.max(1, ...items.map(i => i.views));
    return '<ol class="rank">' + items.map((it, i) =>
      '<li data-i="' + i + '"><span class="n">' + (i + 1) + '</span><div class="nm"><span>' + esc(labelFn(it)) + "</span>" +
      '<div class="bar"><i style="width:' + Math.max(3, it.views / top * 100).toFixed(1) + '%"></i></div></div>' +
      '<span class="v">' + num(it.views) + (subFn ? "<small>" + esc(subFn(it)) + "</small>" : "") + "</span></li>").join("") + "</ol>";
  }

  function mapCard(d) {
    const list = d.countries, total = d.withCountry || 1;
    const top = Math.max(1, ...list.map(c => c.views));
    const byCode = {}; list.forEach(c => { byCode[c.code] = c; });

    const R = Math.PI / 180;
    const project = (lat, lon) => {
      const l = lon * R, p = lat * R, p2 = p * p, p4 = p2 * p2;
      const x = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
      const y = p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
      return [MAP.t[0] + x * MAP.s, MAP.t[1] - y * MAP.s];
    };
    const shade = c => (0.3 + 0.7 * c.views / top).toFixed(2);

    let svg = '<svg viewBox="0 0 ' + MAP.w + " " + MAP.h + '" role="img" aria-label="World map of the top 10 countries by traffic">';
    for (const cc in MAP.paths) {
      const c = byCode[cc];
      svg += '<path d="' + MAP.paths[cc] + '"' + (c ? ' class="hit" data-cc="' + cc + '" style="fill-opacity:' + shade(c) + '"' : "") + "/>";
    }

    list.forEach(c => {
      if (MAP.paths[c.code] || c.lat === null || c.lon === null) return;
      const [x, y] = project(c.lat, c.lon);
      svg += '<circle class="hit" data-cc="' + c.code + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="6"/>';
    });
    svg += "</svg>";

    const rows = rankList(list, c => countryName(c.code), c => (c.views / total * 100).toFixed(1) + "%");
    return '<section class="card wide"><h2>Top 10 countries by traffic</h2>' +
      (list.length
        ? '<div class="mapbox"><div><div class="map" id="map">' + svg + '</div><div class="legend">Fewer<i></i>More views</div></div><div id="countryList">' + rows + "</div></div>"
        : '<p class="note">No visits with a country yet. They show up here as people open your site.</p>') +
      '<p class="note">' + (d.countriesTotal > 10 ? d.countriesTotal + " countries in the last 7 days. " : "") + "Based on your latest " + nf.format(d.sampleSize) + " visits.</p></section>";
  }

  function bindMap() {
    const map = $("map"), listEl = $("countryList");
    if (!map || !listEl) return;
    const list = window.__countries || [], items = [...listEl.querySelectorAll("li")];
    let cur = null;
    const setHl = cc => {
      if (cc === cur) return;
      cur = cc;
      map.querySelectorAll(".hl").forEach(e => e.classList.remove("hl"));
      items.forEach(li => li.classList.remove("hl"));
      if (!cc) return;
      map.querySelectorAll('[data-cc="' + cc + '"]').forEach(e => e.classList.add("hl"));
      items.forEach((li, i) => { if (list[i] && list[i].code === cc) li.classList.add("hl"); });
    };
    items.forEach((li, i) => {
      li.addEventListener("pointerenter", () => setHl(list[i].code));
      li.addEventListener("pointerleave", () => setHl(null));
    });
    map.addEventListener("pointermove", e => {
      const el = e.target.closest("[data-cc]");
      const c = el && list.find(x => x.code === el.dataset.cc);
      if (!c) { hideTip(); setHl(null); return; }
      showTip("<b>" + esc(countryName(c.code)) + "</b><br>" + nf.format(c.views) + " views", e.clientX, e.clientY);
      setHl(c.code);
    });
    map.addEventListener("pointerleave", () => { hideTip(); setHl(null); });
  }

  function renderHeader(a) {
    document.title = a.name + " – Overview – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(a.name) + "</b>";

    const host = a.customDomain || (a.name.toLowerCase() + "." + APP_DOMAIN);
    $("site").innerHTML =
      '<a href="https://' + esc(host) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(host) + ' in a new tab">' +
      '<i class="live"></i><span>' + esc(host) + '</span>' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3zM5 5h6v2H5v12h12v-6h2v8H3V5z"/></svg></a>' +
      '<span class="pill plan">' + esc((a.plan || "Free") + " plan") + "</span>" +
      (a.customDomain && a.customDomainVerified === false ? '<span class="pill warn">DNS not verified yet</span>' : "");
  }

  function render(data) {
    const a = data.app, days = data.days, last = days[days.length - 1], prev = days[days.length - 2] || { views: 0, unique: 0 };
    renderHeader(a);

    const sumViews = days.reduce((s, d) => s + d.views, 0);
    const sumUnique = days.reduce((s, d) => s + d.unique, 0);
    const dayLabels = days.map(d => dayShort(d.date));
    const viewPts = days.map(d => ({ v: d.views, tip: "<b>" + esc(dayLong(d.date)) + "</b><br>" + nf.format(d.views) + " views" }));
    const uniqPts = days.map(d => ({ v: d.unique, tip: "<b>" + esc(dayLong(d.date)) + "</b><br>" + nf.format(d.unique) + " visitors" }));
    const best = days.reduce((b, d) => d.views > b.views ? d : b, days[0]);

    let html = '<div class="grid">' +
      card("Page views", '<div class="big"><b>' + num(sumViews) + "</b>" + delta(last.views, prev.views) + "</div>" + chart("views", viewPts, dayLabels)) +
      card("Unique visitors", '<div class="big"><b>' + num(sumUnique) + "</b>" + delta(last.unique, prev.unique) + "</div>" + chart("unique", uniqPts, dayLabels)) +
      "</div>" +
      '<div class="grid three">' +
      statCard("All-time page views", data.totals.views) +
      statCard("All-time visitors", data.totals.unique) +
      statCard("Best day (last 7 days)", best.views, best.views ? dayLong(best.date) : "No visits yet") +
      "</div>";

    if (data.premium && data.detail) {
      const d = data.detail;
      window.__countries = d.countries;
      const hrs = d.hours;
      const hourPts = hrs.map(h => ({ v: h.views, tip: "<b>" + esc(hourLong(h.time)) + "</b><br>" + nf.format(h.views) + " views" }));
      const hourLabels = [0, 6, 12, 18, 23].map(i => hourShort(hrs[i].time));
      const hourTotal = hrs.reduce((s, h) => s + h.views, 0);

      html += '<div class="grid">' +
        card("Page views, last 24 hours", '<div class="big"><b>' + num(hourTotal) + "</b></div>" + chart("hours", hourPts, hourLabels), "wide") +
        "</div>" +
        '<div class="grid">' + mapCard(d) + "</div>" +
        '<div class="grid">' +
        card("Top pages", rankList(d.pages, p => p.path)) +
        card("Top cities", rankList(d.cities, c => c.city + (c.country ? ", " + countryName(c.country) : ""))) +
        card("Continents", rankList(d.continents, c => CONTINENTS[c.name] || c.name)) +
        "</div>";
    } else {
      html += '<div class="lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm4 10.7V18h-2v-1.3a2 2 0 1 1 2 0z"/></svg>' +
        "<div><h2>More insights on paid plans</h2><p>Hourly traffic, the top 10 countries on a world map, top pages, cities and continents are available on Basic, Standard, Pro and Enterprise.</p></div></div>";
    }
    html += '<p class="note" style="margin-top:18px">Days are counted in UTC. Only page views are counted, not images, CSS or scripts.</p>';

    $("content").innerHTML = html;
    bindCharts($("content"));
    bindMap();
  }

  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }

  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="grid"><div class="sk"></div><div class="sk"></div></div>';
    try {
      const res = await fetch(API_BASE + "/apps/stats", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p, appId: APP_ID })
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (res.status === 401) return message("Please sign up again", "We couldn't verify your account on this device.", "Sign up", "signup.html");
      if (res.status === 404) return message("App not found", "This app doesn't exist or isn't yours.", "Back to dashboard", "dashboard.html");
      if (!res.ok || !data.success) throw new Error(data.error || "Request failed");
      render(data);
    } catch (err) {
      console.error(err);
      message("Couldn't load your stats", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }

  load();
</script>
</body>
</html>
