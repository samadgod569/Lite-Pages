<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database – Fast Site</title>
<meta name="description" content="Create and manage the MySQL database of your Fast Site app: storage, connection details and password.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e4e4e7;--text:#09090b;--muted:#5b5b66;--accent:#0e7490;--accent-ink:#fff;--danger:#b91c1c;--ok:#16a34a;--warn:#b45309}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--danger:#f87171;--ok:#4ade80;--warn:#fbbf24}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
  main{flex:1;padding:32px 20px 64px}
  [hidden]{display:none!important}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px}
  .sub b{color:var(--text)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  .nav{position:static;display:flex;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nv{text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .nv:hover{background:var(--soft);color:var(--text)}
  .nv.on{background:var(--soft);color:var(--text);font-weight:600;border-color:var(--accent)}
  .panel{min-width:0}
  .panel h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
  .lead{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .lead b{color:var(--text)}

  .list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .st{padding:14px 18px}
  .st+.st{border-top:1px solid var(--line)}
  .hd{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;align-items:center}
  .tx{flex:1 1 160px;min-width:0}
  .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .d{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .rt{display:flex;align-items:center;gap:10px;min-width:0;max-width:100%}
  .code{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 9px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--text);word-break:break-all;min-width:0}

  .label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.warn{color:var(--danger)}
  .pill.ok{color:var(--ok)}
  .hint{margin:7px 0 0;font-size:12.5px;color:var(--muted)}

  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;max-width:380px}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field.num{max-width:260px}
  .field input{flex:1;min-width:0;padding:9px 12px;border:0;outline:0;background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif}
  .field input::placeholder{color:var(--muted);opacity:.7}
  .field input:disabled{opacity:.5;cursor:not-allowed}
  .field.num input{text-align:center}
  .sfx{display:flex;align-items:center;padding:0 12px;background:var(--soft);border-left:1px solid var(--line);color:var(--muted);font-size:14px;white-space:nowrap}
  .stp{width:40px;border:0;background:var(--soft);color:var(--text);font:600 18px Inter,sans-serif;cursor:pointer;line-height:1}
  .stp:first-child{border-right:1px solid var(--line)}
  .stp:nth-of-type(2){border-left:1px solid var(--line)}
  .stp:hover{background:var(--line)}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}

  .msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--soft)}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .msg.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));color:var(--warn)}
  .msg.info{color:var(--muted)}
  .msg b{color:var(--text)}
  .msg .code{margin:0 6px}

  .form{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .form>*+*{margin-top:14px}
  .form>.row{margin-top:18px}
  .form h3{margin:0;font-size:15px}
  .none{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
  .prev{margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;white-space:normal}
  h3.sec{margin:24px 0 8px;font-size:15px}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:14px}
  .stat{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
  .stat span{font-size:12.5px;font-weight:500;color:var(--muted)}
  .bar{height:10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
  .bar.mid>i{background:var(--warn)}
  .bar.hot>i{background:var(--danger)}
  .barcap{display:flex;justify-content:space-between;gap:10px;margin:6px 0 0;font-size:12.5px;color:var(--muted)}

  .sk{border:1px solid var(--line);border-radius:12px;height:240px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:48px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:21px}
  .empty p{margin:0 0 20px;color:var(--muted)}
  .gate{max-width:480px}
  .narrow{max-width:560px}

  .mdl{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,#000 55%,transparent);animation:ddFade .12s ease-out}
  .mdl-box{width:100%;max-width:400px;padding:20px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:ddIn .14s ease-out}
  .mdl-box h3{margin:0 0 6px;font-size:17px}
  .mdl-box p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line}
  .mdl-box .row{justify-content:flex-end;margin-top:20px}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px)}}
  @keyframes ddFade{from{opacity:0}}

  @media(max-width:820px){main{padding:24px 16px 48px}}
  @media(max-width:560px){
    h1{font-size:23px}
    .st{padding:12px 14px}
    .field,.field.num{max-width:none}
    .form{padding:14px}
    .rt{width:100%;justify-content:space-between}
  }
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header>
      <h1>Database</h1>
      <p class="sub" id="sub">&nbsp;</p>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>

<script>
  /* ui-kit: confirm dialog. await askConfirm("text", { title, ok, danger }) */
  (function () {
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    window.askConfirm = function (text, o) {
      o = o || {};
      return new Promise(res => {
        const prev = document.activeElement;
        const m = document.createElement("div"); m.className = "mdl";
        m.innerHTML = '<div class="mdl-box" role="alertdialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">' + esc(o.title || "Are you sure?") + "</h3><p>" + esc(text) + "</p>" +
          '<div class="row"><button class="btn ghost" type="button" data-r="0">Cancel</button><button class="btn' + (o.danger ? " danger solid" : "") + '" type="button" data-r="1">' + esc(o.ok || "Confirm") + "</button></div></div>";
        const done = v => { document.removeEventListener("keydown", key, true); m.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); res(v); };
        const key = e => {
          if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
          else if (e.key === "Tab") {
            const b = m.querySelectorAll("button"); e.preventDefault();
            (document.activeElement === b[0] ? b[1] : b[0]).focus();
          }
        };
        m.addEventListener("click", e => { const b = e.target.closest("button"); if (b) done(b.dataset.r === "1"); else if (e.target === m) done(false); });
        document.addEventListener("keydown", key, true);
        document.body.appendChild(m);
        m.querySelector('[data-r="1"]').focus();
      });
    };
  })();
</script>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  // storage included in each plan (display only, the server enforces the real limits)
  const PLAN_MB = { basic: 256, standard: 512, pro: 768, enterprise: 1024 };
  let app = null, st = null, credits = 0, tab = "overview";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lc = s => String(s).toLowerCase();

  function inject(id, url) {
    fetch(url).then(r => r.ok ? r.text() : "").then(html => {
      const box = $(id);
      box.innerHTML = html;
      box.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    }).catch(e => console.error("Could not load " + url, e));
  }
  inject("panelEssentials", "../assets/panel-essentials.html");
  inject("footer", "../assets/footer-panel.html");

  // ---------- credentials / api
  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  const storedAppPw = () => { try { return localStorage.getItem("lp-app-password:" + APP_ID) || ""; } catch (e) { return ""; } };
  const saveAppPw = pw => { try { localStorage.setItem("lp-app-password:" + APP_ID, pw); } catch (e) {} };
  const forgetAppPw = () => { try { localStorage.removeItem("lp-app-password:" + APP_ID); } catch (e) {} };
  const appPassword = () => storedAppPw() || ($("apw") ? $("apw").value : "");

  async function post(path, extra) {
    const { u, p } = creds();
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p }, extra))
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { res, data };
  }
  const appPost = (path, extra) => post(path, Object.assign({ appId: APP_ID, appPassword: appPassword() }, extra));

  function say(id, kind, text) {
    const el = $(id);
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }
  function commonErrors(res, data) {
    if (res.status === 401 && /app password/i.test(data.error || "")) {
      forgetAppPw(); st = null;
      showPasswordGate("That app password is wrong. Enter the right one.");
      return true;
    }
    if (res.status === 401) { location.replace("signup.html"); return true; }
    return false;
  }
  const netErr = "Network error. Check your connection and try again.";

  // ---------- helpers
  const TABS = [["overview", "Overview"], ["storage", "Storage"], ["password", "Password"], ["delete", "Delete"]];
  const head = (t, l) => "<h2>" + esc(t) + '</h2><p class="lead">' + l + "</p>";
  function fmtMb(n) {
    if (n === null || n === undefined || isNaN(Number(n))) return "—";
    n = Number(n);
    if (n >= 1024) return (Math.round(n / 1024 * 100) / 100) + " GB";
    return (n < 10 ? Math.round(n * 10) / 10 : Math.round(n)) + " MB";
  }
  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (_) {}
      t.remove();
    }
    const old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(() => { if (btn.isConnected) btn.textContent = old; }, 1400);
  }

  // ---------- header + password gate
  function renderHeader() {
    document.title = app.name + " – Database – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(app.name) + "</b> · <b>" + esc(app.plan) + "</b> plan" +
      (app.plan !== "Free" ? " · <b>" + esc(credits) + "</b> credits" : "");
  }
  function showPasswordGate(errText) {
    $("content").innerHTML =
      '<div class="gate"><h2 style="margin:0 0 2px;font-size:19px">App password</h2>' +
      '<p class="lead">Database settings need your app password. It was shown once when you created the app.</p>' +
      '<div class="field"><input id="apw" type="password" autocomplete="current-password" placeholder="App password"></div>' +
      '<div class="row"><button class="btn" id="pwBtn" type="button">Continue</button></div>' +
      '<p class="msg" id="pwMsg" hidden></p></div>';
    $("pwBtn").addEventListener("click", unlock);
    $("apw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    $("apw").focus();
    if (errText) say("pwMsg", "err", errText);
  }
  async function unlock() {
    const pw = $("apw").value;
    if (!pw) return say("pwMsg", "err", "Enter your app password.");
    $("pwBtn").disabled = true;
    try { await loadDb(pw); } finally { if ($("pwBtn")) $("pwBtn").disabled = false; }
  }

  // ---------- free plan
  function renderFree() {
    $("content").innerHTML =
      '<div class="empty"><h2>Databases are on paid plans</h2><p>Every paid plan includes MySQL storage, and you can buy more later. Upgrade this app to create a database.</p>' +
      '<a class="btn" href="dashboard.html">Back to dashboard</a></div>' +
      '<h3 class="sec">Storage included</h3><div class="list">' +
      Object.keys(PLAN_MB).map(k => '<div class="st"><div class="hd"><div class="tx"><div class="t">' + esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</div></div><div class="rt"><span class="code">' + esc(fmtMb(PLAN_MB[k])) + "</span></div></div></div>").join("") +
      "</div>";
  }

  // ---------- create form (the app has no database yet)
  function showCreate(msg) {
    st = { none: true };
    const mb = PLAN_MB[lc(app.plan)];
    $("content").innerHTML = '<div class="layout"><section class="panel narrow">' +
      head("Create a database", "Your <b>" + esc(app.plan) + "</b> plan includes <b>" + esc(fmtMb(mb)) + "</b> of MySQL storage. You can buy more storage later with credits.") +
      '<div class="form" style="margin-top:0">' +
      '<div><label class="label" for="cr_name">Database name</label><div class="field"><input id="cr_name" type="text" spellcheck="false" autocomplete="off" autocapitalize="none" maxlength="64" placeholder="my_database"></div>' +
        '<p class="hint">Start with a letter or underscore. Use only letters, numbers and underscores, up to 64 characters.</p></div>' +
      '<div><label class="label" for="cr_pw">Database password (optional)</label><div class="field"><input id="cr_pw" type="password" autocomplete="new-password" maxlength="128" placeholder="Leave empty to generate one"></div>' +
        '<p class="hint">8 to 128 characters. If you leave it empty we generate a strong password and show it once.</p></div>' +
      '<div class="row"><button class="btn" id="crBtn" type="button">Create database</button></div></div>' +
      '<p class="msg" id="crMsg" hidden></p></section></div>';
    $("crBtn").addEventListener("click", createDb);
    ["cr_name", "cr_pw"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") createDb(); }));
    $("cr_name").focus();
    if (msg) say("crMsg", msg[0], msg[1]);
  }
  async function createDb() {
    const name = $("cr_name").value.trim().toLowerCase(), pw = $("cr_pw").value;
    if (!/^[a-z_][a-z0-9_]{0,63}$/.test(name)) return say("crMsg", "err", "The name must start with a letter or underscore and use only letters, numbers and underscores (up to 64).");
    if (pw && (pw.length < 8 || pw.length > 128)) return say("crMsg", "err", "The password must be 8 to 128 characters.");
    say("crMsg", "", "");
    $("crBtn").disabled = true;
    try {
      const { res, data: d } = await appPost("/mysql/create", { dbName: name, dbPassword: pw || undefined });
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("crMsg", "err", d.error || "Couldn’t create the database.");
      st = Object.assign({}, d, { newPw: d.dbPassword || null });
      tab = "overview";
      build();
    } catch (err) { console.error(err); say("crMsg", "err", netErr); }
    finally { if ($("crBtn")) $("crBtn").disabled = false; }
  }

  // ---------- page skeleton: tab nav + one panel at a time
  function build() {
    $("content").innerHTML = '<div class="layout"><nav class="nav" id="nav" aria-label="Database sections"></nav><section class="panel" id="panel"></section></div>';
    $("nav").innerHTML = TABS.map(([id, t]) => '<button type="button" class="nv" data-t="' + id + '">' + esc(t) + "</button>").join("");
    $("nav").addEventListener("click", e => {
      const b = e.target.closest("[data-t]");
      if (b) { tab = b.dataset.t; render(); }
    });
    $("panel").addEventListener("click", onClick);
    $("panel").addEventListener("input", onInput);
    $("panel").addEventListener("keydown", e => {
      if (e.key === "Enter" && e.target.id === "pw_new") { e.preventDefault(); resetPw(); }
      if (e.key === "Enter" && e.target.id === "up_n") { e.preventDefault(); updateUp(); }
    });
    render();
  }
  function render(msg) {
    $("nav").querySelectorAll(".nv").forEach(b => {
      const on = b.dataset.t === tab;
      b.classList.toggle("on", on);
      if (on) { b.setAttribute("aria-current", "page"); b.scrollIntoView({ block: "nearest", inline: "center" }); } else b.removeAttribute("aria-current");
    });
    ({ overview: renderOverview, storage: renderStorage, password: renderPassword, delete: renderDelete }[tab] || renderOverview)();
    if (msg) say("pmsg", msg[0], msg[1]);
  }

  function onClick(e) {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === "copy") copyText(b.dataset.v, b);
    else if (a === "dismissPw") { st.newPw = null; render(); }
    else if (a === "refresh") refreshInfo();
    else if (a === "upDec" || a === "upInc") {
      const inp = $("up_n"), max = st.maxStepsPerPurchase || 40;
      inp.value = Math.min(max, Math.max(1, (Number(inp.value) || 1) + (a === "upInc" ? 1 : -1)));
      updateUp();
    }
    else if (b.id === "upBuy") buyStorage();
    else if (b.id === "pwSave") resetPw();
    else if (b.id === "dbDel") deleteDb();
  }
  function onInput(e) { if (e.target.id === "up_n") updateUp(); }

  // ---------- overview
  function renderOverview() {
    const d = st.database, used = d.usedMb, lim = d.limitMb, susp = d.status === "suspended";
    const pct = used === null || used === undefined || !lim ? 0 : Math.min(100, used / lim * 100);
    const cls = susp || pct >= 100 ? "hot" : pct >= 80 ? "mid" : "";
    const kv = (label, val) => '<div class="st"><div class="hd"><div class="tx"><div class="t">' + esc(label) + '</div></div><div class="rt"><span class="code">' + esc(val) +
      '</span><button class="btn ghost small" type="button" data-act="copy" data-v="' + esc(val) + '">Copy</button></div></div></div>';
    const cmd = "mysql -h " + d.host + " -P " + d.port + " -u " + d.user + " -p " + d.dbName;
    $("panel").innerHTML =
      head("Overview", "Your MySQL database <b>" + esc(d.dbName) + "</b> is " + (susp ? '<span class="pill warn">Suspended</span>' : '<span class="pill ok">Active</span>') + ".") +
      (susp ? '<p class="msg err" style="margin:0 0 14px">This database went over its storage limit, so logins are blocked and open connections were closed. Add storage in the Storage tab to unlock it.</p>' : "") +
      (st.newPw ? '<p class="msg warn" style="margin:0 0 14px"><b>Save your database password now.</b> It is shown only once.<br><span class="code" style="display:inline-block;margin:8px 8px 0 0">' + esc(st.newPw) + "</span>" +
        '<button class="btn ghost small" type="button" data-act="copy" data-v="' + esc(st.newPw) + '" style="margin-top:8px">Copy</button> ' +
        '<button class="btn ghost small" type="button" data-act="dismissPw" style="margin-top:8px">I saved it</button></p>' : "") +
      '<div class="stats">' +
        '<div class="stat"><b>' + esc(fmtMb(used)) + "</b><span>Used</span></div>" +
        '<div class="stat"><b>' + esc(fmtMb(lim)) + "</b><span>Storage limit</span></div>" +
        '<div class="stat"><b>' + esc(fmtMb(d.planLimitMb)) + "</b><span>Included in plan</span></div>" +
        '<div class="stat"><b>' + esc(fmtMb(d.extraMb)) + "</b><span>Extra bought</span></div></div>" +
      '<div class="bar ' + cls + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + Math.round(pct) + '"><i style="width:' + pct.toFixed(1) + '%"></i></div>' +
      '<div class="barcap"><span>' + (used === null || used === undefined ? "Usage unavailable right now" : Math.round(pct) + "% used") + '</span><span>Usage can lag a few minutes behind</span></div>' +
      '<h3 class="sec">Connection details</h3><div class="list">' +
        kv("Host", d.host) + kv("Port", String(d.port)) + kv("Username", d.user) + kv("Database", d.dbName) +
        '<div class="st"><div class="t">Password</div><p class="d">The one you chose when you created the database. If you lost it, set a new one in the Password tab.</p></div></div>' +
      '<h3 class="sec">Command line</h3><p class="prev">' + esc(cmd) + "</p>" +
      '<div class="row"><button class="btn ghost small" type="button" data-act="copy" data-v="' + esc(cmd) + '">Copy command</button>' +
      '<button class="btn ghost small" type="button" data-act="refresh">Refresh usage</button></div>' +
      '<p class="msg" id="pmsg" hidden></p>';
  }
  async function refreshInfo() {
    say("pmsg", "", "");
    try {
      const { res, data: d } = await appPost("/mysql/info", {});
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) return say("pmsg", "err", d.error || "Couldn’t refresh the usage.");
      st = Object.assign({}, d, { newPw: st.newPw });
      render(["ok", "Usage updated."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
  }

  // ---------- storage
  function renderStorage() {
    const d = st.database, max = st.maxStepsPerPurchase || 40;
    $("panel").innerHTML =
      head("Storage", "Your <b>" + esc(app.plan) + "</b> plan includes <b>" + esc(fmtMb(d.planLimitMb)) + "</b>. Extra storage costs <b>" + esc(st.stepPriceCredits) + " credits</b> for every <b>" + esc(fmtMb(st.stepMb)) +
        "</b>. You have <b>" + esc(credits) + " credits</b>.") +
      '<div class="stats"><div class="stat"><b>' + esc(fmtMb(d.usedMb)) + "</b><span>Used</span></div>" +
        '<div class="stat"><b>' + esc(fmtMb(d.limitMb)) + "</b><span>Storage limit</span></div></div>" +
      '<div class="form" style="margin-top:0"><div><label class="label" for="up_n">Extra storage to add</label>' +
        '<div class="field num"><button class="stp" type="button" data-act="upDec" aria-label="Fewer">−</button>' +
        '<input id="up_n" type="number" inputmode="numeric" min="1" max="' + esc(max) + '" step="1" value="1">' +
        '<button class="stp" type="button" data-act="upInc" aria-label="More">+</button><span class="sfx">× ' + esc(fmtMb(st.stepMb)) + "</span></div>" +
        '<p class="hint">Up to ' + esc(max) + " steps at a time.</p></div>" +
      '<p class="prev" id="up_prev"></p><p class="hint" id="up_hint" style="margin-top:0"></p>' +
      '<div class="row"><button class="btn" id="upBuy" type="button">Buy storage</button></div></div>' +
      '<p class="msg" id="pmsg" hidden></p>';
    updateUp();
  }
  function upSteps() {
    const v = Number($("up_n").value), max = st.maxStepsPerPurchase || 40;
    return Number.isInteger(v) && v >= 1 && v <= max ? v : 0;
  }
  function updateUp() {
    const n = upSteps(), d = st.database, max = st.maxStepsPerPurchase || 40;
    if (!n) {
      $("up_prev").textContent = "Enter a whole number from 1 to " + max + ".";
      $("up_hint").textContent = "";
      $("upBuy").disabled = true;
      return;
    }
    const cost = n * st.stepPriceCredits, add = n * st.stepMb, short = cost > credits;
    $("up_prev").textContent = "Adds " + fmtMb(add) + " for " + cost + " credits. New limit: " + fmtMb(d.limitMb + add) + ".";
    $("up_hint").textContent = short ? "You have " + credits + " credits, so you need " + (cost - credits) + " more." : "You will have " + (credits - cost) + " credits left.";
    $("upBuy").disabled = short;
  }
  async function buyStorage() {
    const n = upSteps();
    if (!n) return;
    const cost = n * st.stepPriceCredits, add = n * st.stepMb;
    if (!await askConfirm("Add " + fmtMb(add) + " of storage for " + cost + " credits? The credits are taken from your balance right away.", { title: "Buy extra storage?", ok: "Buy for " + cost + " credits" })) return;
    say("pmsg", "", "");
    const btn = $("upBuy"); btn.disabled = true;
    try {
      const { res, data: d } = await appPost("/mysql/upgrade", { multiple: n });
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) { say("pmsg", "err", d.error || "Couldn’t add storage."); return; }
      credits = typeof d.credits === "number" ? d.credits : credits - cost;
      st.database = d.database;
      renderHeader();
      const still = d.database && d.database.status === "suspended";
      render([still ? "warn" : "ok",
        "Added " + fmtMb(add) + ". New limit: " + fmtMb(d.database.limitMb) + "." +
        (d.reactivated ? " Your database is active again." : "") +
        (still ? " It is still over its limit, so it stays suspended. Add more storage to unlock it." : "")]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("upBuy")) updateUp(); }
  }

  // ---------- password
  function renderPassword() {
    $("panel").innerHTML =
      head("Password", "Set a new password for the database user <b>" + esc(st.database.user) + "</b>. Anything using the old password stops working until you update it.") +
      '<div class="form" style="margin-top:0"><div><label class="label" for="pw_new">New database password</label>' +
      '<div class="field"><input id="pw_new" type="password" autocomplete="new-password" maxlength="128" placeholder="8 to 128 characters"></div>' +
      '<p class="hint">We don’t store this password, so keep it somewhere safe.</p></div>' +
      '<div class="row"><button class="btn" id="pwSave" type="button">Set new password</button></div></div>' +
      '<p class="msg" id="pmsg" hidden></p>';
  }
  async function resetPw() {
    const v = $("pw_new").value;
    if (v.length < 8 || v.length > 128) return say("pmsg", "err", "The password must be 8 to 128 characters.");
    say("pmsg", "", "");
    const btn = $("pwSave"); btn.disabled = true;
    try {
      const { res, data: d } = await appPost("/mysql/reset-password", { dbPassword: v });
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) { say("pmsg", "err", d.error || "Couldn’t change the password."); return; }
      $("pw_new").value = "";
      say("pmsg", "ok", "The database password was changed.");
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("pwSave")) $("pwSave").disabled = false; }
  }

  // ---------- delete
  function renderDelete() {
    $("panel").innerHTML =
      head("Delete database", "This permanently deletes <b>" + esc(st.database.dbName) + "</b> and everything in it. Extra storage you bought is lost too. You can create a new empty database afterwards.") +
      '<div class="row" style="margin-top:0"><button class="btn danger" id="dbDel" type="button">Delete database</button></div>' +
      '<p class="msg" id="pmsg" hidden></p>';
  }
  async function deleteDb() {
    if (!await askConfirm("“" + st.database.dbName + "” and all of its data will be deleted for good. This can’t be undone.", { title: "Delete this database?", ok: "Delete database", danger: true })) return;
    say("pmsg", "", "");
    const btn = $("dbDel"); btn.disabled = true;
    try {
      const { res, data: d } = await appPost("/mysql/delete", {});
      if (commonErrors(res, d)) return;
      if (!res.ok || !d.success) { say("pmsg", "err", d.error || "Couldn’t delete the database."); return; }
      showCreate(["ok", "The database was deleted."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("dbDel")) $("dbDel").disabled = false; }
  }

  // ---------- loading
  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }
  async function loadDb(pw) {
    const { res, data: d } = await post("/mysql/info", { appId: APP_ID, appPassword: pw });
    if (res.status === 401 && /app password/i.test(d.error || "")) { forgetAppPw(); return showPasswordGate("That app password is wrong. Enter the right one."); }
    if (res.status === 401) { location.replace("signup.html"); return; }
    if (res.status === 404 && /no database/i.test(d.error || "")) { saveAppPw(pw); return showCreate(); }
    if (res.status === 403) return renderFree();
    if (!res.ok || !d.success) {
      if ($("pwMsg")) return say("pwMsg", "err", d.error || "Couldn’t load the database.");
      return message("Couldn’t load the database", d.error || "Try again.", "Try again", location.pathname + location.search);
    }
    saveAppPw(pw);
    st = d;
    build();
  }
  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="layout"><div class="sk"></div></div>';
    try {
      const { res, data: d } = await post("/apps/list", {});
      if (res.status === 401) return message("Please sign up again", "We couldn’t verify your account on this device.", "Sign up", "signup.html");
      if (!res.ok || !d.success) throw new Error(d.error || "Request failed");
      app = (d.apps || []).find(a => a.id === APP_ID);
      if (!app) return message("App not found", "This app doesn’t exist or isn’t yours.", "Back to dashboard", "dashboard.html");
      credits = Number(d.credits) || 0;
      renderHeader();
      if (app.plan === "Free") return renderFree();
      const pw = storedAppPw();
      if (pw) await loadDb(pw); else showPasswordGate();
    } catch (err) {
      console.error(err);
      message("Couldn’t load your app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }
  load();
</script>
</body>
</html>
