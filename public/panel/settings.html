<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App settings – Fast Site</title>
<meta name="description" content="Settings for your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e4e4e7;--text:#09090b;--muted:#5b5b66;--accent:#0e7490;--accent-ink:#fff;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
  main{flex:1;padding:32px 20px 64px}
  [hidden]{display:none!important}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px}
  .sub b{color:var(--text)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lead{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field input{flex:1;min-width:0;padding:9px 12px;border:0;outline:0;background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
  .msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--soft)}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .sk{border:1px solid var(--line);border-radius:12px;height:120px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px)}}
  @keyframes ddFade{from{opacity:0}}
  .empty{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:48px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:21px}
  .empty p{margin:0 0 20px;color:var(--muted)}
  .mdl{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,#000 55%,transparent);animation:ddFade .12s ease-out}
  .mdl-box{width:100%;max-width:400px;padding:20px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:ddIn .14s ease-out}
  .mdl-box h3{margin:0 0 6px;font-size:17px}
  .mdl-box p{margin:0;color:var(--muted);font-size:14px}
  .mdl-box .field{margin-top:14px}
  .mdl-box .row{justify-content:flex-end;margin-top:20px}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:20px;margin:0 0 16px}
  .card h2{margin:0 0 4px;font-size:17px;letter-spacing:-.01em}
  .card .lead{margin:0 0 16px}
  .card.danger-zone{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
  .card.danger-zone h2{color:var(--danger)}
  .info{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 20px;margin:0}
  .info dt{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 2px}
  .info dd{margin:0;font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
  .info code{font:500 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:2px 6px;border-radius:6px}
  textarea.area{display:block;width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 14.5px/1.5 Inter,sans-serif;outline:0}
  textarea.area:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .meta{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12.5px;color:var(--muted)}
  .split{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .split p{margin:0;flex:1;min-width:220px;font-size:14px;color:var(--muted)}
  .split p b{color:var(--text)}
  .card .row{margin-top:14px}
  @media(max-width:820px){main{padding:24px 16px 48px}}
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header>
      <h1>App settings</h1>
      <p class="sub" id="sub">&nbsp;</p>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="siteFooter"></div>

<script>
  // Loads a shared HTML partial into a container. Styles, links and scripts in it are applied/run too.
  async function include(url, targetId) {
    try {
      const res = await fetch(url, { credentials: "same-origin" });
      if (!res.ok) throw new Error(res.status + " " + url);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const target = document.getElementById(targetId);
      doc.head.querySelectorAll("style,link[rel=stylesheet]").forEach(n => document.head.appendChild(n.cloneNode(true)));
      const scripts = [...doc.querySelectorAll("script")];
      scripts.forEach(sc => sc.remove());
      [...doc.body.childNodes].forEach(n => target.appendChild(document.importNode(n, true)));
      const all = [...doc.head.querySelectorAll("script"), ...scripts];
      for (const old of all) {
        const sc = document.createElement("script");
        for (const a of old.attributes) sc.setAttribute(a.name, a.value);
        sc.textContent = old.textContent;
        if (old.src) await new Promise(r => { sc.onload = sc.onerror = r; target.appendChild(sc); });
        else target.appendChild(sc);
      }
    } catch (e) { console.error("include failed:", e); }
  }
  include("../assets/panel-essentials.html", "panelEssentials");
  include("../assets/footer.html", "siteFooter");
</script>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  let app = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const netErr = "Network error. Check your connection and try again.";

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  const storedAppPw = () => { try { return localStorage.getItem("lp-app-password:" + APP_ID) || ""; } catch (e) { return ""; } };
  const forgetAppPw = () => { try { localStorage.removeItem("lp-app-password:" + APP_ID); } catch (e) {} };

  async function post(path, extra) {
    const { u, p } = creds();
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p }, extra))
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { res, data };
  }

  function say(id, kind, text) {
    const el = $(id);
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }

  // Confirm dialog. If askPassword is true it also collects the app password.
  // Resolves to false (cancelled) or { password }.
  function confirmAction(text, askPassword, o) {
    o = Object.assign({ title: "Delete this app?", label: "Delete app", cls: "danger solid" }, o);
    return new Promise(res => {
      const prev = document.activeElement;
      const m = document.createElement("div"); m.className = "mdl";
      m.innerHTML = '<div class="mdl-box" role="alertdialog" aria-modal="true" aria-labelledby="mdlT"><h3 id="mdlT">' + esc(o.title) + '</h3><p>' + esc(text) + "</p>" +
        (askPassword ? '<div class="field"><input id="mdlPw" type="password" autocomplete="current-password" placeholder="App password" aria-label="App password"></div>' : "") +
        '<p class="msg err" id="mdlErr" hidden style="margin-top:12px"></p>' +
        '<div class="row"><button class="btn ghost" type="button" data-r="0">Cancel</button><button class="btn ' + o.cls + '" type="button" data-r="1">' + esc(o.label) + '</button></div></div>';
      const done = v => { document.removeEventListener("keydown", key, true); m.remove(); if (prev && prev.focus && prev.isConnected) prev.focus(); res(v); };
      const submit = () => {
        const pw = askPassword ? $("mdlPw").value : storedAppPw();
        if (!pw) { say("mdlErr", "err", "Enter your app password."); return; }
        done({ password: pw });
      };
      const key = e => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
        else if (e.key === "Enter" && e.target && e.target.id === "mdlPw") { e.preventDefault(); submit(); }
        else if (e.key === "Tab") {
          const f = [...m.querySelectorAll("input,button")];
          const i = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      };
      m.addEventListener("click", e => {
        const b = e.target.closest("button");
        if (b) { if (b.dataset.r === "1") submit(); else done(false); }
        else if (e.target === m) done(false);
      });
      document.addEventListener("keydown", key, true);
      document.body.appendChild(m);
      (askPassword ? $("mdlPw") : m.querySelector('[data-r="1"]')).focus();
    });
  }

  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }

  const MAX_DESC = 500;
  function fmtDate(v) {
    const d = new Date(v);
    return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  function build() {
    const info = [
      ["Name", esc(app.name)],
      ["App ID", "<code>" + esc(app.id) + "</code>"],
      ["Plan", esc(app.plan || "Free")],
      ["Created", esc(fmtDate(app.createdAt))],
      ["Custom domain", app.customDomain ? esc(app.customDomain) + (app.customDomainVerified === false ? " (not verified)" : "") : "None"],
      ["Daily backup", app.dailyBackup ? "On" : "Off"]
    ].map(r => "<div><dt>" + r[0] + "</dt><dd>" + r[1] + "</dd></div>").join("");

    $("content").innerHTML =
      '<section class="card" aria-labelledby="hInfo"><h2 id="hInfo">Overview</h2><p class="lead">The basics about this app.</p><dl class="info">' + info + "</dl></section>" +

      '<section class="card" aria-labelledby="hDesc"><h2 id="hDesc">Description</h2>' +
      '<p class="lead">A short note about what this app is for. It’s optional and only you can see it.</p>' +
      '<label class="label" for="descIn">Description</label>' +
      '<textarea class="area" id="descIn" maxlength="' + MAX_DESC + '" placeholder="e.g. My portfolio website"></textarea>' +
      '<div class="meta"><span>Leave it empty to remove the description.</span><span id="descCount">0 / ' + MAX_DESC + "</span></div>" +
      '<div class="row"><button class="btn" id="descSave" type="button" disabled>Save description</button></div>' +
      '<p class="msg" id="dmsg" hidden></p></section>' +

      '<section class="card danger-zone" aria-labelledby="hDanger"><h2 id="hDanger">Danger zone</h2>' +
      '<p class="lead">Actions here can’t be undone.</p>' +
      '<div class="split"><p><b>Delete this app.</b> Its files, backups and database are permanently removed and its address stops working.</p>' +
      '<button class="btn danger" id="delBtn" type="button">Delete app</button></div>' +
      '<p class="msg" id="pmsg" hidden></p></section>';

    const inp = $("descIn");
    inp.value = app.description || "";
    const sync = () => {
      $("descCount").textContent = inp.value.length + " / " + MAX_DESC;
      $("descSave").disabled = inp.value.trim() === (app.description || "");
    };
    inp.addEventListener("input", sync);
    $("descSave").addEventListener("click", saveDescription);
    sync();
    $("delBtn").addEventListener("click", deleteApp);
  }

  async function saveDescription() {
    const btn = $("descSave"), value = $("descIn").value.trim();
    let pw = storedAppPw();
    if (!pw) {
      const r = await confirmAction("Enter your app password to save the description.", true, { title: "Confirm it’s you", label: "Save", cls: "" });
      if (!r) return;
      pw = r.password;
    }
    btn.disabled = true;
    say("dmsg", "", "");
    try {
      const { res, data } = await post("/apps/description", { appId: APP_ID, appPassword: pw, description: value });
      if (res.status === 401 && /app password/i.test(data.error || "")) {
        forgetAppPw();
        say("dmsg", "err", "That app password is wrong.");
      } else if (res.status === 401) {
        location.replace("signup.html"); return;
      } else if (!res.ok || !data.success) {
        say("dmsg", "err", data.error || "Couldn’t save the description. Try again.");
      } else {
        app.description = (data.app && data.app.description) || "";
        $("descIn").value = app.description;
        say("dmsg", "ok", app.description ? "Description saved." : "Description removed.");
      }
    } catch (e) {
      console.error(e);
      say("dmsg", "err", netErr);
    }
    $("descCount").textContent = $("descIn").value.length + " / " + MAX_DESC;
    btn.disabled = $("descIn").value.trim() === (app.description || "");
  }

  async function deleteApp() {
    const hasPw = !!storedAppPw();
    const r = await confirmAction(
      "“" + app.name + "” and all of its files, backups and database will be permanently deleted. This can’t be undone." + (hasPw ? "" : " Enter your app password to confirm."),
      !hasPw
    );
    if (!r) return;
    const btn = $("delBtn");
    btn.disabled = true;
    say("pmsg", "", "");
    try {
      const { res, data } = await post("/apps/delete", { appId: APP_ID, appPassword: r.password });
      if (res.status === 401 && /app password/i.test(data.error || "")) {
        forgetAppPw();
        say("pmsg", "err", "That app password is wrong.");
      } else if (res.status === 401) {
        location.replace("signup.html"); return;
      } else if (!res.ok || !data.success) {
        say("pmsg", "err", data.error || "Couldn’t delete the app. Try again.");
      } else {
        forgetAppPw();
        message("App deleted", "“" + app.name + "” has been deleted.", "Back to dashboard", "dashboard.html");
        return;
      }
    } catch (e) {
      console.error(e);
      say("pmsg", "err", netErr);
    }
    btn.disabled = false;
  }

  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="sk"></div>';
    try {
      const { res, data: d } = await post("/apps/list", {});
      if (res.status === 401) return message("Please sign up again", "We couldn’t verify your account on this device.", "Sign up", "signup.html");
      if (!res.ok || !d.success) throw new Error(d.error || "Request failed");
      app = (d.apps || []).find(a => a.id === APP_ID);
      if (!app) return message("App not found", "This app doesn’t exist or isn’t yours.", "Back to dashboard", "dashboard.html");
      document.title = app.name + " – App settings – Fast Site";
      $("sub").innerHTML = "App <b>" + esc(app.name) + "</b>";
      build();
    } catch (err) {
      console.error(err);
      message("Couldn’t load your app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }
  load();
</script>
</body>
</html>
