<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache settings – Fast Site</title>
<meta name="description" content="Control caching, TTLs, cache rules and purges for your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f6f6f7;--line:#e4e4e7;--text:#09090b;--muted:#5b5b66;--accent:#0e7490;--accent-ink:#fff;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow-x:hidden}
  main{flex:1;padding:32px 20px 64px}
  [hidden]{display:none!important}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:26px;letter-spacing:-.02em;line-height:1.2;margin:0 0 4px}
  .sub{margin:0 0 24px;color:var(--muted);font-size:14.5px}
  .sub b{color:var(--text)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
  .nav{position:static;display:flex;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nv{text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);font:500 14px Inter,sans-serif;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .nv:hover{background:var(--soft);color:var(--text)}
  .nv.on{background:var(--soft);color:var(--text);font-weight:600;border-color:var(--accent)}
  .panel{min-width:0}
  .panel h2{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
  .lead{margin:0 0 18px;font-size:14px;color:var(--muted)}
  .lead b{color:var(--text)}

  .list{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
  .st{padding:16px 18px}
  .st+.st{border-top:1px solid var(--line)}
  .hd{display:flex;flex-wrap:wrap;gap:12px 18px;justify-content:space-between;align-items:center}
  .tx{flex:1 1 200px;min-width:0}
  .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .d{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .rt{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .val{font-size:14px;font-weight:500;color:var(--muted)}
  .ed{padding-top:14px}
  .locked .tx{opacity:.6}

  .label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.warn{color:var(--danger)}
  .pill.ok{color:var(--ok)}
  .pill.lock{background:transparent}
  .hint{margin:7px 0 0;font-size:12.5px;color:var(--muted)}

  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;max-width:380px}
  .field:focus-within,textarea.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field.num{max-width:260px}
  .field input{flex:1;min-width:0;padding:9px 12px;border:0;outline:0;background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif}
  .field input::placeholder{color:var(--muted);opacity:.7}
  .field input:disabled,.field select:disabled{opacity:.5;cursor:not-allowed}
  .sfx{display:flex;align-items:center;padding:0 12px;background:var(--soft);border-left:1px solid var(--line);color:var(--muted);font-size:14px}
  select.sel{appearance:none;-webkit-appearance:none;border:0;border-left:1px solid var(--line);background:var(--soft);color:var(--muted);font:500 14px Inter,sans-serif;padding:0 26px 0 12px;cursor:pointer;outline:0;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .field.solo select.sel{border-left:0;background-color:var(--surface);color:var(--text);flex:1;padding:9px 30px 9px 12px;font-size:14.5px}
  textarea.ta{width:100%;max-width:520px;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:500 13.5px ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;display:block}
  textarea.ta:disabled{opacity:.5}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);opacity:1}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.small{padding:6px 12px;font-size:13px}

  .msg{margin:14px 0 0;padding:10px 14px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--soft)}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .msg.info{color:var(--muted)}

  .sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
  .sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
  .sw input:checked+i{background:var(--accent)}
  .sw input:checked+i::after{transform:translateX(18px)}
  .sw input:disabled{cursor:not-allowed}
  .sw input:disabled+i{opacity:.45}
  .sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

  .rule{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
  .rule+.rule{border-top:1px solid var(--line)}
  .rule .n{width:24px;height:24px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .rule .m{min-width:0}
  .rule .m b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rule .m small{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;color:var(--muted);font-size:12.5px;align-items:center}
  .rule .m code{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 7px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--text)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .acts .btn{padding:5px 10px;font-size:12.5px}
  .none{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
  .form{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  .form>*+*{margin-top:14px}
  .form h3{margin:0;font-size:15px}
  .form>.hint{margin-top:8px}
  .form>.row{margin-top:18px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .cols .field{max-width:none}
  .fg+.fg{margin-top:14px}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .stat{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:12px 14px}
  .stat b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.2}
  .stat span{font-size:12.5px;font-weight:500;color:var(--muted)}
  .hist{margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
  .hist li{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px}
  .hist li+li{border-top:1px solid var(--line)}
  .hist time{color:var(--muted);min-width:170px}
  .hist .by{margin-left:auto}
  h3.sec{margin:24px 0 8px;font-size:15px}

  .sk{border:1px solid var(--line);border-radius:12px;height:240px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:14px;background:var(--soft);padding:48px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:21px}
  .empty p{margin:0 0 20px;color:var(--muted)}
  .gate{max-width:480px}

  @media(max-width:820px){
    main{padding:24px 16px 48px}
  }
  @media(max-width:560px){
    h1{font-size:23px}
    .st{padding:14px}
    .field,.field.num,textarea.ta{max-width:none}
    .rule{grid-template-columns:28px minmax(0,1fr)}
    .rule .acts{grid-column:1/-1;justify-content:flex-start}
    .hist time{min-width:0}
    .form{padding:14px}
  }
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header>
      <h1>Cache settings</h1>
      <p class="sub" id="sub">&nbsp;</p>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  let app = null, cache = null, editingRule = null, tab = "general";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function inject(id, url) {
    fetch(url).then(r => r.ok ? r.text() : "").then(html => {
      const box = $(id);
      box.innerHTML = html;
      box.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    }).catch(e => console.error("Could not load " + url, e));
  }
  inject("panelEssentials", "../assets/panel-essentials.html");
  inject("footer", "../assets/footer-panel.html");

  // ---------- credentials / api
  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  const storedAppPw = () => { try { return localStorage.getItem("lp-app-password:" + APP_ID) || ""; } catch (e) { return ""; } };
  const saveAppPw = pw => { try { localStorage.setItem("lp-app-password:" + APP_ID, pw); } catch (e) {} };
  const forgetAppPw = () => { try { localStorage.removeItem("lp-app-password:" + APP_ID); } catch (e) {} };
  const appPassword = () => storedAppPw() || ($("apw") ? $("apw").value : "");

  async function post(path, extra) {
    const { u, p } = creds();
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p }, extra))
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { res, data };
  }
  const appPost = (path, extra) => post(path, Object.assign({ appId: APP_ID, appPassword: appPassword() }, extra));

  function say(id, kind, text) {
    const el = $(id);
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }
  function commonErrors(res, data) {
    if (res.status === 401 && /app password/i.test(data.error || "")) {
      forgetAppPw(); cache = null;
      showPasswordGate("That app password is wrong. Enter the right one.");
      return true;
    }
    if (res.status === 401) { location.replace("signup.html"); return true; }
    return false;
  }
  const netErr = "Network error. Check your connection and try again.";

  // ---------- setting definitions (one entry per setting the worker accepts)
  const SET = {
    edgeCache:           { t: "bool",  title: "Edge cache", d: "Keep copies of your pages at the edge so repeat visits skip the database. A copy lives until its TTL ends; purges do not remove it." },
    browserTtl:          { t: "ttl",   title: "Browser TTL", d: "How long a visitor’s browser reuses pages and files before asking again." },
    edgeTtl:             { t: "ttl",   title: "Edge TTL", d: "How long a copy stays at the edge. Only used when Edge cache is on." },
    mediaBrowserTtl:     { t: "ttl",   title: "Media browser TTL", d: "Browser TTL for images, video, audio and fonts." },
    mediaEdgeTtl:        { t: "ttl",   title: "Media edge TTL", d: "Edge TTL for images, video, audio and fonts." },
    immutableMedia:      { t: "bool",  title: "Immutable media", d: "Adds the immutable directive to media with a browser TTL of 1 day or more, so browsers never revalidate them." },
    etag:                { t: "bool",  title: "ETag revalidation", d: "Browsers get a quick 304 when a file has not changed. Purges change the ETag, so visitors get fresh files at once." },
    staleWhileRevalidate:{ t: "ttl",   title: "Stale while revalidate", d: "Let browsers show an expired copy for this long while they fetch a new one. 0 turns it off." },
    staleIfError:        { t: "ttl",   title: "Stale if error", d: "Let browsers use an expired copy for this long if the site errors. 0 turns it off." },
    deviceCache:         { t: "bool",  title: "Cache by device", d: "Separate cached copies for mobile, tablet and desktop." },
    cacheByCountry:      { t: "bool",  title: "Cache by country", d: "Separate cached copies for each visitor country." },
    autoPurgeOnDeploy:   { t: "bool",  title: "Auto purge on deploy", d: "Purge the cache whenever files are uploaded, changed, moved or restored from a backup." },
    debugHeader:         { t: "bool",  title: "Debug header", d: "Adds an X-Cache-Policy header showing which rule or default set the cache headers." },
    smartTtl:            { t: "bool",  title: "Smart TTL", d: "Pages that have not changed for a while get longer TTLs (up to 1 day). Does not apply to media." },
    purgeEveryHours:     { t: "hours", title: "Scheduled purge", d: "Purge everything automatically every N hours (0-720). 0 turns it off." },
    purgeWebhook:        { t: "url",   title: "Purge webhook", d: "A public https URL that receives a POST every time the cache is purged." },
  };
  const GROUPS = [
    { id: "g1", title: "Browser and edge", lead: "How long pages and files are reused.", keys: ["browserTtl", "edgeTtl", "edgeCache"] },
    { id: "g2", title: "Media files", lead: "Images, video, audio and fonts have their own TTLs.", keys: ["mediaBrowserTtl", "mediaEdgeTtl", "immutableMedia"] },
    { id: "g3", title: "Revalidation", lead: "Keep visitors fast, even when files change or the site has a problem.", keys: ["etag", "staleWhileRevalidate", "staleIfError"] },
    { id: "g4", title: "Cache variants", lead: "Serve a different cached copy depending on who is asking.", keys: ["deviceCache", "cacheByCountry"] },
    { id: "g5", title: "Purging and debugging", lead: "Keep the cache fresh and see what it is doing.", keys: ["autoPurgeOnDeploy", "smartTtl", "debugHeader"] },
    { id: "g6", title: "Scheduled purge", lead: "Clear the cache on a timer and get notified.", keys: ["purgeEveryHours", "purgeWebhook"] },
  ];
  const TABS = [["general", "Overview"]].concat(GROUPS.map(g => [g.id, g.title]), [["rules", "Cache rules"], ["purge", "Purge cache"], ["stats", "Statistics"]]);
  const UNITS = [["seconds", 1], ["minutes", 60], ["hours", 3600], ["days", 86400]];

  const feat = k => (cache.features && cache.features[k]) || { available: true, requires: "" };
  const maxTtl = () => (cache.limits && cache.limits.maxTtl) || 86400;
  const fmtTtl = s => {
    if (s === null || s === undefined || s === "") return "Default";
    if (!s) return "0 s";
    const u = [["d", 86400], ["h", 3600], ["min", 60]].find(x => s % x[1] === 0);
    return u ? s / u[1] + " " + u[0] : s + " s";
  };
  const fmtDate = iso => { try { return new Date(iso).toLocaleString(); } catch (e) { return iso; } };
  const head = (t, l) => "<h2>" + esc(t) + '</h2><p class="lead">' + l + "</p>";
  const lockPill = f => f.available ? "" : '<span class="pill lock warn">Requires ' + esc(f.requires) + "</span>";

  // ---------- ttl control: number + unit
  function ttlControl(id, secs, { optional = false, disabled = false } = {}) {
    let unit = 1;
    if (secs) for (const [, m] of UNITS) if (secs % m === 0) unit = m;
    const val = secs === null || secs === undefined || secs === "" ? "" : secs / unit;
    return '<div class="field num"><input id="' + id + '" type="number" min="0" step="1" inputmode="numeric" value="' + esc(val) + '"' +
      (optional ? ' placeholder="default"' : "") + (disabled ? " disabled" : "") + ">" +
      '<select class="sel" id="' + id + '_u" aria-label="Unit"' + (disabled ? " disabled" : "") + ">" +
      UNITS.map(([n, m]) => '<option value="' + m + '"' + (m === unit ? " selected" : "") + ">" + n + "</option>").join("") + "</select></div>";
  }
  function readTtl(id, label, { optional = false } = {}) {
    const raw = $(id).value.trim();
    if (raw === "") { if (optional) return ""; throw new Error(label + " is required."); }
    const n = Number(raw) * Number($(id + "_u").value);
    if (!Number.isInteger(n) || n < 0) throw new Error(label + " must be a whole number of seconds (0 or more).");
    if (n > maxTtl()) throw new Error(label + " can be at most " + fmtTtl(maxTtl()) + " on your plan.");
    return n;
  }

  // ---------- header + password gate
  function renderHeader() {
    document.title = app.name + " – Cache settings – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(app.name) + "</b>";
  }
  function showPasswordGate(errText) {
    $("content").innerHTML =
      '<div class="gate"><h2 style="margin:0 0 2px;font-size:19px">App password</h2>' +
      '<p class="lead">Cache settings need your app password. It was shown once when you created the app.</p>' +
      '<div class="field"><input id="apw" type="password" autocomplete="current-password" placeholder="App password"></div>' +
      '<div class="row"><button class="btn" id="pwBtn" type="button">Continue</button></div>' +
      '<p class="msg" id="pwMsg" hidden></p></div>';
    $("pwBtn").addEventListener("click", unlock);
    $("apw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    $("apw").focus();
    if (errText) say("pwMsg", "err", errText);
  }
  async function unlock() {
    const pw = $("apw").value;
    if (!pw) return say("pwMsg", "err", "Enter your app password.");
    $("pwBtn").disabled = true;
    try { await loadCache(pw); } finally { if ($("pwBtn")) $("pwBtn").disabled = false; }
  }

  // ---------- page skeleton: side nav + one panel at a time
  function build() {
    $("content").innerHTML = '<div class="layout"><nav class="nav" id="nav" aria-label="Cache sections"></nav><section class="panel" id="panel"></section></div>';
    $("nav").innerHTML = TABS.map(([id, t]) => '<button type="button" class="nv" data-t="' + id + '">' + esc(t) + "</button>").join("");
    $("nav").addEventListener("click", e => {
      const b = e.target.closest("[data-t]");
      if (b) { tab = b.dataset.t; editingRule = null; render(); }
    });
    $("panel").addEventListener("click", onClick);
    $("panel").addEventListener("change", onChange);
    render();
  }
  function render(msg) {
    $("nav").querySelectorAll(".nv").forEach(b => {
      const on = b.dataset.t === tab;
      b.classList.toggle("on", on);
      if (on) { b.setAttribute("aria-current", "page"); b.scrollIntoView({ block: "nearest", inline: "center" }); } else b.removeAttribute("aria-current");
    });
    ({ general: renderMain, rules: renderRules, purge: renderPurge, stats: renderStats }[tab] || (() => renderGroup(tab)))();
    if (msg) say("pmsg", msg[0], msg[1]);
  }

  function onClick(e) {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    const d = b.dataset, id = b.id;
    if (d.edit) { const ed = b.closest(".st").querySelector(".ed"); ed.hidden = !ed.hidden; b.textContent = ed.hidden ? "Edit" : "Close"; }
    else if (d.cancel) render();
    else if (d.save) saveSetting(d.save, b);
    else if (d.up) moveRule(d.up, -1);
    else if (d.down) moveRule(d.down, 1);
    else if (d.redit) { editingRule = d.redit; renderRules(); $("r_name").scrollIntoView({ behavior: "smooth", block: "center" }); }
    else if (d.del) deleteRule(d.del);
    else if (id === "resetBtn") resetAll();
    else if (id === "ruleNew") { editingRule = "new"; renderRules(); }
    else if (id === "ruleCancel") { editingRule = null; renderRules(); }
    else if (id === "ruleSave") saveRule();
    else if (id === "purgeAll") doPurge({ all: true }, b);
    else if (id === "purgeToggle") $("purgeForm").hidden = !$("purgeForm").hidden;
    else if (id === "purgeSel") {
      const paths = $("p_paths").value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
      const extensions = $("p_ext").value.split(",").map(s => s.trim()).filter(Boolean);
      if (!paths.length && !extensions.length) return say("pmsg", "err", "Enter at least one file, path or extension.");
      doPurge({ paths, extensions }, b);
    }
    else if (id === "statsRefresh") renderStats();
  }
  function onChange(e) {
    const t = e.target;
    if (t.id === "enabledSw") toggleEnabled(t);
    else if (t.dataset.bool) saveSetting(t.dataset.bool, t);
    else if (t.id === "r_type" || t.id === "r_action") syncRule();
  }

  // ---------- overview (switch, limits, reset)
  function renderMain() {
    const s = cache.settings, l = cache.limits || {};
    const pd = l.purgesPerDay === null || l.purgesPerDay === undefined ? "Unlimited" : l.purgesPerDay;
    $("panel").innerHTML = head("Caching", "Turn caching off completely, or reset every setting and rule to its default.") +
      '<div class="list"><div class="st"><div class="hd"><div class="tx"><div class="t">Caching is ' + (s.enabled !== false ? "on" : "off") + "</div>" +
      '<p class="d">When off, every response is sent with no-store and the cache is purged.</p></div>' +
      '<div class="rt"><label class="sw"><input type="checkbox" id="enabledSw" aria-label="Caching"' + (s.enabled !== false ? " checked" : "") + "><i></i></label></div></div></div></div>" +
      '<h3 class="sec">Plan limits</h3><div class="pills">' +
        '<span class="pill">' + (cache.rules || []).length + " / " + esc(l.rules) + " rules</span>" +
        '<span class="pill">Max TTL ' + esc(fmtTtl(l.maxTtl)) + "</span>" +
        '<span class="pill">' + esc(pd) + " purges / day</span></div>" +
      '<div class="row"><button class="btn danger" id="resetBtn" type="button">Reset to defaults</button></div>' +
      '<p class="msg" id="pmsg" hidden></p>';
  }
  async function toggleEnabled(sw) {
    const disabled = !sw.checked;
    say("pmsg", "", "");
    sw.disabled = true;
    try {
      const { res, data } = await appPost("/cache/disable", { disabled });
      if (commonErrors(res, data)) return;
      if (!res.ok || !data.success) { sw.checked = !sw.checked; return say("pmsg", "err", data.error || "Couldn’t change caching."); }
      cache = Object.assign(cache, data);
      render(["ok", data.message || "Saved."]);
    } catch (err) { console.error(err); sw.checked = !sw.checked; say("pmsg", "err", netErr); }
    finally { sw.disabled = false; }
  }
  async function resetAll() {
    say("pmsg", "", "");
    if (!confirm("Reset all cache settings to their defaults?\n\nYour cache rules are removed too.")) return;
    $("resetBtn").disabled = true;
    try {
      const { res, data } = await appPost("/cache/reset", {});
      if (commonErrors(res, data)) return;
      if (!res.ok || !data.success) return say("pmsg", "err", data.error || "Couldn’t reset the settings.");
      cache = Object.assign(cache, data);
      editingRule = null;
      render(["ok", "All settings are back to their defaults."]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if ($("resetBtn")) $("resetBtn").disabled = false; }
  }

  // ---------- settings groups
  function controlFor(key) {
    const def = SET[key], f = feat(key), v = cache.settings[key], dis = !f.available, id = "s_" + key;
    if (def.t === "bool") return '<label class="sw"><input type="checkbox" id="' + id + '" data-bool="' + key + '" aria-label="' + esc(def.title) + '"' + (v ? " checked" : "") + (dis ? " disabled" : "") + "><i></i></label>";
    if (def.t === "ttl") return ttlControl(id, v, { disabled: dis });
    if (def.t === "hours") return '<div class="field num"><input id="' + id + '" type="number" min="0" max="720" step="1" inputmode="numeric" value="' + esc(v || 0) + '"' + (dis ? " disabled" : "") + '><span class="sfx">hours</span></div>';
    return '<div class="field"><input id="' + id + '" type="url" autocomplete="off" spellcheck="false" maxlength="300" placeholder="https://example.com/hook" value="' + esc(v || "") + '"' + (dis ? " disabled" : "") + "></div>";
  }
  function valText(k) {
    const t = SET[k].t, v = cache.settings[k];
    return t === "ttl" ? fmtTtl(v) : t === "hours" ? (v ? v + " h" : "Off") : (v || "Not set");
  }
  function renderGroup(id) {
    const g = GROUPS.find(x => x.id === id);
    $("panel").innerHTML = head(g.title, esc(g.lead)) + '<div class="list">' + g.keys.map(k => {
      const f = feat(k), d = SET[k], b = d.t === "bool";
      return '<div class="st' + (f.available ? "" : " locked") + '"><div class="hd"><div class="tx"><div class="t">' + esc(d.title) + lockPill(f) + '</div><p class="d">' + esc(d.d) + '</p></div><div class="rt">' +
        (b ? controlFor(k) : '<span class="val">' + esc(valText(k)) + '</span><button class="btn ghost small" type="button" data-edit="' + k + '"' + (f.available ? "" : " disabled") + ">Edit</button>") + "</div></div>" +
        (b ? "" : '<div class="ed" hidden>' + controlFor(k) + '<div class="row"><button class="btn small" type="button" data-save="' + k + '">Save changes</button><button class="btn ghost small" type="button" data-cancel="' + k + '">Cancel</button></div></div>') + "</div>";
    }).join("") + '</div><p class="msg" id="pmsg" hidden></p>';
  }
  function readSetting(key) {
    const def = SET[key], el = $("s_" + key);
    if (def.t === "bool") return el.checked;
    if (def.t === "ttl") return readTtl("s_" + key, def.title);
    if (def.t === "hours") {
      const n = Number(el.value);
      if (el.value.trim() === "" || !Number.isInteger(n) || n < 0 || n > 720) throw new Error(def.title + " must be a whole number from 0 to 720.");
      return n;
    }
    const u = el.value.trim();
    if (u && !/^https:\/\//i.test(u)) throw new Error(def.title + " must be a public https URL.");
    return u || null;
  }
  async function saveSetting(k, el) {
    say("pmsg", "", "");
    const isBool = SET[k].t === "bool";
    let v;
    try { v = readSetting(k); } catch (err) { return say("pmsg", "err", err.message); }
    const cur = cache.settings[k];
    if (v === (cur === "" ? null : cur)) return say("pmsg", "info", "No changes to save.");
    el.disabled = true;
    try {
      const { res, data } = await appPost("/cache/settings", { [k]: v });
      if (commonErrors(res, data)) return;
      if (!res.ok || !data.success) { if (isBool) el.checked = !v; return say("pmsg", "err", data.error || "Couldn’t save the settings."); }
      cache = Object.assign(cache, data);
      render(["ok", "Saved: " + SET[k].title + "."]);
    } catch (err) { console.error(err); if (isBool) el.checked = !v; say("pmsg", "err", netErr); }
    finally { el.disabled = false; }
  }

  // ---------- cache rules
  const RULE_TYPES = { all: "Everything", extension: "File extensions", file: "One file", path: "Path pattern" };
  const MATCH_HINT = { extension: ["css,js,png", "Comma-separated extensions, without the dot."], file: ["/logo.png", "The exact path of one file."], path: ["/assets/*", "A path with * as a wildcard, for example /blog/*."] };

  function ruleLine(r, i, n) {
    const bypass = r.action === "bypass";
    return '<div class="rule"><span class="n">' + (i + 1) + "</span>" +
      '<div class="m"><b>' + esc(r.name || (RULE_TYPES[r.type] + (r.type === "all" ? "" : ": " + r.match))) + "</b><small>" +
      '<span class="pill ' + (bypass ? "warn" : "ok") + '">' + (bypass ? "Bypass (no-store)" : "Cache") + "</span>" +
      "<span>" + esc(RULE_TYPES[r.type]) + "</span>" + (r.type === "all" ? "" : "<code>" + esc(r.match) + "</code>") +
      (bypass ? "" : "<span>Browser " + esc(fmtTtl(r.browserTtl)) + " · Edge " + esc(fmtTtl(r.edgeTtl)) + "</span>") +
      '</small></div><div class="acts">' +
      '<button class="btn ghost" type="button" data-up="' + r.id + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Move up">↑</button>' +
      '<button class="btn ghost" type="button" data-down="' + r.id + '"' + (i === n - 1 ? " disabled" : "") + ' aria-label="Move down">↓</button>' +
      '<button class="btn ghost" type="button" data-redit="' + r.id + '">Edit</button>' +
      '<button class="btn danger" type="button" data-del="' + r.id + '">Delete</button></div></div>';
  }
  function renderRules() {
    const rules = cache.rules || [], l = cache.limits || {}, open = editingRule !== null;
    const e = open && editingRule !== "new" ? rules.find(r => r.id === editingRule) : null;
    const v = e || { type: "all", match: "", action: "cache", name: "", browserTtl: null, edgeTtl: null };
    const full = !e && rules.length >= l.rules;
    const opt = (val, cur, label) => '<option value="' + val + '"' + (cur === val ? " selected" : "") + ">" + label + "</option>";
    $("panel").innerHTML =
      head("Cache rules", "Override the defaults for certain files. Rules run from top to bottom and the first one that matches wins. You are using " + rules.length + " of " + esc(l.rules) + ".") +
      (rules.length ? '<div class="list">' + rules.map((r, i) => ruleLine(r, i, rules.length)).join("") + "</div>" : '<div class="none">No rules yet. Everything uses the default TTLs.</div>') +
      (open ?
        '<div class="form"><h3>' + (e ? "Edit rule" : "Add a rule") + "</h3>" +
        '<div class="cols"><div><label class="label" for="r_name">Name (optional)</label><div class="field"><input id="r_name" type="text" maxlength="60" autocomplete="off" placeholder="Long cache for images" value="' + esc(v.name || "") + '"></div></div>' +
        '<div><label class="label" for="r_type">Applies to</label><div class="field solo"><select class="sel" id="r_type">' + Object.keys(RULE_TYPES).map(k => opt(k, v.type, RULE_TYPES[k])).join("") + "</select></div></div></div>" +
        '<div id="r_matchBox"><label class="label" for="r_match">Match</label><div class="field"><input id="r_match" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="200" value="' + esc(v.match === "*" ? "" : v.match) + '"></div><p class="hint" id="r_hint"></p></div>' +
        '<div class="cols"><div><label class="label" for="r_action">Action</label><div class="field solo"><select class="sel" id="r_action">' + opt("cache", v.action, "Cache with these TTLs") + opt("bypass", v.action, "Bypass (never cache)") + "</select></div></div></div>" +
        '<div class="cols" id="r_ttls"><div><span class="label">Browser TTL</span>' + ttlControl("r_b", v.browserTtl, { optional: true }) + "</div>" +
        '<div><span class="label">Edge TTL</span>' + ttlControl("r_e", v.edgeTtl, { optional: true }) + "</div></div>" +
        '<p class="hint" id="r_ttlhint">Leave a TTL empty to keep the default from the settings. Max ' + esc(fmtTtl(maxTtl())) + " on your plan.</p>" +
        '<div class="row"><button class="btn" id="ruleSave" type="button"' + (full ? " disabled" : "") + ">" + (e ? "Save rule" : "Add rule") + '</button><button class="btn ghost" id="ruleCancel" type="button">Cancel</button></div>' +
        (full ? '<p class="hint">You have reached the rule limit of your plan.</p>' : "") + "</div>"
      :
        '<div class="row"><button class="btn" id="ruleNew" type="button"' + (full ? " disabled" : "") + ">Add rule</button></div>" +
        (full ? '<p class="hint">You have reached the rule limit of your plan.</p>' : "")) +
      '<p class="msg" id="pmsg" hidden></p>';
    if (open) syncRule();
  }
  function syncRule() {
    const t = $("r_type").value, a = $("r_action").value;
    $("r_matchBox").hidden = t === "all";
    if (MATCH_HINT[t]) { $("r_match").placeholder = MATCH_HINT[t][0]; $("r_hint").textContent = MATCH_HINT[t][1]; }
    $("r_ttls").hidden = $("r_ttlhint").hidden = a === "bypass";
  }
  async function ruleCall(path, extra) {
    say("pmsg", "", "");
    try {
      const { res, data } = await appPost(path, extra);
      if (commonErrors(res, data)) return false;
      if (!res.ok || !data.success) { say("pmsg", "err", data.error || "That didn’t work. Try again."); return false; }
      cache.rules = data.rules || cache.rules;
      return true;
    } catch (err) { console.error(err); say("pmsg", "err", netErr); return false; }
  }
  async function saveRule() {
    let body;
    try {
      const type = $("r_type").value, action = $("r_action").value, match = $("r_match").value.trim();
      if (type !== "all" && !match) throw new Error("Enter what the rule should match.");
      body = { type, action, name: $("r_name").value.trim(), match: type === "all" ? "*" : match };
      if (action === "cache") { body.browserTtl = readTtl("r_b", "Browser TTL", { optional: true }); body.edgeTtl = readTtl("r_e", "Edge TTL", { optional: true }); }
    } catch (err) { return say("pmsg", "err", err.message); }
    const btn = $("ruleSave"); btn.disabled = true;
    const wasEdit = editingRule && editingRule !== "new";
    const ok = await ruleCall(wasEdit ? "/cache/rules/update" : "/cache/rules/add", wasEdit ? Object.assign({ ruleId: editingRule }, body) : body);
    if (ok) { editingRule = null; render(["ok", wasEdit ? "Rule saved." : "Rule added."]); }
    else if ($("ruleSave")) $("ruleSave").disabled = false;
  }
  async function deleteRule(id) {
    if (!confirm("Delete this cache rule?")) return;
    if (await ruleCall("/cache/rules/delete", { ruleId: id })) { if (editingRule === id) editingRule = null; render(["ok", "Rule deleted."]); }
  }
  async function moveRule(id, dir) {
    const i = cache.rules.findIndex(r => r.id === id);
    if (i < 0) return;
    if (await ruleCall("/cache/rules/update", { ruleId: id, position: i + dir })) render();
  }

  // ---------- purge
  function renderPurge() {
    const l = cache.limits || {}, sel = feat("selectivePurge"), dis = !sel.available;
    const per = l.purgesPerDay === null || l.purgesPerDay === undefined ? "unlimited" : l.purgesPerDay;
    const hist = cache.purgeHistory || [];
    $("panel").innerHTML =
      head("Purge cache", "Make visitors get fresh files. Used today: <b>" + (cache.purgesToday || 0) + "</b> of " + esc(per) + ". " + (cache.lastPurge ? "Last purge: " + esc(fmtDate(cache.lastPurge)) + "." : "No purge yet.")) +
      '<div class="list"><div class="st"><div class="hd"><div class="tx"><div class="t">Purge everything</div><p class="d">Remove every cached file for this app.</p></div>' +
      '<div class="rt"><button class="btn small" id="purgeAll" type="button">Purge everything</button></div></div></div>' +
      '<div class="st' + (dis ? " locked" : "") + '"><div class="hd"><div class="tx"><div class="t">Purge selected files' + lockPill(sel) + '</div><p class="d">Purge by file, path pattern or extension.</p></div>' +
      '<div class="rt"><button class="btn ghost small" id="purgeToggle" type="button"' + (dis ? " disabled" : "") + ">Configure</button></div></div>" +
      '<div class="ed" id="purgeForm" hidden><div class="fg"><label class="label" for="p_paths">Files or paths</label>' +
      '<textarea class="ta" id="p_paths" spellcheck="false" placeholder="/index.html&#10;/blog/*"></textarea>' +
      '<p class="hint">One per line or comma-separated. Use * for a pattern, like /blog/*.</p></div>' +
      '<div class="fg"><label class="label" for="p_ext">Extensions</label><div class="field"><input id="p_ext" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="css,js,png"></div></div>' +
      '<div class="row"><button class="btn small" id="purgeSel" type="button">Purge selected</button></div></div></div></div>' +
      '<p class="msg" id="pmsg" hidden></p>' +
      (hist.length ? '<h3 class="sec">Recent purges</h3><ul class="hist">' +
        hist.slice(0, 8).map(h => "<li><time>" + esc(fmtDate(h.time)) + "</time><span>" + esc(h.scope === "all" ? "Everything" : h.scope) + '</span><span class="pill by">' + esc(h.by || "") + "</span></li>").join("") + "</ul>" : "");
  }
  async function doPurge(body, btn) {
    say("pmsg", "", "");
    if (body.all && !confirm("Purge the whole cache for this app?")) return;
    btn.disabled = true;
    try {
      const { res, data } = await appPost("/cache/purge", body);
      if (commonErrors(res, data)) return;
      if (!res.ok || !data.success) return say("pmsg", "err", data.error || "Couldn’t purge the cache.");
      const g = await appPost("/cache/get", {});
      if (g.res.ok && g.data.success) cache = Object.assign(cache, g.data);
      render(["ok", "Purged. " + (data.note || "")]);
    } catch (err) { console.error(err); say("pmsg", "err", netErr); }
    finally { if (btn.isConnected) btn.disabled = false; }
  }

  // ---------- stats (Enterprise)
  async function renderStats() {
    const P = $("panel"), f = feat("cacheStats"), lead = "See how many requests were served, answered with 304 or bypassed.";
    if (!f.available) { P.innerHTML = head("Cache statistics", lead) + lockPill(f); return; }
    P.innerHTML = head("Cache statistics", "Loading...");
    try {
      const { res, data } = await appPost("/cache/stats", {});
      if (tab !== "stats") return;
      if (commonErrors(res, data)) return;
      if (!res.ok || !data.success) { P.innerHTML = head("Cache statistics", "") + '<p class="msg err">' + esc(data.error || "Couldn’t load the statistics.") + "</p>"; return; }
      const s = data.stats;
      P.innerHTML = head("Cache statistics", "Since your app was created.") + '<div class="stats">' +
        [["Served", s.served], ["Not modified (304)", s.notModified], ["Bypassed", s.bypassed], ["Total", s.total], ["304 rate", (s.notModifiedRate * 100).toFixed(1) + "%"]]
          .map(([k, v]) => '<div class="stat"><b>' + esc(typeof v === "number" ? v.toLocaleString() : v) + "</b><span>" + esc(k) + "</span></div>").join("") +
        '</div><div class="row"><button class="btn ghost small" id="statsRefresh" type="button">Refresh</button></div>';
    } catch (err) { console.error(err); if (tab === "stats") P.innerHTML = head("Cache statistics", "") + '<p class="msg err">' + netErr + "</p>"; }
  }

  // ---------- loading
  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }
  async function loadCache(pw) {
    const { res, data } = await post("/cache/get", { appId: APP_ID, appPassword: pw });
    if (res.status === 401 && /app password/i.test(data.error || "")) { forgetAppPw(); return showPasswordGate("That app password is wrong. Enter the right one."); }
    if (res.status === 401) { location.replace("signup.html"); return; }
    if (!res.ok || !data.success) {
      if ($("pwMsg")) return say("pwMsg", "err", data.error || "Couldn’t load the cache settings.");
      return message("Couldn’t load the cache settings", data.error || "Try again.", "Try again", location.pathname + location.search);
    }
    saveAppPw(pw);
    cache = data;
    build();
  }
  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="layout"><div></div><div class="sk"></div></div>';
    try {
      const { res, data } = await post("/apps/list", {});
      if (res.status === 401) return message("Please sign up again", "We couldn’t verify your account on this device.", "Sign up", "signup.html");
      if (!res.ok || !data.success) throw new Error(data.error || "Request failed");
      app = (data.apps || []).find(a => a.id === APP_ID);
      if (!app) return message("App not found", "This app doesn’t exist or isn’t yours.", "Back to dashboard", "dashboard.html");
      renderHeader();
      const pw = storedAppPw();
      if (pw) await loadCache(pw); else showPasswordGate();
    } catch (err) {
      console.error(err);
      message("Couldn’t load your app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }
  load();
</script>
</body>
</html>
