<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Networking – Fast Site</title>
<meta name="description" content="Change your subdomain and connect a custom domain to your Fast Site app.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html");
  else if(!new URLSearchParams(location.search).get("id"))location.replace("dashboard.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f4f4f5;--line:#e4e4e7;--text:#09090b;--muted:#52525b;--accent:#0e7490;--accent-ink:#fff;--glow:#dff3f7;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;transition:background .2s,color .2s}
  main{flex:1;padding:36px 20px 72px;background:radial-gradient(55% 32% at 50% 0%,var(--glow),transparent 75%)}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  .wrap{max-width:1120px;margin:0 auto}

  .top{margin-bottom:22px}
  h1{font-size:32px;letter-spacing:-.03em;line-height:1.15;margin:0 0 6px}
  .sub{margin:0 0 14px;color:var(--muted);font-size:15px}
  .sub b{color:var(--text)}
  .site{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
  .site a{display:inline-flex;align-items:center;gap:10px;max-width:100%;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:15px;text-decoration:none;transition:border-color .15s,transform .15s}
  .site a:hover{border-color:var(--accent);transform:translateY(-1px)}
  .site a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .site a svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
  .live{width:8px;height:8px;border-radius:50%;background:var(--ok);flex-shrink:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 22%,transparent)}
  .pill{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.plan{background:var(--glow);border-color:transparent;color:var(--accent)}
  .pill.warn{color:var(--danger)}
  .pill.ok{color:var(--ok)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px;margin-bottom:20px;align-items:start}
  .card{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:20px 22px 20px;min-width:0}
  .card.wide{grid-column:1/-1}
  .card h2{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .card .lead{margin:0 0 16px;font-size:14px;color:var(--muted)}
  .label{display:block;margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .label:first-of-type{margin-top:0}

  .chip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:600;font-size:15px;word-break:break-all}
  .chip code{font:inherit}
  .chip .pill{margin-left:auto}

  .field{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;transition:border-color .15s,box-shadow .15s}
  .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .field input{flex:1;min-width:0;padding:11px 14px;border:0;outline:0;background:transparent;color:var(--text);font:500 15px Inter,sans-serif}
  .field input::placeholder{color:var(--muted);opacity:.7}
  .field .sfx{display:flex;align-items:center;padding:0 14px;background:var(--soft);border-left:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
  .hint{margin:7px 0 0;font-size:12.5px;color:var(--muted)}

  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 20px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);transition:opacity .15s,transform .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
  .btn.small{padding:6px 14px;font-size:13px}

  .msg{margin:14px 0 0;padding:10px 14px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:var(--soft)}
  .msg.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
  .msg.err{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
  .msg.info{color:var(--muted)}

  .dns{margin-top:4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dns .r{display:grid;grid-template-columns:78px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 14px;font-size:14px}
  .dns .r+.r{border-top:1px solid var(--line)}
  .dns .k{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .dns .v{font-weight:600;word-break:break-all}
  .steps{margin:0 0 4px;padding-left:20px;color:var(--muted);font-size:14px}
  .steps li{margin:3px 0}
  .steps b{color:var(--text)}

  .sk{border:1px solid var(--line);border-radius:18px;height:260px;background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:22px;background:var(--soft);padding:56px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .empty p{margin:0 0 20px;color:var(--muted)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  @media(max-width:560px){h1{font-size:27px}.grid{grid-template-columns:1fr}.card{padding:18px 16px}.dns .r{grid-template-columns:1fr auto}.dns .k{grid-column:1/-1}.field .sfx{padding:0 10px;font-size:13px}}
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="panelEssentials"></div>

<main>
  <div class="wrap">
    <header class="top">
      <h1>Networking</h1>
      <p class="sub" id="sub">&nbsp;</p>
      <div class="site" id="site"></div>
    </header>
    <div id="content" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";
  const APP_DOMAIN = "fastsite.host";
  const APP_ID = new URLSearchParams(location.search).get("id") || "";
  const NAME_RE = /^[a-z0-9][a-z0-9_-]{2,31}$/;
  let app = null;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  fetch("assets/panel-essentials.html").then(r => r.text()).then(html => {
    const box = $("panelEssentials");
    box.innerHTML = html;
    box.querySelectorAll("script").forEach(old => {
      const s = document.createElement("script");
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }).catch(e => console.error("Could not load panel-essentials.html", e));
  fetch("assets/footer.html").then(r => r.ok ? r.text() : "").then(h => { $("footer").innerHTML = h; }).catch(() => {});

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }
  const storedAppPw = () => { try { return localStorage.getItem("lp-app-password:" + APP_ID) || ""; } catch (e) { return ""; } };
  const saveAppPw = pw => { try { localStorage.setItem("lp-app-password:" + APP_ID, pw); } catch (e) {} };
  const forgetAppPw = () => { try { localStorage.removeItem("lp-app-password:" + APP_ID); } catch (e) {} };

  // the app password is kept on this device when the app was created here; otherwise ask for it
  function appPassword() { return storedAppPw() || ($("apw") ? $("apw").value : ""); }

  async function post(path, extra) {
    const { u, p } = creds();
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ username: u, password: p }, extra))
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { res, data };
  }

  function say(id, kind, text) {
    const el = $(id);
    if (!text) { el.hidden = true; el.textContent = ""; return; }
    el.className = "msg " + kind;
    el.textContent = text;
    el.hidden = false;
  }

  const hostOf = a => a.name.toLowerCase() + "." + APP_DOMAIN;

  function renderHeader() {
    document.title = app.name + " – Networking – Fast Site";
    $("sub").innerHTML = "App <b>" + esc(app.name) + "</b>";
    const host = app.customDomain || hostOf(app);
    $("site").innerHTML =
      '<a href="https://' + esc(host) + '" target="_blank" rel="noopener" aria-label="Open ' + esc(host) + ' in a new tab">' +
      '<i class="live"></i><span>' + esc(host) + '</span>' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3zM5 5h6v2H5v12h12v-6h2v8H3V5z"/></svg></a>' +
      '<span class="pill plan">' + esc((app.plan || "Free") + " plan") + "</span>" +
      (app.customDomain && app.customDomainVerified === false ? '<span class="pill warn">DNS not verified yet</span>' : "");
  }

  function build() {
    $("content").innerHTML =
      '<div class="grid">' +

      '<section class="card" id="cardSub">' +
        "<h2>Subdomain</h2>" +
        '<p class="lead">Your site is always reachable at its free ' + esc(APP_DOMAIN) + " address.</p>" +
        '<span class="label">Current subdomain</span>' +
        '<div class="chip"><i class="live"></i><code id="curSub"></code></div>' +
        '<label class="label" for="newSub">New subdomain</label>' +
        '<div class="field"><input id="newSub" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="my-new-name"><span class="sfx">.' + esc(APP_DOMAIN) + "</span></div>" +
        '<p class="hint">3-32 characters: lowercase a-z, 0-9, - or _. It can\'t start with - or _.</p>' +
        '<div class="row"><button class="btn" id="subBtn" type="button">Change subdomain</button></div>' +
        '<p class="msg" id="subMsg" hidden></p>' +
        '<p class="hint" style="margin-top:14px">The old address stops working right away. Your files and data stay exactly as they are.</p>' +
      "</section>" +

      '<section class="card" id="cardDom">' +
        "<h2>Custom domain</h2>" +
        '<p class="lead">Use your own domain, like <b>www.example.com</b>, instead of the ' + esc(APP_DOMAIN) + " address.</p>" +
        '<div id="domCurrent"></div>' +
        '<ol class="steps"><li>Open the DNS settings of your domain.</li><li>Add a <b>CNAME</b> record that points to your subdomain below.</li><li>Type your domain here and press <b>Connect domain</b>.</li></ol>' +
        '<span class="label">DNS record to add</span>' +
        '<div class="dns">' +
          '<div class="r"><span class="k">Type</span><span class="v">CNAME</span><span></span></div>' +
          '<div class="r"><span class="k">Name</span><span class="v">www <span style="color:var(--muted);font-weight:500">(or your subdomain)</span></span><span></span></div>' +
          '<div class="r"><span class="k">Points to</span><span class="v" id="cnameTarget"></span><button class="btn ghost small" id="copyBtn" type="button">Copy</button></div>' +
        "</div>" +
        '<label class="label" for="domIn">Your domain</label>' +
        '<div class="field"><input id="domIn" type="text" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="253" placeholder="www.example.com"></div>' +
        '<div class="row"><button class="btn" id="domBtn" type="button">Connect domain</button>' +
        '<button class="btn ghost" id="verBtn" type="button" hidden>Verify again</button>' +
        '<button class="btn danger" id="rmBtn" type="button" hidden>Remove domain</button></div>' +
        '<p class="msg" id="domMsg" hidden></p>' +
      "</section>" +

      "</div>" +

      '<section class="card wide" id="cardPw" hidden>' +
        "<h2>App password</h2>" +
        '<p class="lead">Changing networking settings needs your app password. It was shown once when you created the app.</p>' +
        '<div class="field" style="max-width:420px"><input id="apw" type="password" autocomplete="current-password" placeholder="App password"></div>' +
      "</section>";

    $("cardPw").hidden = !!storedAppPw();
    $("subBtn").addEventListener("click", changeSub);
    $("domBtn").addEventListener("click", () => setDomain($("domIn").value));
    $("verBtn").addEventListener("click", () => setDomain(app.customDomain));
    $("rmBtn").addEventListener("click", removeDomain);
    $("copyBtn").addEventListener("click", copyTarget);
    $("newSub").addEventListener("keydown", e => { if (e.key === "Enter") changeSub(); });
    $("domIn").addEventListener("keydown", e => { if (e.key === "Enter") setDomain($("domIn").value); });
    $("newSub").addEventListener("input", e => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, ""); });
    update();
  }

  // refresh everything that depends on the app record
  function update() {
    renderHeader();
    $("curSub").textContent = hostOf(app);
    $("cnameTarget").textContent = hostOf(app);

    const d = app.customDomain;
    $("domCurrent").innerHTML = d
      ? '<span class="label">Connected domain</span><div class="chip"><code>' + esc(d) + "</code>" +
        (app.customDomainVerified === false ? '<span class="pill warn">DNS not verified yet</span>' : '<span class="pill ok">Verified</span>') + "</div>" +
        '<div style="height:16px"></div>'
      : "";
    $("rmBtn").hidden = !d;
    $("verBtn").hidden = !(d && app.customDomainVerified === false);
    $("domBtn").textContent = d ? "Change domain" : "Connect domain";
  }

  function needPassword(msgId) {
    const pw = appPassword();
    if (!pw) {
      $("cardPw").hidden = false;
      $("apw").focus();
      say(msgId, "err", "Enter your app password below first.");
      return null;
    }
    return pw;
  }

  // handles errors every call can return; true = handled
  function commonErrors(res, data, msgId) {
    if (res.status === 401 && /app password/i.test(data.error || "")) {
      forgetAppPw();
      $("cardPw").hidden = false;
      $("apw").value = "";
      $("apw").focus();
      say(msgId, "err", "That app password is wrong. Enter the right one below.");
      return true;
    }
    if (res.status === 401) { location.replace("signup.html"); return true; }
    return false;
  }

  async function changeSub() {
    const name = $("newSub").value.trim().toLowerCase();
    say("subMsg", "", "");
    if (!NAME_RE.test(name)) return say("subMsg", "err", "Use 3-32 characters: a-z, 0-9, - or _ (not starting with - or _).");
    if (name === app.name.toLowerCase()) return say("subMsg", "err", "That is already your subdomain.");
    const pw = needPassword("subMsg");
    if (!pw) return;
    let warn = "Change your subdomain to " + name + "." + APP_DOMAIN + "?\n\nThe old address (" + hostOf(app) + ") will stop working.";
    if (app.customDomain) warn += "\n\nYour custom domain's CNAME must be changed to point to the new subdomain.";
    if (!confirm(warn)) return;

    const btn = $("subBtn");
    btn.disabled = true; btn.textContent = "Changing...";
    try {
      const { res, data } = await post("/apps/rename", { appId: APP_ID, appPassword: pw, newName: name });
      if (commonErrors(res, data, "subMsg")) return;
      if (!res.ok || !data.success) return say("subMsg", "err", data.error || "Couldn't change the subdomain. Try again.");
      saveAppPw(pw);
      app = data.app;
      $("newSub").value = "";
      update();
      let text = "Done. Your site is now at " + hostOf(app) + ".";
      if (data.domain && data.domain.message) text += " " + data.domain.message;
      say("subMsg", data.domain && data.domain.status !== "verified" ? "info" : "ok", text);
    } catch (err) {
      console.error(err);
      say("subMsg", "err", "Network error. Check your connection and try again.");
    } finally {
      btn.disabled = false; btn.textContent = "Change subdomain";
    }
  }

  async function setDomain(value) {
    say("domMsg", "", "");
    const domain = String(value || "").trim();
    if (!domain) return say("domMsg", "err", "Enter your domain, for example www.example.com.");
    const pw = needPassword("domMsg");
    if (!pw) return;

    const btn = $("domBtn"), ver = $("verBtn");
    btn.disabled = true; ver.disabled = true;
    const label = btn.textContent; btn.textContent = "Checking DNS...";
    try {
      const { res, data } = await post("/apps/domain", { appId: APP_ID, appPassword: pw, domain });
      if (commonErrors(res, data, "domMsg")) return;
      if (!res.ok || !data.success) {
        let text = data.error || "Couldn't connect the domain. Try again.";
        if (data.expected && !data.found) text += " DNS changes can take a few minutes to spread.";
        return say("domMsg", "err", text);
      }
      saveAppPw(pw);
      app = data.app;
      $("domIn").value = "";
      update();
      say("domMsg", "ok", app.customDomain + " is connected and verified.");
    } catch (err) {
      console.error(err);
      say("domMsg", "err", "Network error. Check your connection and try again.");
    } finally {
      btn.disabled = false; ver.disabled = false; btn.textContent = app.customDomain ? "Change domain" : "Connect domain";
      if (label === undefined) btn.textContent = "Connect domain";
    }
  }

  async function removeDomain() {
    say("domMsg", "", "");
    const pw = needPassword("domMsg");
    if (!pw) return;
    if (!confirm("Remove " + app.customDomain + " from this app?\n\nYour site will keep working at " + hostOf(app) + ".")) return;
    const btn = $("rmBtn");
    btn.disabled = true;
    try {
      const { res, data } = await post("/apps/domain", { appId: APP_ID, appPassword: pw, remove: true });
      if (commonErrors(res, data, "domMsg")) return;
      if (!res.ok || !data.success) return say("domMsg", "err", data.error || "Couldn't remove the domain. Try again.");
      saveAppPw(pw);
      app = data.app;
      update();
      say("domMsg", "ok", "Custom domain removed.");
    } catch (err) {
      console.error(err);
      say("domMsg", "err", "Network error. Check your connection and try again.");
    } finally {
      btn.disabled = false;
    }
  }

  async function copyTarget() {
    const btn = $("copyBtn"), text = hostOf(app);
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($("cnameTarget"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = "Press Ctrl+C";
    }
    setTimeout(() => { btn.textContent = "Copy"; }, 1800);
  }

  function message(title, text, btn, href) {
    $("content").innerHTML = '<div class="empty"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
      (btn ? '<a class="btn" href="' + esc(href) + '">' + esc(btn) + "</a>" : "") + "</div>";
  }

  async function load() {
    const { u, p } = creds();
    if (!u || !p || !APP_ID) return;
    $("content").innerHTML = '<div class="grid"><div class="sk"></div><div class="sk"></div></div>';
    try {
      const { res, data } = await post("/apps/list", {});
      if (res.status === 401) return message("Please sign up again", "We couldn't verify your account on this device.", "Sign up", "signup.html");
      if (!res.ok || !data.success) throw new Error(data.error || "Request failed");
      app = (data.apps || []).find(a => a.id === APP_ID);
      if (!app) return message("App not found", "This app doesn't exist or isn't yours.", "Back to dashboard", "dashboard.html");
      build();
    } catch (err) {
      console.error(err);
      message("Couldn't load your app", "Check your connection and try again.", "Try again", location.pathname + location.search);
    }
  }

  load();
</script>
</body>
</html>
