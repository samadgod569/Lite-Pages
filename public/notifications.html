<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications – Fast Site</title>
<meta name="description" content="Team invites for Fast Site apps.">
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script>
  (function(){var u,p;try{u=localStorage.getItem("lp-username");p=localStorage.getItem("lp-password")}catch(e){}
  if(!u||!p)location.replace("signup.html")})();
</script>
<script>
  (function(){var t;try{t=localStorage.getItem("lp-theme")}catch(e){}
  if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--soft:#f4f4f5;--line:#e4e4e7;--text:#09090b;--muted:#52525b;--accent:#0e7490;--accent-ink:#fff;--glow:#dff3f7;--danger:#b91c1c;--ok:#16a34a}
  [data-theme=dark]{color-scheme:dark;--bg:#000;--surface:#0a0a0a;--soft:#111113;--line:#262629;--text:#fafafa;--muted:#a1a1aa;--accent:#5be0f0;--accent-ink:#001418;--glow:#0b2c33;--danger:#f87171;--ok:#4ade80}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;transition:background .2s,color .2s}
  main{flex:1;padding:48px 20px 72px;background:radial-gradient(55% 40% at 50% 0%,var(--glow),transparent 75%)}
  svg{fill:currentColor}
  [hidden]{display:none!important}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .wrap{max-width:760px;margin:0 auto}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
  h1{font-size:32px;letter-spacing:-.03em;line-height:1.15;margin:0 0 6px}
  .sub{margin:0;color:var(--muted);font-size:15px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer;border:1px solid var(--text);background:transparent;color:var(--text);transition:background .15s,filter .15s}
  .btn:hover{background:var(--soft)}
  .btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.main:hover{filter:brightness(1.1);background:var(--accent)}
  .btn.sm{padding:8px 16px;font-size:14px}
  .btn:disabled{opacity:.6;cursor:default}

  .tog{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
  .tog input{width:16px;height:16px;accent-color:var(--accent)}

  .list{display:grid;gap:14px}
  .inv{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);transition:border-color .15s,opacity .2s}
  .inv:hover{border-color:var(--accent)}
  .av{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 20px Inter,sans-serif}
  .body{min-width:0;flex:1}
  .body h3{margin:0;font-size:16px;letter-spacing:-.01em}
  .body p{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .body small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
  .acts{display:flex;gap:8px;flex:none}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
  .pill.accepted{color:var(--ok);border-color:var(--ok)}
  .pill.declined,.pill.expired{color:var(--muted)}
  .done{opacity:.85}

  .sk{height:84px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(100deg,var(--soft) 30%,var(--line) 50%,var(--soft) 70%);background-size:300% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-300% 0}}
  .empty{border:1px dashed var(--line);border-radius:22px;background:var(--soft);padding:56px 24px;text-align:center}
  .empty h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .empty p{margin:0 0 22px;color:var(--muted)}
  .empty p:last-child{margin-bottom:0}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;padding:11px 20px;border-radius:999px;transition:.25s;z-index:1000;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media(max-width:560px){
    h1{font-size:27px}
    .inv{flex-wrap:wrap}
    .acts{width:100%}
    .acts .btn{flex:1}
  }
  @media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="navbar"></div>

<main>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Notifications</h1>
        <p class="sub" id="sub">&nbsp;</p>
      </div>
      <label class="tog"><input type="checkbox" id="past"> Show past invites</label>
    </header>

    <div id="list" class="list" aria-live="polite"></div>
  </div>
</main>

<div id="footer"></div>
<div class="toast" id="toast" role="status"></div>

<script>
  const API_BASE = "https://lite-pages.thecodemonai.workers.dev/api";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function loadInto(id, url) {
    const el = $(id);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      el.innerHTML = await res.text();
    } catch (e) { console.error("Could not load " + url, e); }
  }
  loadInto("navbar", "assets/navbar.html");
  loadInto("footer", "assets/footer.html");

  document.addEventListener("click", e => {
    if (!e.target.closest("[data-theme-toggle]")) return;
    const root = document.documentElement;
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("lp-theme", next); } catch (err) {}
  });

  function creds() {
    try { return { u: localStorage.getItem("lp-username"), p: localStorage.getItem("lp-password") }; }
    catch (e) { return { u: null, p: null }; }
  }

  async function api(path, body) {
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!data.error && !res.ok) data.error = "Server error (HTTP " + res.status + ")";
    return { ok: res.ok && data.success === true, status: res.status, data };
  }

  let toastTimer;
  function toast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 3600);
  }

  // Optional: notifications.html?app=<appId> shows only the invites for that app.
  const appFilter = new URLSearchParams(location.search).get("app") || "";
  let invites = [];

  function timeLeft(iso) {
    const ms = Date.parse(iso) - Date.now();
    if (ms <= 0) return "expired";
    const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
    if (h >= 1) return "expires in " + h + "h " + (m % 60) + "m";
    return "expires in " + Math.max(1, m) + "m";
  }

  function when(iso) {
    return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function card(i) {
    const open = i.status === "pending";
    const el = document.createElement("article");
    el.className = "inv" + (open ? "" : " done");
    el.dataset.id = i.id;
    el.innerHTML =
      '<div class="av" aria-hidden="true">' + esc((i.appName || "?").charAt(0).toUpperCase()) + '</div>' +
      '<div class="body">' +
        '<h3>' + esc(i.appName) + '</h3>' +
        '<p>' + (i.invitedBy ? esc(i.invitedBy) + ' invited you to join this app\'s team' : 'You were invited to join this app\'s team') + '</p>' +
        '<small>' + (open ? esc(timeLeft(i.expiresAt)) : '<span class="pill ' + esc(i.status) + '">' + esc(i.status) + '</span> ' + esc(when(i.respondedAt || i.expiresAt))) + '</small>' +
      '</div>' +
      (open ? '<div class="acts"><button class="btn sm" data-act="decline">Decline</button><button class="btn main sm" data-act="accept">Join</button></div>' : '');
    return el;
  }

  function render() {
    const box = $("list");
    box.innerHTML = "";
    const open = invites.filter(i => i.status === "pending").length;
    $("sub").textContent = open
      ? open + (open === 1 ? " invite is" : " invites are") + " waiting for you."
      : "You're all caught up.";
    if (!invites.length) {
      box.innerHTML = '<div class="empty"><h2>No invites</h2><p>When someone invites you to work on their app, it will show up here.</p><a class="btn main" href="dashboard.html">Back to your apps</a></div>';
      return;
    }
    invites.forEach(i => box.appendChild(card(i)));
  }

  function skeleton() {
    $("list").innerHTML = '<div class="sk"></div><div class="sk"></div>';
  }

  function failure(title, text) {
    $("list").innerHTML = '<div class="empty"><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><button class="btn main" id="retry">Try again</button></div>';
    $("retry").addEventListener("click", load);
  }

  async function load() {
    const { u, p } = creds();
    if (!u || !p) { location.replace("signup.html"); return; }
    skeleton();
    const body = { username: u, password: p, all: $("past").checked };
    if (appFilter) body.appId = appFilter;
    try {
      const r = await api("/invites/list", body);
      if (r.status === 401) return failure("Please sign up again", "We couldn't verify your account on this device.");
      if (!r.ok) return failure("Couldn't load your invites", r.data.error || "Please try again.");
      invites = r.data.invites || [];
      render();
    } catch (err) {
      console.error(err);
      failure("Couldn't load your invites", "Check your connection and try again.");
    }
  }

  async function respond(card, act) {
    const { u, p } = creds();
    const id = card.dataset.id;
    const i = invites.find(x => x.id === id);
    const btns = card.querySelectorAll("button");
    btns.forEach(b => b.disabled = true);
    try {
      const r = await api("/invites/" + act, { username: u, password: p, inviteId: id });
      if (!r.ok) {
        toast(r.data.error || "Something went wrong.");
        // expired or already answered: refresh so the list tells the truth
        if (r.status === 404 || r.status === 409 || r.status === 410) load();
        else btns.forEach(b => b.disabled = false);
        return;
      }
      if (act === "accept") {
        // Same place the dashboard keeps app passwords, so the app opens with no extra step.
        if (r.data.appId && r.data.appPassword) {
          try { localStorage.setItem("lp-app-password:" + r.data.appId, r.data.appPassword); } catch (err) {}
          toast("You joined " + (r.data.appName || (i && i.appName) || "the app"));
        } else {
          toast("You joined, but the app password couldn't be retrieved. Ask the owner for it.");
        }
        if (i) { i.status = "accepted"; i.respondedAt = new Date().toISOString(); }
        render();
        const done = $("list").querySelector('[data-id="' + CSS.escape(id) + '"] .body');
        if (done && r.data.appId) {
          done.insertAdjacentHTML("beforeend", '<a class="btn main sm" style="margin-top:10px" href="panel/overview?id=' + encodeURIComponent(r.data.appId) + '">Open app</a>');
        }
      } else {
        toast("Invite declined");
        if (i) { i.status = "declined"; i.respondedAt = new Date().toISOString(); }
        if ($("past").checked) render();
        else { invites = invites.filter(x => x.id !== id); render(); }
      }
    } catch (err) {
      console.error(err);
      toast("Couldn't reach the server. Check your connection and try again.");
      btns.forEach(b => b.disabled = false);
    }
  }

  $("list").addEventListener("click", e => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    respond(b.closest(".inv"), b.dataset.act);
  });
  $("past").addEventListener("change", load);

  load();
</script>
</body>
</html>
