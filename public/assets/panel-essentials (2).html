<!-- Fast Site panel essentials: navbar + sidebar. Load it into every panel page (see the loader at the bottom). -->
<style>
  :root{--lp-nav-h:66px;--lp-side-w:248px}
  #panelEssentials{display:contents} /* keeps the navbar sticky for the whole page */

  /* ---- navbar (same as navbar.html) ---- */
  .lp-nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);color:var(--text)}
  .lp-nav-in{max-width:1180px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .lp-left{display:flex;align-items:center;gap:14px;min-width:0}
  .lp-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--text);text-decoration:none;letter-spacing:-.02em}
  .lp-brand img{height:30px;width:auto;display:block}
  .lp-theme,.lp-side-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;transition:background .2s,transform .2s,border-color .2s;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;padding:0}
  .lp-theme:hover,.lp-side-btn:hover{background:var(--soft);border-color:color-mix(in srgb,var(--text) 22%,var(--line))}.lp-theme:active,.lp-side-btn:active{transform:scale(.94)}
  .lp-theme svg,.lp-side-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .lp-theme .sun{display:none}
  [data-theme=dark] .lp-theme .sun{display:block}
  [data-theme=dark] .lp-theme .moon{display:none}
  .lp-nav a:focus-visible,.lp-nav button:focus-visible,.lp-side a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* ---- sidebar ---- */
  .lp-side{position:fixed;z-index:40;top:var(--lp-nav-h);left:0;bottom:0;width:var(--lp-side-w);display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);color:var(--text);transform:translateX(-100%);visibility:hidden;transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s .28s}
  .lp-side-open .lp-side{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .lp-side-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 10px 10px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .lp-side h2{display:flex;align-items:center;gap:10px;margin:0 10px 8px;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.8}
  .lp-side h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .lp-side ul+h2{margin-top:20px}
  .lp-side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
  .lp-side a{position:relative;display:flex;align-items:center;gap:11px;height:38px;padding:0 12px;border-radius:9px;color:var(--muted);font:500 14px Inter,system-ui,sans-serif;text-decoration:none;isolation:isolate;transition:color .2s ease}
  /* hover surface: fades and slides in from the left */
  .lp-side a::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:color-mix(in srgb,var(--text) 7%,transparent);opacity:0;transform:translateX(-6px) scaleX(.96);transform-origin:left;transition:opacity .22s ease,transform .3s cubic-bezier(.32,.72,0,1),background .2s}
  /* indicator bar */
  .lp-side a::after{content:"";position:absolute;left:0;top:50%;width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--accent);transform:translateY(-50%) scaleY(0);transition:transform .25s cubic-bezier(.32,.72,0,1)}
  .lp-side a svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.34,1.4,.64,1),color .2s}
  .lp-side a .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .3s cubic-bezier(.32,.72,0,1)}
  .lp-side a:hover{color:var(--text)}
  .lp-side a:hover::before{opacity:1;transform:none}
  .lp-side a:hover::after{transform:translateY(-50%) scaleY(.45)}
  .lp-side a:hover svg{transform:scale(1.14);color:var(--accent)}
  .lp-side a:hover .tx{transform:translateX(2px)}
  .lp-side a:active::before{background:color-mix(in srgb,var(--text) 12%,transparent)}
  .lp-side a[aria-current=page]{color:var(--text);font-weight:600}
  .lp-side a[aria-current=page]::before{opacity:1;transform:none;background:color-mix(in srgb,var(--text) 11%,transparent)}
  .lp-side a[aria-current=page]::after{transform:translateY(-50%) scaleY(1)}
  .lp-side a[aria-current=page] svg{color:var(--accent)}
  .lp-side-foot{padding:10px;border-top:1px solid var(--line)}
  .lp-backdrop{position:fixed;z-index:39;inset:var(--lp-nav-h) 0 0 0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}

  /* wide screens: the sidebar pushes the page content */
  @media(min-width:901px){
    main,#footer{transition:margin-left .22s ease}
    .lp-side-open main,.lp-side-open #footer{margin-left:var(--lp-side-w)}
  }
  /* small screens: the sidebar slides over the page */
  @media(max-width:900px){
    .lp-side{box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
    .lp-side-open .lp-backdrop{opacity:1;pointer-events:auto}
  }
  @media(prefers-reduced-motion:reduce){.lp-side,.lp-backdrop,main,#footer,.lp-side *,.lp-side a::before,.lp-side a::after{transition:none!important}}
</style>

<script>
(function () {
  var root = document.documentElement, body = document.body;
  var btn = document.getElementById("lpSideBtn");
  var side = document.getElementById("lpSide");
  var backdrop = document.getElementById("lpBackdrop");
  var wide = matchMedia("(min-width:901px)");

  // 1) keep the app id on every sidebar link
  var id = new URLSearchParams(location.search).get("id") || "";
  side.querySelectorAll("a[data-page]").forEach(function (a) {
    a.href = a.getAttribute("href").split("?")[0] + "?id=" + encodeURIComponent(id);
  });

  // 2) highlight the page we are on
  var here = location.pathname.replace(/\/+$/, "").split("/").pop().replace(/\.html$/, "");
  var cur = side.querySelector('a[data-page="' + here + '"]');
  if (cur) cur.setAttribute("aria-current", "page");

  // 3) open / close the sidebar (wide screens remember the choice, small screens start closed)
  function set(open, save) {
    body.classList.toggle("lp-side-open", open);
    btn.setAttribute("aria-expanded", String(open));
    if (save && wide.matches) { try { localStorage.setItem("lp-sidebar", open ? "open" : "closed"); } catch (e) {} }
  }
  var saved = null;
  try { saved = localStorage.getItem("lp-sidebar"); } catch (e) {}
  set(wide.matches && saved !== "closed", false);

  btn.addEventListener("click", function () { set(!body.classList.contains("lp-side-open"), true); });
  backdrop.addEventListener("click", function () { set(false, false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !wide.matches && body.classList.contains("lp-side-open")) { set(false, false); btn.focus(); }
  });
  side.addEventListener("click", function (e) { if (!wide.matches && e.target.closest("a")) set(false, false); });
  wide.addEventListener("change", function () {
    var s = null; try { s = localStorage.getItem("lp-sidebar"); } catch (e) {}
    set(wide.matches && s !== "closed", false);
  });

  // 4) dark / light switch (skipped if the page already handles it)
  if (!window.__lpThemeBound) {
    window.__lpThemeBound = true;
    document.addEventListener("click", function (e) {
      if (!e.target.closest("[data-theme-toggle]")) return;
      var next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      try { localStorage.setItem("lp-theme", next); } catch (err) {}
    });
  }
})();
</script>

<!--
  HOW TO USE (put this in each panel page, e.g. overview.html, backups.html ...):

  <div id="panelEssentials"></div>
  <main> ... page content ... </main>
  <script>
    fetch("assets/panel-essentials.html").then(r => r.text()).then(html => {
      const box = document.getElementById("panelEssentials");
      box.innerHTML = html;
      // scripts added through innerHTML do not run, so re-create them:
      box.querySelectorAll("script").forEach(old => {
        const s = document.createElement("script");
        s.textContent = old.textContent;
        old.replaceWith(s);
      });
    });
  </script>

  The page needs the same CSS variables as the dashboard (--bg, --surface, --soft, --line, --text, --muted, --accent, --glow)
  and its content inside <main> (a footer with id="footer" is pushed too).
-->
