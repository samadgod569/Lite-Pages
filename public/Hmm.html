<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalStorage Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 24px;
    }

    h2 {
      color: #60a5fa;
    }

    pre {
      background: #1f2937;
      padding: 16px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      min-height: 40px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>lp-password Viewer</h2>
  <pre id="output">Loading...</pre>
  <button onclick="showValue()">Refresh</button>

  <script>
    function showValue() {
      const value = localStorage.getItem("lp-app-password:065b00d66887");

      document.getElementById("output").textContent =
        value !== null ? value : "No value found for lp-password.";
    }

    showValue();
  </script>

</body>
</html>
