<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storage test</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px;font:16px/1.5 system-ui,sans-serif;background:#fff;color:#09090b}
  main{max-width:520px;margin:0 auto}
  h1{font-size:22px;margin:0 0 16px}
  .box{border:1px solid #e4e4e7;border-radius:14px;padding:14px 16px;margin-bottom:12px;word-break:break-all}
  .box small{display:block;color:#52525b}
  .ok{color:#16a34a;font-weight:600}
  .bad{color:#b91c1c;font-weight:600}
  input{width:100%;padding:12px;border:1px solid #e4e4e7;border-radius:10px;font:inherit;margin-bottom:10px}
  button{padding:11px 18px;border-radius:999px;border:1px solid #09090b;background:#0e7490;border-color:#0e7490;color:#fff;font:600 15px system-ui,sans-serif;margin-right:8px;margin-bottom:8px}
  button.ghost{background:#fff;color:#09090b;border-color:#09090b}
  h2{font-size:17px;margin:24px 0 10px}
</style>
</head>
<body>
<main>
  <h1>Storage test</h1>

  <div class="box"><small>This page's address (must match your dashboard)</small><span id="origin"></span></div>
  <div class="box"><small>lp-username</small><span id="u"></span></div>
  <div class="box"><small>lp-password</small><span id="p"></span></div>
  <div class="box"><small>All keys saved on this address</small><span id="keys"></span></div>
  <div class="box"><small>Dashboard would</small><span id="verdict"></span></div>

  <h2>Set them by hand</h2>
  <input id="iu" placeholder="username" autocapitalize="off" autocomplete="off">
  <input id="ip" placeholder="password" autocapitalize="off" autocomplete="off">
  <button id="save">Save</button>
  <button class="ghost" id="clear">Clear both</button>
  <button class="ghost" id="go">Open dashboard</button>
</main>

<script>
  const $ = id => document.getElementById(id);
  function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

  function show(){
    const u = get("lp-username"), p = get("lp-password");
    $("origin").textContent = location.origin;
    $("u").innerHTML = u ? '<span class="ok">found:</span> ' + u.replace(/[<>&]/g, "") : '<span class="bad">missing</span>';
    $("p").innerHTML = p ? '<span class="ok">found</span> (' + p.length + ' characters)' : '<span class="bad">missing</span>';
    let keys = [];
    try { keys = Object.keys(localStorage); } catch(e){}
    $("keys").textContent = keys.length ? keys.join(", ") : "(nothing)";
    $("verdict").innerHTML = (u && p)
      ? '<span class="ok">stay on the dashboard</span>'
      : '<span class="bad">redirect to signup.html</span>';
  }

  $("save").onclick = () => {
    const u = $("iu").value.trim(), p = $("ip").value;
    try {
      if (u) localStorage.setItem("lp-username", u);
      if (p) localStorage.setItem("lp-password", p);
    } catch(e){ alert("This browser blocked storage."); }
    show();
  };
  $("clear").onclick = () => {
    try { localStorage.removeItem("lp-username"); localStorage.removeItem("lp-password"); } catch(e){}
    show();
  };
  $("go").onclick = () => { location.href = "dashboard.html"; };
  show();
</script>
</body>
</html>
