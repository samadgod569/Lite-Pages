<style>
  .lp-nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);color:var(--text)}
  .lp-nav-in{max-width:1180px;margin:0 auto;padding:0 20px;height:66px;display:flex;align-items:center;gap:20px}
  .lp-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;color:var(--text);text-decoration:none;letter-spacing:-.02em}
  .lp-brand img{height:30px;width:auto;display:block}
  .lp-links{display:flex;align-items:center;gap:4px;margin-left:20px}
  .lp-links a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;font-size:15px;font-weight:500}
  .lp-links a:hover{color:var(--text);background:var(--soft)}
  .lp-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .lp-login{color:var(--text);text-decoration:none;font-size:15px;font-weight:500;padding:8px 6px}
  .lp-pill{background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;padding:9px 18px;border-radius:10px;font-size:15px}
  .lp-pill:hover{filter:brightness(1.08)}
  .lp-theme,.lp-burger{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;padding:0}
  .lp-theme:hover,.lp-burger:hover{background:var(--soft)}
  .lp-theme svg,.lp-burger svg{width:20px;height:20px;fill:currentColor}
  .lp-theme .sun{display:none}
  [data-theme=dark] .lp-theme .sun{display:block}
  [data-theme=dark] .lp-theme .moon{display:none}
  .lp-toggle,.lp-burger{display:none}
  @media(max-width:860px){
    .lp-burger{display:grid}
    .lp-login{display:none}
    .lp-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 18px;margin:0}
    .lp-toggle:checked~.lp-links{display:flex}
  }
</style>
<nav class="lp-nav" aria-label="Main">
  <div class="lp-nav-in">
    <a class="lp-brand" href="index.html"><img src="images/logo.png" alt="Lite Pages logo"><span>Lite Pages</span></a>
    <input type="checkbox" id="lp-toggle" class="lp-toggle" aria-label="Toggle menu">
    <div class="lp-links">
      <a href="features.html">Features</a>
      <a href="pricing.html">Pricing</a>
      <a href="docs.html">Docs</a>
      <a href="blog.html">Blog</a>
      <a href="login.html">Log in</a>
    </div>
    <div class="lp-right">
      <button class="lp-theme" data-theme-toggle type="button" aria-label="Switch between dark and light mode">
        <svg class="moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4A9.2 9.2 0 0 0 12 3z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2v-2H2v2zm18 0h2v-2h-2v2zM11 2v2h2V2h-2zm0 18v2h2v-2h-2zM5.99 4.58 4.58 5.99l1.41 1.41 1.42-1.41-1.42-1.42zm12.02 12.02-1.41 1.41 1.41 1.42 1.42-1.42-1.42-1.41zM18.01 7.4l1.41-1.41-1.41-1.41-1.42 1.41 1.42 1.41zM6 16.6l-1.42 1.41 1.42 1.42 1.41-1.42L6 16.6z"/></svg>
      </button>
      <a class="lp-pill" href="signup.html">Get started</a>
      <label for="lp-toggle" class="lp-burger" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></label>
    </div>
  </div>
</nav>
